자해야 하는 이유는 민간 기업이 감당하기 어려운 기초연구와 인재 양성이 필요하기 때문입니다. 다만 예산을 투입한다면 연구 목표, 중간 평가, 민간 이전 계획을 투명하게 공개해야 합니다. 실패를 완전히 없애려 하면 도전적 연구가 사라지므로 책임 있는 실패를 인정하는 문화도 필요합니다. 성과는 단기 논문 수만이 아니라 핵심 인력, 특허, 산업 적용, 국제 협력 수준으로 평가해야 합니다.","check":"국가전략기술 투자계획, 우주항공청·양자전략 추진 현황, 인재양성 사업","sources":["https://www.msit.go.kr"],"pdf":[{"part":1,"number":13,"title":"누리호 발사와 우주개발 경쟁","tag":"과학·국제","page":9,"text":"핵심 팩트\n우주항공청이 2026년 10월 7일 누리호 5차 발사일을 확정 발표 —  국내 최초의 군집위성 시대를 여는 발사로 독자적\n위성망 확보에 의미\n우주항공청 출범(2024년) 이후 정책 조정력이 실제 성과로 이어지는 사례로 주목\n위성통신·관측·발사체가 안보와 산업 인프라로 확대되는 가운데, 우주쓰레기·군사화·주파수·궤도 선점 문제도 함께 심\n화\n예상 질문 우주개발에 막대한 세금을 써야 하는가?\n답변 방향 기후·통신·재난·국방에 파급효과가 있어 장기 투자가 필요합니다. 다만 명확한 임무와 단계별 성과, 민\n간 활용, 우주쓰레기 책임을 조건으로 해야 합니다.","target":"양자기술·우주항공 경쟁과 국가 연구개발"},{"part":3,"number":28,"title":"양자기술과 암호체계 전환","tag":"과학·안보","page":14,"text":"양자컴퓨팅은 신약·소재 개발 가능성과 함께 기존 암호체계 붕괴 위험을 동시에 지녀, 양자내성암호로의 선제적 전환이 논의된다.","target":"양자기술·우주항공 경쟁과 국가 연구개발"},{"part":3,"number":56,"title":"국가 R&D와 도전적 연구","tag":"과학·정책","page":16,"text":"단기 성과 중심 평가가 혁신 연구를 위축시킬 수 있어, 성실한 실패를 인정하고 과정의 투명성을 평가하는 방식으로의 전환이 논의\n된다.","target":"양자기술·우주항공 경쟁과 국가 연구개발"}],"origin":"기존 자료","id":"issue-028","order":27,"originalTitle":"양자기술·우주항공 경쟁과 국가 연구개발","summary":"양자, 우주항공, 첨단 과학기술은 안보와 산업 경쟁력의 기반이지만, 장기 투자와 실패 허용 문화를 필요로 한다.","prep":{"point":"양자기술과 우주항공은 당장 성과가 보이지 않아도 미래 산업과 안보를 좌우할 수 있는 분야입니다.","reason":"국가가 장기 R&D에 투자해야 하는 이유는 민간 기업이 감당하기 어려운 기초연구와 인재 양성이 필요하기 때문입니다. 다만 예산을 투입한다면 연구 목표, 중간 평가, 민간 이전 계획을 투명하게 공개해야 합니다.","example":"적용 예시(제안): 장기 연구 지원 사업에 중간 점검과 실패의 학습 기록을 두되 단기 논문 수만으로 평가하지 않는 방안을 제안할 수 있습니다.","pointAgain":"성과는 단기 논문 수만이 아니라 핵심 인력, 특허, 산업 적용, 국제 협력 수준으로 평가해야 합니다."},"originalNotes":"핵심 팩트\n우주항공청이 2026년 10월 7일 누리호 5차 발사일을 확정 발표 —  국내 최초의 군집위성 시대를 여는 발사로 독자적\n위성망 확보에 의미\n우주항공청 출범(2024년) 이후 정책 조정력이 실제 성과로 이어지는 사례로 주목\n위성통신·관측·발사체가 안보와 산업 인프라로 확대되는 가운데, 우주쓰레기·군사화·주파수·궤도 선점 문제도 함께 심\n화\n예상 질문 우주개발에 막대한 세금을 써야 하는가?\n답변 방향 기후·통신·재난·국방에 파급효과가 있어 장기 투자가 필요합니다. 다만 명확한 임무와 단계별 성과, 민\n간 활용, 우주쓰레기 책임을 조건으로 해야 합니다.\n\n양자컴퓨팅은 신약·소재 개발 가능성과 함께 기존 암호체계 붕괴 위험을 동시에 지녀, 양자내성암호로의 선제적 전환이 논의된다.\n\n단기 성과 중심 평가가 혁신 연구를 위축시킬 수 있어, 성실한 실패를 인정하고 과정의 투명성을 평가하는 방식으로의 전환이 논의\n된다.","evidenceCheck":"국가전략기술 투자계획, 우주항공청·양자전략 추진 현황, 인재양성 사업","lens":["공학","자연과학","산업공학","과학기술정책"],"lensQuestion":"기술 원리와 성능뿐 아니라 안전·자원·검증 방법을 함께 설명해 보세요.","followup":"성과가 늦게 나타나 재정 투입의 정당성을 설명하기 어렵다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"에너지 믹스와 원전·재생에너지 갈등","keywords":"에너지 믹스 원전 재생에너지 전력망 전기요금 탄소중립","conflict":"안정적 전력 공급 ↔ 안전·환경·비용","background":"AI 데이터센터, 전기차, 산업 전환으로 전력 수요가 늘면서 원전과 재생에너지, 전력망 투자, 전기요금 현실화가 함께 논의된다.","pro":["원전은 탄소 배출이 낮고 안정적 전력 공급에 유리하다.","재생에너지는 장기적으로 탄소중립과 분산형 전원에 필요하다.","전력망 투자는 산업 경쟁력과 직결된다."],"con":["원전은 사고 위험, 폐기물, 지역 수용성 문제가 있다.","재생에너지는 간헐성과 입지 갈등, 저장장치 비용이 있다.","전기요금 인상은 가계와 중소기업 부담을 키운다."],"questions":["탄소중립을 위해 원전과 재생에너지를 어떻게 조합해야 하는가?","전기요금 현실화가 필요한가?","에너지 정책에서 지역 주민의 동의는 어디까지 필요할까?"],"answer":"에너지 믹스는 어느 하나가 정답인 문제가 아니라 안정성, 안전성, 비용, 탄소감축을 함께 따져야 합니다. 원전은 안정적인 저탄소 전력을 공급할 수 있지만 폐기물과 안전 문제가 있습니다. 재생에너지는 탄소중립에 필수지만 전력망과 저장장치가 따라와야 합니다. 저는 원전과 재생에너지의 이념 대립보다 수요관리, 전력망 투자, 지역 이익 공유, 취약계층 요금 보호를 함께 설계해야 한다고 봅니다. 성공은 발전 비중 하나가 아니라 정전 위험, 탄소배출, 요금 부담, 지역 수용성을 종합해 판단해야 합니다.","check":"전력수급기본계획, 재생에너지 입지 정책, 원전 계속운전·폐기물 논의","sources":["https://www.motie.go.kr"],"pdf":[{"part":3,"number":11,"title":"원전 확대와 재생에너지 전환","tag":"환경·산업","page":12,"text":"AI 데이터센터 확산으로 전력 수요가 급증하면서 원전과 재생에너지를 함께 확대하는 현실적 조합의 필요성이 커지고 있다.","target":"에너지 믹스와 원전·재생에너지 갈등"}],"origin":"기존 자료","id":"issue-029","order":28,"originalTitle":"에너지 믹스와 원전·재생에너지 갈등","summary":"AI 데이터센터, 전기차, 산업 전환으로 전력 수요가 늘면서 원전과 재생에너지, 전력망 투자, 전기요금 현실화가 함께 논의된다.","prep":{"point":"에너지 믹스는 어느 하나가 정답인 문제가 아니라 안정성, 안전성, 비용, 탄소감축을 함께 따져야 합니다.","reason":"원전은 안정적인 저탄소 전력을 공급할 수 있지만 폐기물과 안전 문제가 있습니다. 재생에너지는 탄소중립에 필수지만 전력망과 저장장치가 따라와야 합니다.","example":"적용 예시(제안): 전원별 발전 비용만 비교하지 않고 송전망·저장·안전·주민 수용성을 같은 기준표에 넣을 수 있습니다.","pointAgain":"성공은 발전 비중 하나가 아니라 정전 위험, 탄소배출, 요금 부담, 지역 수용성을 종합해 판단해야 합니다."},"originalNotes":"AI 데이터센터 확산으로 전력 수요가 급증하면서 원전과 재생에너지를 함께 확대하는 현실적 조합의 필요성이 커지고 있다.","evidenceCheck":"전력수급기본계획, 재생에너지 입지 정책, 원전 계속운전·폐기물 논의","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"원전은 사고 위험, 폐기물, 지역 수용성 문제가 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"사회·문화·미디어","title":"뉴스 알고리즘과 여론 양극화","keywords":"뉴스 알고리즘 여론 양극화 플랫폼 추천 허위정보 미디어 리터러시","conflict":"맞춤형 정보 ↔ 공론장 왜곡·확증편향","background":"포털과 SNS 추천 알고리즘은 편리하지만, 이용자가 비슷한 의견만 접하고 허위정보가 빠르게 확산될 위험이 있다.","pro":["맞춤형 추천은 이용자가 필요한 정보를 빠르게 찾게 한다.","소규모 언론과 창작자도 독자에게 도달할 기회를 얻는다.","알고리즘 투명성 강화는 플랫폼 책임을 높일 수 있다."],"con":["자극적 콘텐츠가 더 많이 노출되어 사회 갈등이 커질 수 있다.","알고리즘 기준이 불투명하면 여론 조작 의심이 생긴다.","이용자는 자신과 비슷한 의견만 접하는 확증편향에 빠질 수 있다."],"questions":["뉴스 추천 알고리즘은 중립적일 수 있는가?","허위정보 대응에서 국가와 플랫폼의 역할은 어떻게 나눠야 하는가?","미디어 리터러시 교육이 왜 필요한가?"],"answer":"뉴스 알고리즘은 단순한 기술이 아니라 우리가 어떤 사회 문제를 중요하게 느끼는지에 영향을 줍니다. 맞춤형 추천은 편리하지만, 클릭을 많이 유도하는 자극적 콘텐츠가 우선되면 여론 양극화가 심해질 수 있습니다. 저는 플랫폼이 추천 기준과 광고성 콘텐츠를 더 투명하게 공개하고, 허위정보 신고와 정정 절차를 강화해야 한다고 봅니다. 다만 정부가 직접 내용을 통제하면 표현의 자유 침해가 생길 수 있으므로 독립기구와 시민 검증이 필요합니다. 학교는 출처 확인과 통계 읽기 같은 미디어 리터러시를 가르쳐야 합니다.","check":"플랫폼 알고리즘 투명성 법안, 허위정보 자율규제, 청소년 미디어 교육","sources":["https://www.kcc.go.kr"],"pdf":[{"part":3,"number":8,"title":"플랫폼 알고리즘과 정치 양극화","tag":"미디어·사회","page":12,"text":"추천 알고리즘이 확증편향과 자극적 정보 확산을 키울 수 있어, 알고리즘 투명성과 미디어 리터러시 강화가 대안으로 거론된다.","target":"뉴스 알고리즘과 여론 양극화"}],"origin":"기존 자료","id":"issue-030","order":29,"originalTitle":"뉴스 알고리즘과 여론 양극화","summary":"포털과 SNS 추천 알고리즘은 편리하지만, 이용자가 비슷한 의견만 접하고 허위정보가 빠르게 확산될 위험이 있다.","prep":{"point":"뉴스 알고리즘은 단순한 기술이 아니라 우리가 어떤 사회 문제를 중요하게 느끼는지에 영향을 줍니다.","reason":"맞춤형 추천은 편리하지만, 클릭을 많이 유도하는 자극적 콘텐츠가 우선되면 여론 양극화가 심해질 수 있습니다. 저는 플랫폼이 추천 기준과 광고성 콘텐츠를 더 투명하게 공개하고, 허위정보 신고와 정정 절차를 강화해야 한다고 봅니다.","example":"적용 예시(제안): 뉴스 추천에 선택권과 추천 이유 설명을 추가하고 다른 관점의 자료에 접근하기 쉽게 만들 수 있습니다.","pointAgain":"학교는 출처 확인과 통계 읽기 같은 미디어 리터러시를 가르쳐야 합니다."},"originalNotes":"추천 알고리즘이 확증편향과 자극적 정보 확산을 키울 수 있어, 알고리즘 투명성과 미디어 리터러시 강화가 대안으로 거론된다.","evidenceCheck":"플랫폼 알고리즘 투명성 법안, 허위정보 자율규제, 청소년 미디어 교육","lens":["미디어커뮤니케이션","사회학","문화콘텐츠","교육학"],"lensQuestion":"정보 전달과 문화 참여가 사람들의 판단·접근성에 미치는 영향을 살펴보세요.","followup":"자극적 콘텐츠가 더 많이 노출되어 사회 갈등이 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"사회·문화·미디어","title":"OTT·숏폼 시대의 독서와 문해력","keywords":"문해력 숏폼 OTT 독서 교육 집중력 디지털미디어 청소년","conflict":"디지털 접근성 ↔ 깊이 있는 읽기·사고력","background":"짧은 영상과 빠른 콘텐츠 소비가 늘면서 학생 문해력과 집중력, 독서 교육의 의미를 묻는 면접 질문으로 확장된다.","pro":["디지털 콘텐츠는 지식 접근성을 높이고 다양한 표현 방식을 제공한다.","영상과 텍스트를 결합하면 학습 동기를 높일 수 있다.","미디어 제작 활동은 비판적 사고를 기를 수 있다."],"con":["짧은 자극에 익숙해지면 긴 글을 읽고 논증하는 힘이 약해질 수 있다.","알고리즘 소비가 독서 시간을 줄일 수 있다.","정보를 빠르게 훑는 습관이 깊은 이해를 방해할 수 있다."],"questions":["숏폼 콘텐츠가 문해력에 미치는 영향을 어떻게 볼 수 있을까?","학교 독서교육은 디지털 시대에 어떻게 바뀌어야 하는가?","영상 자료를 활용한 수업의 장점과 한계를 말해 보라."],"answer":"숏폼과 OTT가 무조건 나쁘다고 보기는 어렵습니다. 디지털 콘텐츠는 어려운 개념을 쉽게 접하게 하고, 학생이 직접 표현할 기회도 줍니다. 그러나 면접이나 대학 공부에서 중요한 능력은 긴 글을 읽고 근거를 비교하며 자신의 입장을 세우는 힘입니다. 짧은 영상만 반복해서 소비하면 이 능력이 약해질 수 있습니다. 저는 학교가 영상 활용을 금지하기보다 영상 내용을 글로 요약하고, 출처를 확인하며, 긴 글 읽기와 토론으로 연결해야 한다고 봅니다. 성과는 독서량뿐 아니라 비판적 질문과 논증 능력으로 평가해야 합니다.","check":"국가수준 학업성취도·문해력 조사, 독서교육 정책, 디지털 미디어 이용 통계","sources":["https://www.moe.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-031","order":30,"originalTitle":"OTT·숏폼 시대의 독서와 문해력","summary":"짧은 영상과 빠른 콘텐츠 소비가 늘면서 학생 문해력과 집중력, 독서 교육의 의미를 묻는 면접 질문으로 확장된다.","prep":{"point":"숏폼과 OTT가 무조건 나쁘다고 보기는 어렵습니다.","reason":"디지털 콘텐츠는 어려운 개념을 쉽게 접하게 하고, 학생이 직접 표현할 기회도 줍니다. 그러나 면접이나 대학 공부에서 중요한 능력은 긴 글을 읽고 근거를 비교하며 자신의 입장을 세우는 힘입니다.","example":"적용 예시(제안): 짧은 영상에서 본 주장을 긴 글과 원자료로 다시 확인하는 수업 과제를 설계할 수 있습니다.","pointAgain":"성과는 독서량뿐 아니라 비판적 질문과 논증 능력으로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"국가수준 학업성취도·문해력 조사, 독서교육 정책, 디지털 미디어 이용 통계","lens":["미디어커뮤니케이션","사회학","문화콘텐츠","교육학"],"lensQuestion":"정보 전달과 문화 참여가 사람들의 판단·접근성에 미치는 영향을 살펴보세요.","followup":"짧은 자극에 익숙해지면 긴 글을 읽고 논증하는 힘이 약해질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"선거제도 개편과 대표성","keywords":"선거제도 비례대표 대표성 양당제 정치개혁 사표","conflict":"대표성 확대 ↔ 정치 안정·제도 복잡성","background":"선거제도는 국민의 표가 의석으로 어떻게 바뀌는지를 정하는 규칙이다. 대표성과 안정성 사이의 균형이 면접 쟁점이다.","pro":["비례성이 높아지면 다양한 의견이 국회에 반영된다.","사표를 줄이고 유권자의 선택권을 넓힌다.","소수자와 청년 의제가 정치에 들어올 가능성이 커진다."],"con":["정당이 너무 많아지면 정부 구성과 정책 추진이 어려워질 수 있다.","복잡한 제도는 유권자의 이해를 낮출 수 있다.","정당 간 협상이 밀실 정치로 보일 수 있다."],"questions":["선거제도에서 대표성과 안정성 중 무엇이 더 중요한가?","사표를 줄이는 것이 왜 민주주의에 중요한가?","청소년 정치교육에서 선거제도를 어떻게 가르쳐야 할까?"],"answer":"선거제도는 정치의 경기 규칙이기 때문에 공정성과 이해 가능성이 모두 중요합니다. 비례성을 높이면 더 다양한 의견이 국회에 반영되고 사표가 줄어듭니다. 반면 정당이 지나치게 분산되면 정책 책임이 흐려지고 정부 운영이 어려워질 수 있습니다. 저는 대표성을 높이되 유권자가 쉽게 이해할 수 있는 방식이어야 하며, 제도 개편은 특정 정당의 유불리가 아니라 국민의 표가 얼마나 공정하게 반영되는지를 기준으로 해야 한다고 봅니다. 성공은 의석 계산만이 아니라 투표율, 정치 신뢰, 정책 책임성으로 평가해야 합니다.","check":"국회 선거제 개편 논의, 비례대표 제도, 청년·여성 대표성 통계","sources":["https://www.nec.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-032","order":31,"originalTitle":"선거제도 개편과 대표성","summary":"선거제도는 국민의 표가 의석으로 어떻게 바뀌는지를 정하는 규칙이다.","prep":{"point":"선거제도는 정치의 경기 규칙이기 때문에 공정성과 이해 가능성이 모두 중요합니다.","reason":"비례성을 높이면 더 다양한 의견이 국회에 반영되고 사표가 줄어듭니다. 반면 정당이 지나치게 분산되면 정책 책임이 흐려지고 정부 운영이 어려워질 수 있습니다.","example":"적용 예시(제안): 선거제도를 비교할 때 비례성·지역 대표성·책임 정치가 어떻게 달라지는지 같은 모형으로 분석할 수 있습니다.","pointAgain":"성공은 의석 계산만이 아니라 투표율, 정치 신뢰, 정책 책임성으로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"국회 선거제 개편 논의, 비례대표 제도, 청년·여성 대표성 통계","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"정당이 너무 많아지면 정부 구성과 정책 추진이 어려워질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"북핵·한반도 안보와 확장억제","keywords":"북핵 한반도 안보 확장억제 핵무장 평화 외교 군비경쟁","conflict":"안보 억제 ↔ 군비경쟁·평화체제","background":"북핵 위협 속에서 확장억제, 자체 핵무장론, 제재와 대화의 균형은 국제정치와 윤리 판단을 함께 요구한다.","pro":["강한 억제력은 도발을 막고 국민 안전을 지키는 데 필요하다.","동맹 기반 확장억제는 자체 핵무장보다 국제 규범 비용이 낮다.","안보가 안정되어야 경제와 일상도 유지된다."],"con":["군비경쟁은 긴장을 높이고 우발 충돌 위험을 키울 수 있다.","핵무장론은 국제 제재와 외교적 고립을 초래할 수 있다.","억제만으로는 장기적 평화체제를 만들기 어렵다."],"questions":["북핵 문제에서 억제와 대화는 어떻게 병행해야 하는가?","자체 핵무장 주장의 장단점을 말해 보라.","청소년이 안보 문제를 평화와 함께 생각해야 하는 이유는 무엇인가?"],"answer":"북핵 문제에서 국민 안전을 지키기 위한 억제력은 필요합니다. 그러나 안보를 군사력 강화만으로 이해하면 긴장이 계속 높아질 수 있습니다. 저는 확장억제와 방어태세를 유지하되, 우발 충돌 방지와 인도적 협력, 비핵화 대화의 문도 열어 두어야 한다고 봅니다. 자체 핵무장은 단기적으로 강해 보일 수 있지만 국제 제재와 동맹 균열, 핵확산 위험이 큽니다. 면접에서는 강경론과 평화론 중 하나만 고르기보다 국민 안전, 국제규범, 장기 평화체제를 함께 고려하는 균형이 중요합니다.","check":"북한 핵·미사일 동향, 한미 확장억제 협의, 남북·북미 대화 상태","sources":["https://www.mofa.go.kr"],"pdf":[{"part":3,"number":10,"title":"북한 핵·미사일과 대화 재개","tag":"안보·국제","page":12,"text":"북한이 핵·미사일 역량을 고도화하고 러시아와 협력을 강화하는 가운데, 억지와 대화를 병행하는 접근이 논의된다.","target":"북핵·한반도 안보와 확장억제"}],"origin":"기존 자료","id":"issue-033","order":32,"originalTitle":"북핵·한반도 안보와 확장억제","summary":"북핵 위협 속에서 확장억제, 자체 핵무장론, 제재와 대화의 균형은 국제정치와 윤리 판단을 함께 요구한다.","prep":{"point":"북핵 문제에서 국민 안전을 지키기 위한 억제력은 필요합니다.","reason":"그러나 안보를 군사력 강화만으로 이해하면 긴장이 계속 높아질 수 있습니다. 저는 확장억제와 방어태세를 유지하되, 우발 충돌 방지와 인도적 협력, 비핵화 대화의 문도 열어 두어야 한다고 봅니다.","example":"적용 예시(제안): 안보 대안을 평가할 때 억제력과 오판 위험, 위기 연락 채널과 주민 안전을 함께 검토할 수 있습니다.","pointAgain":"면접에서는 강경론과 평화론 중 하나만 고르기보다 국민 안전, 국제규범, 장기 평화체제를 함께 고려하는 균형이 중요합니다."},"originalNotes":"북한이 핵·미사일 역량을 고도화하고 러시아와 협력을 강화하는 가운데, 억지와 대화를 병행하는 접근이 논의된다.","evidenceCheck":"북한 핵·미사일 동향, 한미 확장억제 협의, 남북·북미 대화 상태","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"군비경쟁은 긴장을 높이고 우발 충돌 위험을 키울 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"난민 보호와 국경관리","keywords":"난민 국경관리 인권 이주 국제법 사회통합 심사","conflict":"인도주의 보호 ↔ 사회 수용성·안보","background":"분쟁과 기후위기로 난민 문제가 커지면서, 인도주의 원칙과 국경관리, 사회통합 비용을 어떻게 조화할지가 쟁점이다.","pro":["박해를 피해 온 사람을 보호하는 것은 국제사회 책임이다.","인권 기준을 지키는 국가는 국제적 신뢰를 얻는다.","적절한 통합정책은 장기적으로 사회 다양성과 노동력에 도움이 된다."],"con":["심사 제도가 부실하면 안보와 사회갈등 우려가 커질 수 있다.","지역사회 준비 없이 수용하면 교육·주거·일자리 갈등이 생긴다.","허위 신청과 장기 체류 문제를 관리해야 한다."],"questions":["난민 보호는 국가의 의무인가, 선택인가?","인권과 국경관리가 충돌할 때 기준은 무엇인가?","난민 수용에서 지역사회 갈등을 줄이는 방법은 무엇인가?"],"answer":"난민 문제는 감정적 찬반보다 국제법과 현실적 수용 능력을 함께 봐야 합니다. 박해와 전쟁을 피해 온 사람을 보호하는 것은 인도주의 원칙이자 국제사회 책임입니다. 그러나 심사와 통합정책이 부실하면 지역사회 갈등이 커질 수 있습니다. 저는 신속하고 공정한 난민 심사, 취약계층 우선 보호, 한국어·교육·취업 지원, 지역 주민과의 소통이 필요하다고 봅니다. 동시에 허위 신청은 제도 신뢰를 위해 관리해야 합니다. 성공은 수용 인원만이 아니라 인권 보호와 사회 갈등 감소를 함께 봐야 합니다.","check":"난민 인정률, 심사 기간, 국제분쟁·기후난민 동향","sources":["https://www.unhcr.org/kr/"],"pdf":[],"origin":"기존 자료","id":"issue-034","order":33,"originalTitle":"난민 보호와 국경관리","summary":"분쟁과 기후위기로 난민 문제가 커지면서, 인도주의 원칙과 국경관리, 사회통합 비용을 어떻게 조화할지가 쟁점이다.","prep":{"point":"난민 문제는 감정적 찬반보다 국제법과 현실적 수용 능력을 함께 봐야 합니다.","reason":"박해와 전쟁을 피해 온 사람을 보호하는 것은 인도주의 원칙이자 국제사회 책임입니다. 그러나 심사와 통합정책이 부실하면 지역사회 갈등이 커질 수 있습니다.","example":"적용 예시(제안): 신청 절차의 공정성과 심사 역량을 높이고 정착 단계의 언어·주거 지원을 함께 검토할 수 있습니다.","pointAgain":"성공은 수용 인원만이 아니라 인권 보호와 사회 갈등 감소를 함께 봐야 합니다."},"originalNotes":"","evidenceCheck":"난민 인정률, 심사 기간, 국제분쟁·기후난민 동향","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"심사 제도가 부실하면 안보와 사회갈등 우려가 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"플라스틱 국제협약과 순환경제","keywords":"플라스틱 국제협약 순환경제 일회용품 재활용 생산자책임","conflict":"환경보호 ↔ 소비 편의·산업 비용","background":"플라스틱 오염은 해양생태계와 건강 문제로 확장되며, 재활용을 넘어 생산 감축과 생산자 책임을 묻는 국제 의제가 되었다.","pro":["생산 단계부터 줄여야 재활용 한계를 극복할 수 있다.","생산자 책임을 강화하면 친환경 설계가 늘어난다.","해양오염과 미세플라스틱 피해를 줄일 수 있다."],"con":["일회용품 규제는 소비자와 소상공인의 불편·비용을 키울 수 있다.","대체 소재도 환경 부담이 있을 수 있다.","국가별 산업구조 차이를 고려하지 않으면 합의가 어렵다."],"questions":["플라스틱 문제는 재활용만으로 해결될 수 있는가?","일회용품 규제에서 소비자 불편은 어디까지 감수해야 하는가?","기업의 생산자책임을 강화해야 하는 이유는 무엇인가?"],"answer":"플라스틱 문제는 분리배출만 열심히 한다고 해결되지 않습니다. 재활용이 어려운 복합재질과 과도한 포장 자체를 줄여야 합니다. 저는 소비자에게만 책임을 돌리기보다 생산자가 재활용 가능한 설계를 하고 회수 비용을 부담하도록 해야 한다고 봅니다. 다만 규제가 갑자기 강화되면 소상공인과 소비자의 비용이 커질 수 있으므로 대체재 지원과 단계적 시행이 필요합니다. 국제협약도 국가별 산업 여건을 고려하되 감축 목표와 생산자 책임이라는 원칙은 분명히 해야 합니다.","check":"플라스틱 국제협약 협상 결과, 일회용품 규제, 생산자책임재활용제도","sources":["https://www.me.go.kr"],"pdf":[{"part":3,"number":37,"title":"플라스틱·순환경제와 생산자책임","tag":"환경·산업","page":14,"text":"재활용만으로 생산 증가를 따라가기 어려운 상황에서, 제품 설계 단계부터의 생산자책임과 보증금제가 대안으로 논의된다.","target":"플라스틱 국제협약과 순환경제"}],"origin":"기존 자료","id":"issue-035","order":34,"originalTitle":"플라스틱 국제협약과 순환경제","summary":"플라스틱 오염은 해양생태계와 건강 문제로 확장되며, 재활용을 넘어 생산 감축과 생산자 책임을 묻는 국제 의제가 되었다.","prep":{"point":"플라스틱 문제는 분리배출만 열심히 한다고 해결되지 않습니다.","reason":"재활용이 어려운 복합재질과 과도한 포장 자체를 줄여야 합니다. 저는 소비자에게만 책임을 돌리기보다 생산자가 재활용 가능한 설계를 하고 회수 비용을 부담하도록 해야 한다고 봅니다.","example":"적용 예시(제안): 일회용품 정책을 바꾼다면 회수율·재사용 횟수·운송 부담과 영세업체 비용을 함께 평가할 수 있습니다.","pointAgain":"국제협약도 국가별 산업 여건을 고려하되 감축 목표와 생산자 책임이라는 원칙은 분명히 해야 합니다."},"originalNotes":"재활용만으로 생산 증가를 따라가기 어려운 상황에서, 제품 설계 단계부터의 생산자책임과 보증금제가 대안으로 논의된다.","evidenceCheck":"플라스틱 국제협약 협상 결과, 일회용품 규제, 생산자책임재활용제도","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"일회용품 규제는 소비자와 소상공인의 불편·비용을 키울 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"플랫폼 노동과 알고리즘 관리","keywords":"플랫폼 노동 배달 라이더 알고리즘 관리 노동자성 산재 최저임금","conflict":"유연한 일자리 ↔ 노동권·사회보험","background":"배달·대리·프리랜서 플랫폼 노동은 자유로운 일처럼 보이지만, 알고리즘 배차와 평점이 실제 지휘·감독처럼 작동할 수 있다.","pro":["원하는 시간에 일할 수 있어 진입 장벽이 낮다.","플랫폼은 새로운 서비스와 부가 일자리를 만든다.","디지털 기록을 활용하면 안전관리와 보험 설계를 개선할 수 있다."],"con":["수입 변동과 사고 위험을 개인이 부담하기 쉽다.","알고리즘 배차·평점 기준이 불투명하면 노동자가 통제받는다.","노동자성이 부정되면 산재·사회보험 사각지대가 커진다."],"questions":["플랫폼 노동자는 자영업자인가, 노동자인가?","알고리즘 배차 기준을 공개해야 하는 이유는 무엇인가?","유연성과 보호를 함께 보장하는 제도를 제안하라."],"answer":"플랫폼 노동은 자유롭게 일할 수 있다는 장점이 있지만, 실제로는 앱의 배차, 평점, 수수료가 노동 조건을 결정합니다. 그래서 단순 자영업으로만 보면 산재와 사회보험 사각지대가 커집니다. 저는 모든 플랫폼 노동자를 같은 방식으로 정규직화하기보다, 알고리즘 기준 공개, 최소 보수 기준, 산재보험 적용, 계약 해지 이의제기 절차를 보장해야 한다고 봅니다. 플랫폼의 혁신은 필요하지만 위험을 노동자에게만 떠넘겨서는 안 됩니다. 성공은 주문 처리량이 아니라 사고율 감소와 안정적 소득 보장으로 평가해야 합니다.","check":"플랫폼종사자 보호 입법, 산재보험 적용, 알고리즘 투명성 논의","sources":["https://www.moel.go.kr"],"pdf":[{"part":3,"number":15,"title":"플랫폼·특수고용 노동자 보호","tag":"노동·사회","page":13,"text":"배달·대리 등 플랫폼 노동자는 산재·고용보험 사각지대에 놓여 있어, 근로자성 이분법을 보완하는 중간적 보호 방안이 논의된다.","target":"플랫폼 노동과 알고리즘 관리"}],"origin":"기존 자료","id":"issue-036","order":35,"originalTitle":"플랫폼 노동과 알고리즘 관리","summary":"배달·대리·프리랜서 플랫폼 노동은 자유로운 일처럼 보이지만, 알고리즘 배차와 평점이 실제 지휘·감독처럼 작동할 수 있다.","prep":{"point":"플랫폼 노동은 자유롭게 일할 수 있다는 장점이 있지만, 실제로는 앱의 배차, 평점, 수수료가 노동 조건을 결정합니다.","reason":"그래서 단순 자영업으로만 보면 산재와 사회보험 사각지대가 커집니다. 저는 모든 플랫폼 노동자를 같은 방식으로 정규직화하기보다, 알고리즘 기준 공개, 최소 보수 기준, 산재보험 적용, 계약 해지 이의제기 절차를 보장해야 한다고 봅니다.","example":"적용 예시(제안): 배달 플랫폼이 배차·평가 기준을 설명하고 이의제기·산재 보호를 연결하는 방안을 제안할 수 있습니다.","pointAgain":"성공은 주문 처리량이 아니라 사고율 감소와 안정적 소득 보장으로 평가해야 합니다."},"originalNotes":"배달·대리 등 플랫폼 노동자는 산재·고용보험 사각지대에 놓여 있어, 근로자성 이분법을 보완하는 중간적 보호 방안이 논의된다.","evidenceCheck":"플랫폼종사자 보호 입법, 산재보험 적용, 알고리즘 투명성 논의","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"수입 변동과 사고 위험을 개인이 부담하기 쉽다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"AI·디지털","title":"랜섬웨어·사이버보안과 국가 기반시설","keywords":"랜섬웨어 사이버보안 개인정보 유출 국가기반시설 병원 학교 해킹","conflict":"디지털 편의 ↔ 보안 투자·개인정보 보호","background":"병원, 학교, 금융, 공공기관이 디지털화될수록 해킹과 랜섬웨어는 개인 피해를 넘어 사회 기반시설의 안전 문제가 된다.","pro":["사이버보안 투자는 개인정보와 공공서비스를 보호하는 필수 비용이다.","보안 훈련과 백업 체계는 피해 복구 시간을 줄인다.","국가 차원의 대응은 중소기관의 취약성을 보완한다."],"con":["보안 규제가 과도하면 서비스 편의와 혁신 속도가 낮아질 수 있다.","보안 전문인력과 예산이 부족한 기관은 부담이 크다.","사고 공개 의무가 평판 피해를 우려해 회피될 수 있다."],"questions":["랜섬웨어가 개인 문제가 아니라 사회 문제가 되는 이유는 무엇인가?","사이버보안 사고를 공개하도록 하는 것이 필요한가?","학교와 병원은 어떤 보안 원칙을 우선해야 하는가?"],"answer":"랜섬웨어는 단순히 컴퓨터 파일을 잠그는 범죄가 아니라 병원 진료, 학교 행정, 금융 서비스 같은 일상을 멈출 수 있는 사회 안전 문제입니다. 디지털 서비스가 편리해질수록 보안은 선택이 아니라 기본 인프라가 됩니다. 저는 공공기관과 병원, 학교에 정기 백업, 접근권한 관리, 모의훈련, 사고 신고 의무를 강화해야 한다고 봅니다. 다만 작은 기관은 전문인력과 예산이 부족하므로 정부의 공동 보안지원이 필요합니다. 성공은 사고가 전혀 없다는 선언이 아니라 탐지 시간, 복구 시간, 피해자 통지의 투명성으로 평가해야 합니다.","check":"주요 침해사고 통계, 개인정보 유출 신고 기준, 국가 기반시설 보안 대책","sources":["https://www.kisa.or.kr"],"pdf":[{"part":3,"number":9,"title":"사이버공격과 국가 기반시설 보안","tag":"안보·과학","page":12,"text":"랜섬웨어와 AI 이용 피싱 등이 정교해지면서 전력·통신·금융망에 대한 공격 위험이 커져, 제로트러스트와 정보공유 체계 강화가 요\n구된다.","target":"랜섬웨어·사이버보안과 국가 기반시설"}],"origin":"기존 자료","id":"issue-037","order":36,"originalTitle":"랜섬웨어·사이버보안과 국가 기반시설","summary":"병원, 학교, 금융, 공공기관이 디지털화될수록 해킹과 랜섬웨어는 개인 피해를 넘어 사회 기반시설의 안전 문제가 된다.","prep":{"point":"랜섬웨어는 단순히 컴퓨터 파일을 잠그는 범죄가 아니라 병원 진료, 학교 행정, 금융 서비스 같은 일상을 멈출 수 있는 사회 안전 문제입니다.","reason":"디지털 서비스가 편리해질수록 보안은 선택이 아니라 기본 인프라가 됩니다. 저는 공공기관과 병원, 학교에 정기 백업, 접근권한 관리, 모의훈련, 사고 신고 의무를 강화해야 한다고 봅니다.","example":"적용 예시(제안): 학교나 공공기관의 랜섬웨어 대응을 가정해 백업 복구 훈련·접근권한 관리·신고 절차를 설계할 수 있습니다.","pointAgain":"성공은 사고가 전혀 없다는 선언이 아니라 탐지 시간, 복구 시간, 피해자 통지의 투명성으로 평가해야 합니다."},"originalNotes":"랜섬웨어와 AI 이용 피싱 등이 정교해지면서 전력·통신·금융망에 대한 공격 위험이 커져, 제로트러스트와 정보공유 체계 강화가 요\n구된다.","evidenceCheck":"주요 침해사고 통계, 개인정보 유출 신고 기준, 국가 기반시설 보안 대책","lens":["컴퓨터공학","정보보호","미디어","법학"],"lensQuestion":"기술의 성능과 함께 데이터·책임·이용자의 권리를 연결해 설명해 보세요.","followup":"보안 규제가 과도하면 서비스 편의와 혁신 속도가 낮아질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"식량안보와 기후위기 시대의 농업","keywords":"식량안보 기후위기 농업 쌀 수급 스마트팜 농촌 고령화 곡물가격","conflict":"시장 효율 ↔ 식량주권·농촌 지속가능성","background":"기후재난과 국제분쟁은 곡물 가격과 수입 안정성을 흔들 수 있다. 농업은 경제성만이 아니라 식량안보와 지역 유지의 관점에서 볼 필요가 있다.","pro":["국내 농업 기반은 위기 때 국민의 기본 생존권을 지킨다.","스마트팜과 품종 개발은 기후변화 적응력을 높일 수 있다.","농촌 유지는 지역 균형과 환경 관리에도 필요하다."],"con":["무조건적인 보호는 소비자 가격과 재정 부담을 키울 수 있다.","쌀 중심 지원은 작물 다양화와 청년농 진입을 막을 수 있다.","스마트팜도 에너지 비용과 대기업 집중 문제가 있다."],"questions":["식량안보를 위해 국내 농업을 어느 정도 보호해야 하는가?","기후위기가 농업과 식탁에 미치는 영향을 설명해 보라.","스마트팜은 농촌 문제의 해법이 될 수 있을까?"],"answer":"식량안보는 평소에는 잘 보이지 않지만 전쟁, 기후재난, 물류 위기가 생기면 바로 중요해집니다. 모든 식량을 수입에 의존하면 가격과 공급이 흔들릴 때 국민 생활이 불안정해집니다. 그렇다고 농업을 무조건 보호하기만 하면 소비자 부담과 재정 낭비가 생길 수 있습니다. 저는 기본 식량 생산 기반은 유지하되, 기후적응 품종, 스마트팜, 청년농 지원, 작물 다양화를 함께 추진해야 한다고 봅니다. 성공은 자급률 숫자 하나가 아니라 가격 안정, 농가 소득, 기후재난 피해 감소, 청년 유입으로 평가해야 합니다.","check":"곡물자급률, 쌀 수급 정책, 기후재난 농업 피해, 스마트농업 지원","sources":["https://www.mafra.go.kr"],"pdf":[{"part":3,"number":35,"title":"농식품 물가와 식량안보","tag":"경제·환경","page":14,"text":"기후재난·전쟁·환율이 농산물 가격을 동시에 자극하는 가운데, 국내 생산기반 유지와 비축·유통 개선의 균형이 필요하다.","target":"식량안보와 기후위기 시대의 농업"}],"origin":"기존 자료","id":"issue-038","order":37,"originalTitle":"식량안보와 기후위기 시대의 농업","summary":"기후재난과 국제분쟁은 곡물 가격과 수입 안정성을 흔들 수 있다.","prep":{"point":"식량안보는 평소에는 잘 보이지 않지만 전쟁, 기후재난, 물류 위기가 생기면 바로 중요해집니다.","reason":"모든 식량을 수입에 의존하면 가격과 공급이 흔들릴 때 국민 생활이 불안정해집니다. 그렇다고 농업을 무조건 보호하기만 하면 소비자 부담과 재정 낭비가 생길 수 있습니다.","example":"적용 예시(제안): 국내 생산·수입선·저장·가격 지원을 함께 점검하고 기후 위험에 대응하는 작물 전환을 검토할 수 있습니다.","pointAgain":"성공은 자급률 숫자 하나가 아니라 가격 안정, 농가 소득, 기후재난 피해 감소, 청년 유입으로 평가해야 합니다."},"originalNotes":"기후재난·전쟁·환율이 농산물 가격을 동시에 자극하는 가운데, 국내 생산기반 유지와 비축·유통 개선의 균형이 필요하다.","evidenceCheck":"곡물자급률, 쌀 수급 정책, 기후재난 농업 피해, 스마트농업 지원","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"무조건적인 보호는 소비자 가격과 재정 부담을 키울 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"거대 플랫폼 독과점과 온라인 플랫폼 공정화","keywords":"플랫폼 독과점 온플법 배달앱 수수료 자사우대 소비자 후생 소상공인","conflict":"공정경쟁·소상공인 보호 ↔ 혁신·소비자 편익","background":"배달앱, 이커머스, 앱마켓 등 거대 플랫폼의 수수료, 자사우대, 입점업체 종속 문제가 커지며 플랫폼 규제와 혁신의 균형이 면접 쟁점이 되었다.","pro":["독점적 지위 남용은 소상공인 비용과 소비자 가격 상승으로 이어질 수 있다.","자사우대와 불투명한 노출 기준은 공정 경쟁을 해친다.","플랫폼 간 이동성과 자료 접근권을 보장하면 시장 경쟁이 살아난다."],"con":["과도한 사전 규제는 국내 플랫폼의 혁신과 글로벌 경쟁력을 약화시킬 수 있다.","무료배송·빠른배송 등 소비자 혜택이 줄어들 수 있다.","시장 변화가 빠르기 때문에 획일적 법률은 부작용을 낳을 수 있다."],"questions":["배달앱 수수료 인상을 법으로 규제해야 하는가?","플랫폼 독과점은 소비자에게 어떤 방식으로 피해를 줄 수 있는가?","사전 규제와 사후 제재 중 어느 방식이 더 적절한가?"],"answer":"저는 플랫폼의 성장 자체를 막기보다 독점적 지위 남용에 대한 사후 제재와 투명성 의무를 강화해야 한다고 봅니다. 플랫폼은 소비자 편의와 새로운 시장을 만들었지만, 입점업체가 특정 플랫폼에 의존하면 수수료 인상과 노출 기준 변경을 거부하기 어렵습니다. 따라서 수수료 담합, 자사우대, 불공정 계약은 강하게 제재하되, 모든 플랫폼을 같은 방식으로 사전 규제하는 것은 신중해야 합니다. 성공 기준은 규제 강도가 아니라 소상공인 선택권, 소비자 가격, 신규 플랫폼 진입 가능성이 함께 개선되는지입니다.","check":"온라인 플랫폼 공정화 입법, 공정위 플랫폼 사건, 배달앱 수수료 정책","sources":["https://www.ftc.go.kr"],"pdf":[{"part":3,"number":42,"title":"배달앱 수수료·온라인 플랫폼 공정성","tag":"경제·소비자","page":15,"text":"플랫폼의 중개·광고·결제 수수료와 우월적 지위가 논란이 되며, 수수료 구조의 투명성 확보가 우선 과제로 꼽힌다.","target":"거대 플랫폼 독과점과 온라인 플랫폼 공정화"}],"origin":"기존 자료","id":"issue-039","order":38,"originalTitle":"거대 플랫폼 독과점과 온라인 플랫폼 공정화","summary":"배달앱, 이커머스, 앱마켓 등 거대 플랫폼의 수수료, 자사우대, 입점업체 종속 문제가 커지며 플랫폼 규제와 혁신의 균형이 면접 쟁점이 되었다.","prep":{"point":"저는 플랫폼의 성장 자체를 막기보다 독점적 지위 남용에 대한 사후 제재와 투명성 의무를 강화해야 한다고 봅니다.","reason":"플랫폼은 소비자 편의와 새로운 시장을 만들었지만, 입점업체가 특정 플랫폼에 의존하면 수수료 인상과 노출 기준 변경을 거부하기 어렵습니다. 따라서 수수료 담합, 자사우대, 불공정 계약은 강하게 제재하되, 모든 플랫폼을 같은 방식으로 사전 규제하는 것은 신중해야 합니다.","example":"적용 예시(제안): 플랫폼의 자사 우대 논란을 다룰 때 입점업체 데이터 접근과 소비자의 전환 비용을 함께 비교할 수 있습니다.","pointAgain":"성공 기준은 규제 강도가 아니라 소상공인 선택권, 소비자 가격, 신규 플랫폼 진입 가능성이 함께 개선되는지입니다."},"originalNotes":"플랫폼의 중개·광고·결제 수수료와 우월적 지위가 논란이 되며, 수수료 구조의 투명성 확보가 우선 과제로 꼽힌다.","evidenceCheck":"온라인 플랫폼 공정화 입법, 공정위 플랫폼 사건, 배달앱 수수료 정책","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"과도한 사전 규제는 국내 플랫폼의 혁신과 글로벌 경쟁력을 약화시킬 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"주 4일제와 근로 형태 다변화","keywords":"주4일제 노동시간 유연근무 생산성 삶의질 중소기업 임금","conflict":"삶의 질·생산성 ↔ 임금 감소·기업 부담","background":"노동시간 단축과 유연근무 확대는 청년 세대가 체감하기 쉬운 의제이며, 생산성·임금·중소기업 부담을 함께 묻는 주제다.","pro":["충분한 휴식은 번아웃을 줄이고 창의성과 생산성을 높일 수 있다.","돌봄·학습·지역활동 시간이 늘어나 삶의 질이 개선된다.","기업은 인재 유치와 조직문화 개선 효과를 얻을 수 있다."],"con":["임금 삭감 없는 주 4일제는 중소기업 비용 부담이 크다.","업종별 특성이 달라 일괄 법제화는 현장 혼란을 만들 수 있다.","업무 강도가 오히려 높아질 위험이 있다."],"questions":["주 4일제를 법제화하는 것에 찬성하는가?","노동시간 단축이 생산성을 높인다는 주장에 대해 어떻게 생각하는가?","업종별 격차를 줄이는 시행 방안을 제안하라."],"answer":"주 4일제는 단순히 하루를 더 쉬자는 요구가 아니라 일의 방식과 생산성을 다시 설계하는 문제입니다. 저는 전면 법제화보다 공공부문과 희망 기업의 시범사업, 업종별 단계 도입이 적절하다고 봅니다. 임금 삭감 없는 주 4일제는 노동자 삶의 질을 높일 수 있지만 중소기업에는 비용 부담이 될 수 있습니다. 따라서 업무 자동화, 회의 축소, 성과 중심 관리, 중소기업 지원이 함께 필요합니다. 성과는 근무일 수가 아니라 생산성, 임금 유지, 고용 안정, 노동자 건강 개선으로 평가해야 합니다.","check":"국내 시범사업 결과, 업종별 노동시간 통계, 임금 보전 방식","sources":["https://www.moel.go.kr"],"pdf":[{"part":3,"number":5,"title":"주 4.5일제·실노동시간 단축","tag":"노동","page":12,"text":"정부 국정과제로 시범사업이 추진 중이며, 삶의 질 향상 기대와 중소기업의 인력·비용 부담 우려가 공존한다.","target":"주 4일제와 근로 형태 다변화"}],"origin":"기존 자료","id":"issue-040","order":39,"originalTitle":"주 4일제와 근로 형태 다변화","summary":"노동시간 단축과 유연근무 확대는 청년 세대가 체감하기 쉬운 의제이며, 생산성·임금·중소기업 부담을 함께 묻는 주제다.","prep":{"point":"주 4일제는 단순히 하루를 더 쉬자는 요구가 아니라 일의 방식과 생산성을 다시 설계하는 문제입니다.","reason":"저는 전면 법제화보다 공공부문과 희망 기업의 시범사업, 업종별 단계 도입이 적절하다고 봅니다. 임금 삭감 없는 주 4일제는 노동자 삶의 질을 높일 수 있지만 중소기업에는 비용 부담이 될 수 있습니다.","example":"적용 예시(제안): 근무시간 단축을 시범 도입한다면 임금·서비스 공백·업무 강도·생산성을 같이 측정하는 방안을 제안할 수 있습니다.","pointAgain":"성과는 근무일 수가 아니라 생산성, 임금 유지, 고용 안정, 노동자 건강 개선으로 평가해야 합니다."},"originalNotes":"정부 국정과제로 시범사업이 추진 중이며, 삶의 질 향상 기대와 중소기업의 인력·비용 부담 우려가 공존한다.","evidenceCheck":"국내 시범사업 결과, 업종별 노동시간 통계, 임금 보전 방식","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"임금 삭감 없는 주 4일제는 중소기업 비용 부담이 크다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"과학·산업·기술","title":"유전자 가위 기술과 생명윤리","keywords":"유전자 가위 CRISPR 배아 편집 난치병 치료 생명윤리 디자이너 베이비","conflict":"난치병 치료 가능성 ↔ 인간 존엄·불평등","background":"CRISPR 같은 유전자 편집 기술은 난치병 치료 가능성을 열지만, 배아 편집과 우생학, 경제적 불평등 논란을 함께 낳는다.","pro":["난치성 유전질환 치료와 예방 가능성을 높인다.","정밀의학과 바이오산업 발전에 기여할 수 있다.","고통을 줄이는 의료기술로서 공익성이 있다."],"con":["배아 편집은 미래 세대의 동의 없는 개입이 될 수 있다.","능력·외모 개선으로 확장되면 인간 존엄과 평등이 훼손된다.","고가 치료가 부유층에게만 제공되면 건강 불평등이 커진다."],"questions":["치료 목적의 배아 유전자 편집은 허용되어야 하는가?","질병 치료와 능력 강화의 경계는 어디인가?","생명과학 연구에서 윤리 심사가 필요한 이유는 무엇인가?"],"answer":"유전자 가위 기술은 난치병 환자에게 희망을 줄 수 있지만, 배아 편집처럼 되돌리기 어려운 개입은 매우 신중해야 합니다. 저는 체세포 치료처럼 개인의 질병 치료에 한정된 연구는 엄격한 심사를 거쳐 허용할 수 있다고 봅니다. 그러나 배아 단계에서 외모나 지능 같은 능력 강화를 시도하는 것은 인간을 설계 대상으로 만들 위험이 있습니다. 또한 치료가 고가로 제공되면 생명과학 기술이 불평등을 키울 수 있습니다. 따라서 안전성, 치료 목적, 공정한 접근성, 미래 세대 권리를 기준으로 규제해야 합니다.","check":"생명윤리법, 배아 연구 허용 범위, 유전자치료 임상 승인 동향","sources":["https://www.bioethics.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-041","order":40,"originalTitle":"유전자 가위 기술과 생명윤리","summary":"CRISPR 같은 유전자 편집 기술은 난치병 치료 가능성을 열지만, 배아 편집과 우생학, 경제적 불평등 논란을 함께 낳는다.","prep":{"point":"유전자 가위 기술은 난치병 환자에게 희망을 줄 수 있지만, 배아 편집처럼 되돌리기 어려운 개입은 매우 신중해야 합니다.","reason":"저는 체세포 치료처럼 개인의 질병 치료에 한정된 연구는 엄격한 심사를 거쳐 허용할 수 있다고 봅니다. 그러나 배아 단계에서 외모나 지능 같은 능력 강화를 시도하는 것은 인간을 설계 대상으로 만들 위험이 있습니다.","example":"적용 예시(제안): 체세포 치료와 다음 세대로 영향이 이어질 수 있는 편집을 나누고 동의·장기 관찰·접근성을 검토할 수 있습니다.","pointAgain":"따라서 안전성, 치료 목적, 공정한 접근성, 미래 세대 권리를 기준으로 규제해야 합니다."},"originalNotes":"","evidenceCheck":"생명윤리법, 배아 연구 허용 범위, 유전자치료 임상 승인 동향","lens":["공학","자연과학","산업공학","과학기술정책"],"lensQuestion":"기술 원리와 성능뿐 아니라 안전·자원·검증 방법을 함께 설명해 보세요.","followup":"배아 편집은 미래 세대의 동의 없는 개입이 될 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"촉법소년 연령 하향과 소년법 개정","keywords":"촉법소년 소년법 형사미성년자 교화 처벌 청소년 범죄","conflict":"엄정 책임 ↔ 교화·발달 특성 보호","background":"강력한 청소년 범죄 보도가 늘 때마다 촉법소년 연령 하향 논의가 반복된다. 처벌 강화와 교화 가능성의 균형이 핵심이다.","pro":["중대한 범죄에는 나이에 맞는 책임을 물어 피해자를 보호해야 한다.","제도를 악용한다는 사회적 불신을 줄일 수 있다.","반복 범죄에 대한 실효성 있는 대응이 필요하다."],"con":["청소년은 충동 조절과 판단 능력이 발달 중이므로 교화 가능성이 크다.","처벌 강화만으로 재범을 줄인다는 근거는 제한적이다.","가정·학교·지역사회 보호망 실패를 개인 처벌로만 돌릴 수 없다."],"questions":["촉법소년 연령 하향에 찬성하는가?","소년범 처벌과 교화 중 무엇을 우선해야 하는가?","피해자 보호와 가해 청소년 회복을 함께 고려하는 방안은 무엇인가?"],"answer":"촉법소년 문제는 피해자의 고통을 가볍게 보지 않으면서도 청소년의 발달 특성을 함께 고려해야 합니다. 중대한 범죄와 반복 범죄에는 실질적 책임이 필요하지만, 연령을 낮추는 것만으로 범죄 원인이 사라지지는 않습니다. 저는 중대 사안에 대한 보호처분 실효성을 높이고, 피해자 회복 지원, 가족 개입, 학교 상담, 지역사회 관리 체계를 강화해야 한다고 봅니다. 처벌은 필요할 수 있지만 최종 목표는 재범 방지와 사회 복귀여야 합니다. 성과는 처벌 건수가 아니라 재범률과 피해 회복 수준으로 판단해야 합니다.","check":"소년법 개정안, 청소년 범죄 통계, 보호처분·소년원 교육 성과","sources":["https://www.moj.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-042","order":41,"originalTitle":"촉법소년 연령 하향과 소년법 개정","summary":"강력한 청소년 범죄 보도가 늘 때마다 촉법소년 연령 하향 논의가 반복된다.","prep":{"point":"촉법소년 문제는 피해자의 고통을 가볍게 보지 않으면서도 청소년의 발달 특성을 함께 고려해야 합니다.","reason":"중대한 범죄와 반복 범죄에는 실질적 책임이 필요하지만, 연령을 낮추는 것만으로 범죄 원인이 사라지지는 않습니다. 저는 중대 사안에 대한 보호처분 실효성을 높이고, 피해자 회복 지원, 가족 개입, 학교 상담, 지역사회 관리 체계를 강화해야 한다고 봅니다.","example":"적용 예시(제안): 재범 예방 프로그램을 설계한다면 보호관찰·가정 지원·피해 회복을 연령 변경과 함께 비교할 수 있습니다.","pointAgain":"성과는 처벌 건수가 아니라 재범률과 피해 회복 수준으로 판단해야 합니다."},"originalNotes":"","evidenceCheck":"소년법 개정안, 청소년 범죄 통계, 보호처분·소년원 교육 성과","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"청소년은 충동 조절과 판단 능력이 발달 중이므로 교화 가능성이 크다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"조력존엄사와 자기결정권","keywords":"조력존엄사 안락사 연명의료 자기결정권 생명권 호스피스","conflict":"자기결정권 ↔ 생명 보호·취약자 압박","background":"말기 환자의 고통과 자기결정권을 존중해야 한다는 주장과 생명 경시, 가족·경제적 압박 우려가 충돌한다.","pro":["회복 가능성이 없는 환자의 극심한 고통을 줄일 수 있다.","환자 본인의 존엄과 자기결정권을 존중한다.","무의미한 연명의료와 존엄한 죽음에 대한 사회적 논의를 촉진한다."],"con":["경제적·가족적 부담 때문에 죽음을 선택하도록 압박받을 수 있다.","생명 보호 원칙이 약화될 위험이 있다.","충분한 호스피스·완화의료가 먼저 마련되어야 한다."],"questions":["조력존엄사 합법화에 찬성하는가?","환자의 자기결정권과 생명 보호 원칙이 충돌할 때 기준은 무엇인가?","호스피스 제도와 조력존엄사는 어떤 관계인가?"],"answer":"조력존엄사는 환자의 고통과 자기결정권을 진지하게 다루는 문제입니다. 저는 원칙적으로 환자의 의사를 존중해야 하지만, 합법화에는 매우 엄격한 조건이 필요하다고 봅니다. 회복 불가능한 말기 상태, 반복 확인된 자발적 의사, 독립된 의사의 판단, 가족·경제적 압박 배제, 충분한 완화의료 제공이 전제되어야 합니다. 특히 돌봄 부담 때문에 죽음을 선택하게 되는 사회라면 그것은 존엄이 아니라 압박일 수 있습니다. 따라서 호스피스와 통증 완화 체계를 먼저 강화하고, 사회적 합의를 바탕으로 제한적으로 논의해야 합니다.","check":"연명의료결정제도, 조력존엄사 법안, 호스피스 이용률","sources":["https://www.mohw.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-043","order":42,"originalTitle":"조력존엄사와 자기결정권","summary":"말기 환자의 고통과 자기결정권을 존중해야 한다는 주장과 생명 경시, 가족·경제적 압박 우려가 충돌한다.","prep":{"point":"조력존엄사는 환자의 고통과 자기결정권을 진지하게 다루는 문제입니다.","reason":"저는 원칙적으로 환자의 의사를 존중해야 하지만, 합법화에는 매우 엄격한 조건이 필요하다고 봅니다. 회복 불가능한 말기 상태, 반복 확인된 자발적 의사, 독립된 의사의 판단, 가족·경제적 압박 배제, 충분한 완화의료 제공이 전제되어야 합니다.","example":"적용 예시(제안): 자기결정권을 논의할 때 통증 관리와 돌봄 지원이 충분한지, 경제적 압박이 선택을 왜곡하지 않는지 검토할 수 있습니다.","pointAgain":"따라서 호스피스와 통증 완화 체계를 먼저 강화하고, 사회적 합의를 바탕으로 제한적으로 논의해야 합니다."},"originalNotes":"","evidenceCheck":"연명의료결정제도, 조력존엄사 법안, 호스피스 이용률","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"경제적·가족적 부담 때문에 죽음을 선택하도록 압박받을 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"기본소득 도입과 복지국가 재설계","keywords":"기본소득 보편복지 선별복지 자동화 재원 노동의욕 복지국가","conflict":"보편적 안전망 ↔ 재원 부담·정책 효율","background":"AI와 자동화로 일자리 불안이 커지면서 기본소득은 미래 복지 대안으로 논의되지만, 막대한 재원과 기존 복지 축소 문제가 쟁점이다.","pro":["일자리 변화 속에서 최소한의 생활 안정망을 제공한다.","선별 과정의 낙인과 행정비용을 줄일 수 있다.","개인의 교육·창업·돌봄 선택을 넓힐 수 있다."],"con":["전 국민 지급에는 막대한 재원이 필요하다.","취약계층에게 더 필요한 서비스를 줄일 위험이 있다.","노동 의욕 저하와 물가 상승 논란이 있다."],"questions":["기본소득은 복지의 미래 대안이 될 수 있는가?","보편복지와 선별복지 중 어느 방식이 더 공정한가?","기본소득 재원은 어떻게 마련할 수 있을까?"],"answer":"기본소득은 자동화와 불안정 노동 시대에 최소한의 안전망을 제공한다는 점에서 의미가 있습니다. 그러나 충분한 금액을 전 국민에게 지급하려면 막대한 재원이 필요하고, 그 과정에서 장애인·노인·아동 돌봄 같은 맞춤형 복지가 약화될 수 있습니다. 저는 전면 기본소득보다 청년, 농어촌, 전환기 노동자처럼 위험이 큰 집단을 대상으로 한 부분 기본소득이나 음의 소득세 방식부터 검토하는 것이 현실적이라고 봅니다. 성과는 지급 여부가 아니라 빈곤 감소, 노동시장 참여, 기존 복지와의 보완성으로 평가해야 합니다.","check":"국내외 시범사업, 재원 추계, 기존 복지와의 중복·대체 논의","sources":["https://www.kihasa.re.kr"],"pdf":[{"part":3,"number":48,"title":"기본소득과 재정 지속가능성","tag":"경제·복지","page":15,"text":"자동화·불안정 노동에 대응하는 소득안전망으로 논의되지만, 막대한 재원과 기존 복지 축소 우려로 제한적 실험을 통한 검증이 필\n요하다.","target":"기본소득 도입과 복지국가 재설계"}],"origin":"기존 자료","id":"issue-044","order":43,"originalTitle":"기본소득 도입과 복지국가 재설계","summary":"AI와 자동화로 일자리 불안이 커지면서 기본소득은 미래 복지 대안으로 논의되지만, 막대한 재원과 기존 복지 축소 문제가 쟁점이다.","prep":{"point":"기본소득은 자동화와 불안정 노동 시대에 최소한의 안전망을 제공한다는 점에서 의미가 있습니다.","reason":"그러나 충분한 금액을 전 국민에게 지급하려면 막대한 재원이 필요하고, 그 과정에서 장애인·노인·아동 돌봄 같은 맞춤형 복지가 약화될 수 있습니다. 저는 전면 기본소득보다 청년, 농어촌, 전환기 노동자처럼 위험이 큰 집단을 대상으로 한 부분 기본소득이나 음의 소득세 방식부터 검토하는 것이 현실적이라고 봅니다.","example":"적용 예시(제안): 현금 지급안을 비교할 때 재원·기존 서비스의 변화·사각지대·소득별 실질 효과를 함께 계산할 수 있습니다.","pointAgain":"성과는 지급 여부가 아니라 빈곤 감소, 노동시장 참여, 기존 복지와의 보완성으로 평가해야 합니다."},"originalNotes":"자동화·불안정 노동에 대응하는 소득안전망으로 논의되지만, 막대한 재원과 기존 복지 축소 우려로 제한적 실험을 통한 검증이 필\n요하다.","evidenceCheck":"국내외 시범사업, 재원 추계, 기존 복지와의 중복·대체 논의","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"전 국민 지급에는 막대한 재원이 필요하다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"비대면 진료 제도화와 의료 접근성","keywords":"비대면 진료 원격의료 의료접근성 플랫폼 약 배송 의료격차","conflict":"접근성·편의 ↔ 오진 위험·의료 영리화","background":"비대면진료 제도화 내용을 담은 개정 의료법은 2025년 12월 23일 신설된 관련 조항의 시행일을 2026년 12월 24일로 정하고 있다. 보건복지부는 2026년 10월 19일부터 11월 9일까지 대상환자·처방·중개매체 기준을 담은 시행규칙 개정안을 입법예고한다. 이 안에는 동일 증상으로 6개월 이내 대면진료를 받은 환자의 일반 비대면진료, 일정 조건의 초진, 초진 처방일수 제한 등이 포함된다. 이는 아직 확정 시행 기준이 아니므로 기존 시범사업 운영과 향후 법 시행을 나눠 설명해야 한다.","pro":["의료 취약지역과 거동이 어려운 환자의 접근성을 높인다.","만성질환 관리와 경증 상담의 효율성을 높일 수 있다.","감염병 상황에서 대면 접촉을 줄인다."],"con":["진찰 정보가 제한되어 오진 위험이 커질 수 있다.","플랫폼 중심 의료가 과잉 진료와 광고 경쟁을 부를 수 있다.","고령층·디지털 취약계층은 이용에서 배제될 수 있다."],"questions":["비대면 진료를 전면 허용해야 하는가?","초진과 재진의 허용 범위를 어떻게 나누어야 할까?","의료 플랫폼의 영리화를 막기 위한 장치는 무엇인가?"],"answer":"비대면 진료는 의료 접근성을 높일 수 있지만 대면 진료를 완전히 대체할 수는 없습니다. 저는 도서산간, 장애인, 만성질환 재진처럼 필요성이 큰 경우부터 제도화하는 것이 적절하다고 봅니다. 초진을 넓게 허용하면 오진과 약물 오남용 위험이 커질 수 있으므로 질환과 상황별 기준이 필요합니다. 또한 플랫폼이 환자 정보를 상업적으로 이용하거나 광고 중심으로 병원을 연결하지 못하도록 규제해야 합니다. 성과는 이용 건수보다 의료취약지역 접근성, 오진·부작용, 환자 만족도, 대면 연계율로 평가해야 합니다.","check":"2026-10-19 대표 사실 확인: 법률 개정과 2026-12-24 시행예정 상태, 10월 19일 시작된 하위규정 입법예고를 확인했다. 초진 범위·7일 처방 원칙 등은 입법예고안 내용이며 확정된 현행 규칙으로 쓰지 않는다. 현재 적용되는 시범사업 대상·약 배송·행정지침의 세부 범위와 최종 공포 내용은 추가 확인이 필요하다.","sources":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=290667","https://m.korea.kr/briefing/pressReleaseView.do?newsId=156785554","https://www.mohw.go.kr"],"pdf":[],"origin":"기존 자료","summary":"비대면진료를 제도화한 의료법 조항은 2026년 12월 24일 시행 예정이다. 2026년 10월 19일 기준 세부 실시·처방기준은 입법예고 단계이므로 현행 시범사업과 구분해야 한다.","verifiedDate":"2026-10-19","id":"issue-045","order":44,"originalTitle":"비대면 진료 제도화와 의료 접근성","prep":{"point":"비대면 진료는 의료 접근성을 높일 수 있지만 대면 진료를 완전히 대체할 수는 없습니다.","reason":"저는 도서산간, 장애인, 만성질환 재진처럼 필요성이 큰 경우부터 제도화하는 것이 적절하다고 봅니다. 초진을 넓게 허용하면 오진과 약물 오남용 위험이 커질 수 있으므로 질환과 상황별 기준이 필요합니다.","example":"적용 예시(제안): 만성질환 재진 상황을 가정해 대면 전환 기준·응급 대응·기록 연계·디지털 접근성을 함께 설계할 수 있습니다.","pointAgain":"성과는 이용 건수보다 의료취약지역 접근성, 오진·부작용, 환자 만족도, 대면 연계율로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"2026-10-19 대표 사실 확인: 법률 개정과 2026-12-24 시행예정 상태, 10월 19일 시작된 하위규정 입법예고를 확인했다. 초진 범위·7일 처방 원칙 등은 입법예고안 내용이며 확정된 현행 규칙으로 쓰지 않는다. 현재 적용되는 시범사업 대상·약 배송·행정지침의 세부 범위와 최종 공포 내용은 추가 확인이 필요하다.","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"진찰 정보가 제한되어 오진 위험이 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"노키즈존과 아동 차별 논쟁","keywords":"노키즈존 아동 차별 영업 자유 소비자 권리 양육 친화 사회","conflict":"영업의 자유 ↔ 아동의 차별받지 않을 권리","background":"노키즈존은 사업자의 영업 자유와 다른 손님의 평온권, 아동과 양육자의 사회 참여권이 충돌하는 생활 밀착형 면접 주제다.","pro":["사업자는 매장 특성과 고객층에 맞게 영업 방침을 정할 자유가 있다.","소음·안전사고·시설 파손을 우려하는 다른 손님의 권리도 고려해야 한다.","소규모 사업자에게 모든 돌봄 친화 설비를 요구하기 어렵다."],"con":["아동을 집단적으로 배제하는 것은 차별로 이어질 수 있다.","양육자의 사회 참여를 제한하고 돌봄 부담을 개인에게 전가한다.","개별 문제 행동을 전체 아동 배제로 해결하는 것은 과도하다."],"questions":["노키즈존은 정당한 영업 자유인가, 아동 차별인가?","사업자와 양육자, 다른 손님의 갈등을 줄일 대안은 무엇인가?","양육 친화 사회를 만들기 위해 필요한 제도는 무엇인가?"],"answer":"노키즈존은 사업자의 어려움도 이해해야 하지만, 아동을 한 집단으로 배제한다는 점에서 신중해야 합니다. 소음이나 안전사고 문제는 실제로 발생할 수 있지만, 모든 아동과 양육자를 잠재적 문제로 보는 방식은 차별로 이어질 수 있습니다. 저는 전면 금지나 전면 허용보다 위험 시설 기준, 보호자 책임 안내, 시간대별 운영, 아동 친화 공간 확대 같은 현실적 조정이 필요하다고 봅니다. 사회가 아이를 함께 키운다는 관점을 갖지 못하면 저출생 문제도 해결하기 어렵습니다. 성과는 갈등 민원 감소와 양육자 접근성 개선으로 봐야 합니다.","check":"국가인권위 결정례, 지자체 아동친화 정책, 관련 차별금지 논의","sources":["https://www.humanrights.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-046","order":45,"originalTitle":"노키즈존과 아동 차별 논쟁","summary":"노키즈존은 사업자의 영업 자유와 다른 손님의 평온권, 아동과 양육자의 사회 참여권이 충돌하는 생활 밀착형 면접 주제다.","prep":{"point":"노키즈존은 사업자의 어려움도 이해해야 하지만, 아동을 한 집단으로 배제한다는 점에서 신중해야 합니다.","reason":"소음이나 안전사고 문제는 실제로 발생할 수 있지만, 모든 아동과 양육자를 잠재적 문제로 보는 방식은 차별로 이어질 수 있습니다. 저는 전면 금지나 전면 허용보다 위험 시설 기준, 보호자 책임 안내, 시간대별 운영, 아동 친화 공간 확대 같은 현실적 조정이 필요하다고 봅니다.","example":"적용 예시(제안): 모든 아동의 출입을 막는 방법 대신 위험 구역 안내와 보호자 협력, 공간 조정 방안을 비교할 수 있습니다.","pointAgain":"성과는 갈등 민원 감소와 양육자 접근성 개선으로 봐야 합니다."},"originalNotes":"","evidenceCheck":"국가인권위 결정례, 지자체 아동친화 정책, 관련 차별금지 논의","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"아동을 집단적으로 배제하는 것은 차별로 이어질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"노인 무임승차 연령 상향과 교통복지","keywords":"노인 무임승차 지하철 적자 교통복지 고령화 이동권 세대갈등","conflict":"노인 이동권 ↔ 재정 부담·세대 형평","background":"고령화로 도시철도 무임승차 비용이 커지며, 연령 상향·소득별 지원·정부 보전 등 대안이 논의된다.","pro":["무임승차는 노인의 이동권과 사회 참여를 보장한다.","외출 증가는 건강과 지역경제에 긍정적 효과를 줄 수 있다.","교통복지는 현금지원보다 체감도가 높다."],"con":["고령인구 증가로 도시철도 재정 부담이 커진다.","소득과 무관한 일괄 혜택은 세대 형평성 논란을 낳는다.","적자가 누적되면 요금 인상으로 다른 이용자가 부담할 수 있다."],"questions":["노인 무임승차 연령을 높여야 하는가?","교통복지와 재정 안정의 균형은 어떻게 잡아야 하는가?","소득별·시간대별 차등 지원은 공정한가?"],"answer":"노인 무임승차는 단순한 할인 제도가 아니라 이동권과 사회 참여를 보장하는 복지입니다. 그러나 고령화로 비용이 빠르게 늘고 있어 제도를 그대로 유지할지 논의가 필요합니다. 저는 갑작스러운 폐지보다 소득 수준, 이용 시간대, 지역 교통 여건을 고려한 단계적 조정이 바람직하다고 봅니다. 특히 중앙정부가 복지정책으로 설계했다면 지자체와 도시철도 운영기관에만 부담을 떠넘겨서는 안 됩니다. 성과는 적자 감소뿐 아니라 노인의 외출 빈도, 건강, 저소득층 이동권 보장으로 함께 평가해야 합니다.","check":"도시철도 무임수송 손실, 고령자 이동 통계, 중앙·지방 재정 분담","sources":["https://www.molit.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-047","order":46,"originalTitle":"노인 무임승차 연령 상향과 교통복지","summary":"고령화로 도시철도 무임승차 비용이 커지며, 연령 상향·소득별 지원·정부 보전 등 대안이 논의된다.","prep":{"point":"노인 무임승차는 단순한 할인 제도가 아니라 이동권과 사회 참여를 보장하는 복지입니다.","reason":"그러나 고령화로 비용이 빠르게 늘고 있어 제도를 그대로 유지할지 논의가 필요합니다. 저는 갑작스러운 폐지보다 소득 수준, 이용 시간대, 지역 교통 여건을 고려한 단계적 조정이 바람직하다고 봅니다.","example":"적용 예시(제안): 연령만 기준으로 삼는 안과 소득·이동 필요도를 함께 반영하는 안의 비용과 접근성을 비교할 수 있습니다.","pointAgain":"성과는 적자 감소뿐 아니라 노인의 외출 빈도, 건강, 저소득층 이동권 보장으로 함께 평가해야 합니다."},"originalNotes":"","evidenceCheck":"도시철도 무임수송 손실, 고령자 이동 통계, 중앙·지방 재정 분담","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"고령인구 증가로 도시철도 재정 부담이 커진다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"AI·디지털","title":"망 사용료 법제화와 인터넷 생태계","keywords":"망 사용료 CP ISP 넷플릭스 트래픽 망중립성 인터넷 생태계","conflict":"망 투자비 분담 ↔ 망중립성·콘텐츠 혁신","background":"동영상·게임·클라우드 트래픽이 늘면서 글로벌 콘텐츠 사업자에게 망 사용료를 부과해야 하는지 논쟁이 이어진다.","pro":["대형 콘텐츠 사업자가 막대한 트래픽을 유발하므로 망 투자비를 분담해야 한다.","통신망 품질 유지를 위해 안정적 재원이 필요하다.","국내 사업자와 해외 사업자의 역차별을 줄일 수 있다."],"con":["망 사용료가 콘텐츠 가격 인상과 서비스 축소로 이어질 수 있다.","망중립성 원칙이 약화되면 작은 콘텐츠 사업자가 불리해진다.","국제 인터넷 연결 구조상 비용 책임을 단순히 한쪽에 돌리기 어렵다."],"questions":["글로벌 플랫폼에 망 사용료를 부과해야 하는가?","망중립성이 왜 중요한가?","통신사와 콘텐츠 사업자, 소비자의 비용 부담을 어떻게 나누어야 할까?"],"answer":"망 사용료 논쟁은 통신사와 콘텐츠 기업의 이익 다툼처럼 보이지만, 결국 소비자와 인터넷 생태계의 문제입니다. 대형 콘텐츠 사업자가 많은 트래픽을 유발하는 것은 사실이므로 망 투자비 분담 논의는 필요합니다. 그러나 비용 부과가 과도하면 콘텐츠 가격이 오르거나 작은 사업자의 진입이 어려워질 수 있습니다. 저는 투명한 트래픽 비용 산정, 국내외 사업자 형평성, 망중립성 보호를 전제로 협상 구조를 만드는 것이 바람직하다고 봅니다. 성과는 통신망 품질, 소비자 요금, 콘텐츠 다양성을 함께 봐야 합니다.","check":"망 사용료 입법 동향, 통신사·CP 분쟁, 망중립성 가이드라인","sources":["https://www.msit.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-048","order":47,"originalTitle":"망 사용료 법제화와 인터넷 생태계","summary":"동영상·게임·클라우드 트래픽이 늘면서 글로벌 콘텐츠 사업자에게 망 사용료를 부과해야 하는지 논쟁이 이어진다.","prep":{"point":"망 사용료 논쟁은 통신사와 콘텐츠 기업의 이익 다툼처럼 보이지만, 결국 소비자와 인터넷 생태계의 문제입니다.","reason":"대형 콘텐츠 사업자가 많은 트래픽을 유발하는 것은 사실이므로 망 투자비 분담 논의는 필요합니다. 그러나 비용 부과가 과도하면 콘텐츠 가격이 오르거나 작은 사업자의 진입이 어려워질 수 있습니다.","example":"적용 예시(제안): 망 투자 비용을 나누는 방안을 설계할 때 대형 사업자와 소규모 창작자에게 미치는 영향을 구분할 수 있습니다.","pointAgain":"성과는 통신망 품질, 소비자 요금, 콘텐츠 다양성을 함께 봐야 합니다."},"originalNotes":"","evidenceCheck":"망 사용료 입법 동향, 통신사·CP 분쟁, 망중립성 가이드라인","lens":["컴퓨터공학","정보보호","미디어","법학"],"lensQuestion":"기술의 성능과 함께 데이터·책임·이용자의 권리를 연결해 설명해 보세요.","followup":"망 사용료가 콘텐츠 가격 인상과 서비스 축소로 이어질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"기여입학제와 교육 불평등","keywords":"기여입학제 대학 재정 교육 불평등 공정성 지방대 위기","conflict":"대학 재정 확충 ↔ 입시 공정성·계층 재생산","background":"대학 재정난과 지방대 위기 속에서 기여입학제가 거론되지만, 돈으로 입학 기회를 산다는 공정성 논란이 크다.","pro":["대학 재정을 확충해 장학금과 교육시설에 투자할 수 있다.","해외 대학처럼 기부 문화를 제도화할 수 있다.","재정난 대학의 생존과 교육 질 개선에 도움이 될 수 있다."],"con":["부유층에게 입학 기회를 더 주어 교육 불평등을 심화한다.","입시 공정성에 대한 국민 신뢰를 크게 훼손할 수 있다.","대학 재정 문제를 학생 선발 공정성과 맞바꾸는 방식이 될 수 있다."],"questions":["기여입학제 도입에 찬성하는가?","대학 재정난을 입시 제도로 해결하는 것이 타당한가?","공정성과 대학 자율성의 균형은 어떻게 잡아야 하는가?"],"answer":"저는 기여입학제 도입에 신중해야 한다고 봅니다. 대학 재정난은 심각하지만 입학 기회를 돈과 연결하면 교육이 계층 이동의 통로가 아니라 계층 재생산의 장치가 될 수 있습니다. 기부금이 장학금으로 쓰인다고 해도 선발 과정의 공정성에 대한 신뢰가 무너지면 대학 전체의 정당성이 흔들립니다. 대학 재정 문제는 정부 재정 지원, 지역대학 특성화, 산학협력, 투명한 기부금 제도로 해결해야 합니다. 성공은 기부금 규모가 아니라 저소득층 접근성, 교육 질, 입시 신뢰를 함께 지키는 데 있습니다.","check":"고등교육 재정지원, 대학 기부금 제도, 지방대 재정난 통계","sources":["https://www.moe.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-049","order":48,"originalTitle":"기여입학제와 교육 불평등","summary":"대학 재정난과 지방대 위기 속에서 기여입학제가 거론되지만, 돈으로 입학 기회를 산다는 공정성 논란이 크다.","prep":{"point":"저는 기여입학제 도입에 신중해야 한다고 봅니다.","reason":"대학 재정난은 심각하지만 입학 기회를 돈과 연결하면 교육이 계층 이동의 통로가 아니라 계층 재생산의 장치가 될 수 있습니다. 기부금이 장학금으로 쓰인다고 해도 선발 과정의 공정성에 대한 신뢰가 무너지면 대학 전체의 정당성이 흔들립니다.","example":"적용 예시(제안): 대학 재원 확충이 필요해도 선발의 공정성을 해치지 않는 장학 기부·공개 회계 방안을 검토할 수 있습니다.","pointAgain":"성공은 기부금 규모가 아니라 저소득층 접근성, 교육 질, 입시 신뢰를 함께 지키는 데 있습니다."},"originalNotes":"","evidenceCheck":"고등교육 재정지원, 대학 기부금 제도, 지방대 재정난 통계","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"부유층에게 입학 기회를 더 주어 교육 불평등을 심화한다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"생활동반자법과 다양한 가족 형태","keywords":"생활동반자법 비혼 동거 가족 다양성 돌봄 상속 사회보장","conflict":"가족 다양성 인정 ↔ 기존 가족제도 변화 우려","background":"1인 가구와 비혼 동거가 늘면서 혼인·혈연 중심 제도 밖의 돌봄, 주거, 의료 의사결정, 사회보장 문제를 어떻게 다룰지가 쟁점이다.","pro":["실제로 서로 돌보는 관계를 법적으로 보호할 수 있다.","1인 가구와 비혼 가구의 주거·의료·상속 불안을 줄인다.","가족의 형태가 다양해진 현실을 제도에 반영한다."],"con":["기존 혼인·가족제도의 의미가 약화될 수 있다는 우려가 있다.","상속·세금·복지 혜택의 범위를 정하기 어렵다.","제도 악용을 막을 기준이 필요하다."],"questions":["혼인이나 혈연이 아닌 관계도 가족으로 인정해야 하는가?","생활동반자법이 필요한 사회적 이유는 무엇인가?","가족 다양성과 제도 안정성을 어떻게 조화할 수 있을까?"],"answer":"가족의 핵심은 함께 살고 서로 돌보는 관계라고 볼 수 있습니다. 1인 가구와 비혼 동거가 늘어난 현실에서 병원 보호자, 주거 계약, 돌봄 책임 같은 문제가 혼인·혈연 중심 제도만으로 해결되지 않습니다. 저는 생활동반자 제도를 도입하되 등록 요건, 해소 절차, 재산·상속 범위, 복지 중복 방지 기준을 명확히 해야 한다고 봅니다. 기존 가족을 부정하기보다 제도 밖에 있는 돌봄 관계를 최소한으로 보호하는 방향이 적절합니다. 성과는 제도 이용률보다 돌봄 공백과 법적 분쟁 감소로 봐야 합니다.","check":"생활동반자 관련 법안, 1인가구 통계, 의료·주거 보호자 제도","sources":["https://www.mogef.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-050","order":49,"originalTitle":"생활동반자법과 다양한 가족 형태","summary":"1인 가구와 비혼 동거가 늘면서 혼인·혈연 중심 제도 밖의 돌봄, 주거, 의료 의사결정, 사회보장 문제를 어떻게 다룰지가 쟁점이다.","prep":{"point":"가족의 핵심은 함께 살고 서로 돌보는 관계라고 볼 수 있습니다.","reason":"1인 가구와 비혼 동거가 늘어난 현실에서 병원 보호자, 주거 계약, 돌봄 책임 같은 문제가 혼인·혈연 중심 제도만으로 해결되지 않습니다. 저는 생활동반자 제도를 도입하되 등록 요건, 해소 절차, 재산·상속 범위, 복지 중복 방지 기준을 명확히 해야 한다고 봅니다.","example":"적용 예시(제안): 돌봄·의료 의사결정·주거에서 생기는 보호 공백을 살피고 기존 가족 제도와 조정하는 방안을 검토할 수 있습니다.","pointAgain":"성과는 제도 이용률보다 돌봄 공백과 법적 분쟁 감소로 봐야 합니다."},"originalNotes":"","evidenceCheck":"생활동반자 관련 법안, 1인가구 통계, 의료·주거 보호자 제도","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"기존 혼인·가족제도의 의미가 약화될 수 있다는 우려가 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"외국인 가사돌봄 인력과 최저임금 차등 적용","keywords":"외국인 가사돌봄 최저임금 차등 적용 저출생 돌봄 노동권","conflict":"돌봄비용 완화 ↔ 노동권·차별 금지","background":"저출생 대책으로 외국인 가사돌봄 인력 도입이 논의되지만, 최저임금 차등 적용은 비용 절감과 노동권 차별 논란을 동시에 낳는다.","pro":["돌봄 비용을 낮추면 맞벌이 가정의 양육 부담이 줄 수 있다.","돌봄 인력 부족 문제를 완화할 수 있다.","여성의 경력단절 예방에 도움이 될 수 있다."],"con":["국적을 이유로 낮은 임금을 적용하면 차별과 착취가 발생할 수 있다.","돌봄노동의 가치를 낮게 평가하는 결과가 될 수 있다.","저임금 인력에 의존하면 공공돌봄 확충이 늦어질 수 있다."],"questions":["외국인 가사돌봄 인력에게 최저임금을 차등 적용해야 하는가?","저출생 대책에서 돌봄 비용과 노동권은 어떻게 균형을 잡아야 하는가?","돌봄노동의 사회적 가치를 높이는 방법은 무엇인가?"],"answer":"돌봄 비용이 높아 맞벌이 가정이 어려움을 겪는 것은 사실입니다. 그러나 외국인이라는 이유로 최저임금을 낮게 적용하면 돌봄노동을 값싼 노동으로 보는 차별이 될 수 있습니다. 저는 외국인 가사돌봄 인력을 도입하더라도 동일노동 동일임금 원칙과 안전한 체류, 노동권 보호가 필요하다고 봅니다. 비용 부담은 임금 차별이 아니라 공공 아이돌봄 확대, 소득별 돌봄 바우처, 근로시간 유연화로 줄여야 합니다. 성과는 이용 가구 수뿐 아니라 돌봄노동자 권리침해 감소와 양육 부담 완화로 평가해야 합니다.","check":"외국인 가사관리사 시범사업, 최저임금 적용 논의, 공공돌봄 예산","sources":["https://www.moel.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-051","order":50,"originalTitle":"외국인 가사돌봄 인력과 최저임금 차등 적용","summary":"저출생 대책으로 외국인 가사돌봄 인력 도입이 논의되지만, 최저임금 차등 적용은 비용 절감과 노동권 차별 논란을 동시에 낳는다.","prep":{"point":"돌봄 비용이 높아 맞벌이 가정이 어려움을 겪는 것은 사실입니다.","reason":"그러나 외국인이라는 이유로 최저임금을 낮게 적용하면 돌봄노동을 값싼 노동으로 보는 차별이 될 수 있습니다. 저는 외국인 가사돌봄 인력을 도입하더라도 동일노동 동일임금 원칙과 안전한 체류, 노동권 보호가 필요하다고 봅니다.","example":"적용 예시(제안): 돌봄 인력 지원책을 임금 차등만으로 설명하지 않고 주거·훈련·공공 지원과 서비스 품질을 함께 비교할 수 있습니다.","pointAgain":"성과는 이용 가구 수뿐 아니라 돌봄노동자 권리침해 감소와 양육 부담 완화로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"외국인 가사관리사 시범사업, 최저임금 적용 논의, 공공돌봄 예산","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"국적을 이유로 낮은 임금을 적용하면 차별과 착취가 발생할 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"동물권 강화와 민법상 물건 지위 논쟁","keywords":"동물권 민법 물건 지위 반려동물 학대 생명윤리 수의학","conflict":"생명 존중 ↔ 재산권·제도 비용","background":"반려동물이 가족처럼 인식되면서 동물을 단순한 물건으로 볼 수 있는지, 학대 처벌과 소유자의 책임을 어떻게 강화할지가 논의된다.","pro":["동물은 고통을 느끼는 생명체이므로 물건과 다르게 보호해야 한다.","학대 예방과 책임 있는 반려문화 형성에 도움이 된다.","동물 의료·보호 제도 개선의 법적 기반이 된다."],"con":["동물의 법적 지위를 바꾸면 손해배상·상속·소유권 등 법체계 조정이 필요하다.","축산·실험동물 영역까지 규제가 확대될 수 있다.","반려인의 비용 부담과 행정 부담이 커질 수 있다."],"questions":["동물을 민법상 물건에서 제외하는 것에 찬성하는가?","동물권과 인간의 재산권이 충돌할 때 기준은 무엇인가?","반려동물 보유자의 책임은 어디까지인가?"],"answer":"동물을 단순한 물건으로만 보는 관점은 현재 사회 인식과 맞지 않습니다. 동물은 고통을 느끼는 생명체이므로 학대와 방임을 더 강하게 막을 필요가 있습니다. 다만 법적 지위를 바꾸면 손해배상, 소유권, 축산과 실험동물 규제까지 영향을 주기 때문에 단계적 접근이 필요합니다. 저는 동물의 비물건성을 선언하고, 학대 처벌, 등록제, 유기 방지, 반려인의 돌봄 책임을 함께 강화해야 한다고 봅니다. 성과는 선언적 문구가 아니라 학대 감소, 유기동물 감소, 책임 있는 반려문화 확산으로 평가해야 합니다.","check":"민법 개정안, 동물보호법, 유기·학대 통계","sources":["https://www.mafra.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-052","order":51,"originalTitle":"동물권 강화와 민법상 물건 지위 논쟁","summary":"반려동물이 가족처럼 인식되면서 동물을 단순한 물건으로 볼 수 있는지, 학대 처벌과 소유자의 책임을 어떻게 강화할지가 논의된다.","prep":{"point":"동물을 단순한 물건으로만 보는 관점은 현재 사회 인식과 맞지 않습니다.","reason":"동물은 고통을 느끼는 생명체이므로 학대와 방임을 더 강하게 막을 필요가 있습니다. 다만 법적 지위를 바꾸면 손해배상, 소유권, 축산과 실험동물 규제까지 영향을 주기 때문에 단계적 접근이 필요합니다.","example":"적용 예시(제안): 동물 보호 의무를 강화한다면 소유자 책임·보호 비용·유기 방지·피해 구제를 구체적으로 나누어 검토할 수 있습니다.","pointAgain":"성과는 선언적 문구가 아니라 학대 감소, 유기동물 감소, 책임 있는 반려문화 확산으로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"민법 개정안, 동물보호법, 유기·학대 통계","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"동물의 법적 지위를 바꾸면 손해배상·상속·소유권 등 법체계 조정이 필요하다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"공매도 제도와 자본시장 공정성","keywords":"공매도 한시 금지 불법 공매도 자본시장 개인투자자 시장효율 공매도 재개","conflict":"개인투자자 보호 ↔ 시장 효율·가격 발견","background":"금융위원회는 2025년 3월 31일부터 공매도를 전면 재개한다고 발표했고, 4월 1일 정책영상에서 재개 사실을 안내했다. 재개에 맞춰 기관의 무차입공매도 방지체계, 중앙점검시스템과 거래조건 개선 등이 도입됐다. 따라서 전면 금지가 현재 계속되는 것처럼 제시하지 말고, 과거 한시 금지의 효과와 재개 후 감시의 실효성을 평가하는 주제로 다뤄야 한다. 특정 주가 하락을 공매도 하나의 원인으로 단정하지 않는 것도 중요하다.","pro":["불법 공매도와 정보 비대칭으로부터 개인투자자를 보호할 수 있다.","급격한 하락장에서 시장 불안을 완화할 수 있다.","제도 개선 시간을 확보할 수 있다."],"con":["공매도는 과대평가된 가격을 조정하는 가격 발견 기능이 있다.","전면 금지는 외국인 투자 신뢰와 시장 유동성을 낮출 수 있다.","불법 행위 처벌 대신 합법적 거래까지 막는 과잉 대응이 될 수 있다."],"questions":["공매도 전면 금지는 개인투자자 보호에 효과적인가?","공매도의 순기능과 역기능을 설명해 보라.","불법 공매도를 줄이기 위한 제도 개선안을 제안하라."],"answer":"공매도는 개인투자자에게 불공정하게 느껴질 수 있지만, 원칙적으로는 가격 거품을 줄이고 시장 유동성을 높이는 기능도 있습니다. 문제는 불법 무차입 공매도와 정보 비대칭입니다. 저는 시장 불안이 극심한 시기에는 한시적 제한을 검토할 수 있지만, 전면 금지를 장기화하는 것은 바람직하지 않다고 봅니다. 대신 전산 시스템 구축, 불법 공매도 처벌 강화, 기관·개인 간 담보와 상환 조건의 형평성 개선이 필요합니다. 성과는 주가 상승이 아니라 시장 신뢰와 불법 거래 감소로 평가해야 합니다.","check":"2026-10-19 대표 사실 확인: 2025-03-31 전 종목 공매도 재개를 공식자료로 확인했다. 기존 제목의 ‘전면 금지’는 과거 정책 사례로만 해석해야 하며 ‘공매도 재개와 자본시장 공정성’으로 바꾸는 것이 정확하다. 이후 개별 종목의 일시 제한과 최신 감시·제재 실적은 별도 확인이 필요하다.","sources":["https://www.fsc.go.kr/no010101/84216","https://www.fsc.go.kr/no010107/84271","https://www.fsc.go.kr"],"pdf":[],"origin":"기존 자료","summary":"공매도는 2025년 3월 31일 전 종목에서 재개됐다. 현재의 면접 쟁점은 과거 전면 금지의 효과와 재개 이후 불법 공매도 방지·개인과 기관의 거래조건 공정성이다.","verifiedDate":"2026-10-19","id":"issue-053","order":52,"originalTitle":"공매도 전면 금지와 자본시장 공정성","prep":{"point":"공매도는 개인투자자에게 불공정하게 느껴질 수 있지만, 원칙적으로는 가격 거품을 줄이고 시장 유동성을 높이는 기능도 있습니다.","reason":"문제는 불법 무차입 공매도와 정보 비대칭입니다. 저는 시장 불안이 극심한 시기에는 한시적 제한을 검토할 수 있지만, 전면 금지를 장기화하는 것은 바람직하지 않다고 봅니다.","example":"적용 예시(제안): 공매도 감시를 강화한다면 불법 거래 적발과 정상적 유동성 공급을 함께 평가하는 지표를 제안할 수 있습니다.","pointAgain":"성과는 주가 상승이 아니라 시장 신뢰와 불법 거래 감소로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"2026-10-19 대표 사실 확인: 2025-03-31 전 종목 공매도 재개를 공식자료로 확인했다. 기존 제목의 ‘전면 금지’는 과거 정책 사례로만 해석해야 하며 ‘공매도 재개와 자본시장 공정성’으로 바꾸는 것이 정확하다. 이후 개별 종목의 일시 제한과 최신 감시·제재 실적은 별도 확인이 필요하다.","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"공매도는 과대평가된 가격을 조정하는 가격 발견 기능이 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"스쿨존 속도제한 탄력 운영과 교통안전","keywords":"스쿨존 민식이법 속도제한 탄력 운영 어린이 안전 교통공학","conflict":"어린이 안전 ↔ 교통 효율·규제 합리성","background":"스쿨존 속도제한을 야간·휴일에 완화하자는 논의는 어린이 안전과 교통 효율, 규제의 합리성을 함께 묻는다.","pro":["어린이 통행이 없는 시간대에는 탄력 운영이 교통 효율을 높일 수 있다.","과도한 규제라는 운전자 불만을 줄이고 규제 수용성을 높인다.","시간대별 위험 기반 관리가 가능하다."],"con":["예외가 많아지면 운전자가 규칙을 혼동하고 안전 의식이 약해질 수 있다.","야간·휴일에도 학원, 돌봄, 놀이터 이용 아동이 있을 수 있다.","속도 완화는 사고 발생 시 피해를 키운다."],"questions":["스쿨존 속도제한을 야간·휴일에 완화해야 하는가?","어린이 안전과 교통 효율이 충돌할 때 무엇을 우선해야 하는가?","스쿨존 안전을 높이는 기술적 대안을 제안하라."],"answer":"스쿨존 정책의 최우선 목표는 어린이 생명 보호입니다. 다만 모든 시간과 장소에 같은 제한을 적용하는 것이 항상 가장 효과적인지는 검토할 수 있습니다. 저는 어린이 통행량 데이터, 학교·학원 위치, 사고 이력, 보행환경을 기준으로 제한적으로 탄력 운영할 수 있다고 봅니다. 그러나 운전자가 혼동하지 않도록 표지와 신호를 명확히 하고, 횡단보도 조명, 과속 단속, 보도 분리 같은 안전시설을 먼저 강화해야 합니다. 성과는 차량 흐름보다 어린이 사고 감소와 운전자 규칙 준수율로 평가해야 합니다.","check":"스쿨존 사고 통계, 탄력 운영 지침, 지자체 시범 사례","sources":["https://www.molit.go.kr"],"pdf":[],"origin":"기존 자료","id":"issue-054","order":53,"originalTitle":"스쿨존 속도제한 탄력 운영과 교통안전","summary":"스쿨존 속도제한을 야간·휴일에 완화하자는 논의는 어린이 안전과 교통 효율, 규제의 합리성을 함께 묻는다.","prep":{"point":"스쿨존 정책의 최우선 목표는 어린이 생명 보호입니다.","reason":"다만 모든 시간과 장소에 같은 제한을 적용하는 것이 항상 가장 효과적인지는 검토할 수 있습니다. 저는 어린이 통행량 데이터, 학교·학원 위치, 사고 이력, 보행환경을 기준으로 제한적으로 탄력 운영할 수 있다고 봅니다.","example":"적용 예시(제안): 등하교가 없는 시간의 운영을 바꾼다면 보행량·사고 위험·단속 가능성을 확인한 뒤 제한된 시범 운영을 제안할 수 있습니다.","pointAgain":"성과는 차량 흐름보다 어린이 사고 감소와 운전자 규칙 준수율로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"스쿨존 사고 통계, 탄력 운영 지침, 지자체 시범 사례","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"예외가 많아지면 운전자가 규칙을 혼동하고 안전 의식이 약해질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"호르무즈해협과 에너지 안보","keywords":"국제·경제","conflict":"해상교통로의 공동 안전 확보와 군사 개입 확대에 따른 비용·위험 사이의 균형","background":"에너지 안보는 자원을 확보하는 문제와 필요한 시점에 안전하게 운송하는 문제를 함께 포함한다. 주요 해협의 통행이 불안정해지면 수입 비용과 기업의 생산 계획이 영향을 받을 수 있다. 대응을 논할 때는 외교와 국제 협력, 비축 자원, 운송로와 공급원 다변화가 각각 어느 위험을 줄이는지 구분해야 한다.","pro":["운송로 안전을 위한 국제 협력과 비상 대응 훈련은 기업과 국민이 갑작스러운 공급 차질에 대비하도록 돕는다.","비축과 공급원 다변화에 평소 비용을 지출하면 특정 지역의 충격이 국내 생활물가로 전달되는 정도를 줄일 수 있다."],"con":["군사적 대응을 중심에 두면 갈등 확대와 인명 위험, 장기적 재정 부담을 키울 수 있다.","비축 확대에도 저장 비용이 들므로 단기 충격 대응과 에너지 효율 개선 같은 장기 대책의 예산을 함께 비교해야 한다."],"questions":["해상 운송로의 위험이 커질 때 비축유 방출과 수입선 다변화 중 무엇을 먼저 판단하겠습니까?","국제적 안전 확보 요청에 참여할 때 한국이 따져야 할 이익과 위험은 무엇입니까?","에너지 가격 상승의 부담을 모든 이용자에게 똑같이 보조하는 것이 적절합니까?"],"answer":"저는 에너지 안보 대응에서 공급 차질 완화와 국민 생활 보호를 우선해야 한다고 생각합니다. 외교·안보 선택의 효과가 실제 공급 안정과 연결되는지 따져야 제한된 자원을 효과적으로 사용할 수 있기 때문입니다. 가상의 정책 제안으로 운송 차질 단계별 대응표를 만들고, 비축 방출 조건과 취약가구 지원 기준을 사전에 공개할 수 있습니다. 따라서 국제 협력의 필요성을 인정하되, 각 대응 수단의 위험과 공급 안정 효과를 따져 조합해야 합니다.","check":"해협 통항 상황은 해운·외교 당국의 날짜가 명시된 자료로 확인하고, 유가의 종류·기준일과 한국의 수입 의존 비중을 따로 확인한다. 원문에 적힌 전쟁 경과와 파병 검토는 검증 전 사실로 인용하지 않는다.","sources":[],"pdf":[{"part":1,"number":1,"title":"미국·이란(이스라엘) 전쟁과 호르무즈해협 위기","tag":"국제·경제","page":3,"text":"핵심 팩트\n2026년 3월이란의 대규모 미사일·드론 공격으로 미국·이스라엘과 전면적 무력충돌로 확대, 6월 잠정 양해각서 체결\n에도 7월 재개전되어 9월 현재까지 교착 상태\n이란의 호르무즈해협 봉쇄로 국제유가 급등, 세계적 에너지위기 촉발 — 한국은 에너지 수입의존도가 높아 유가·물가·\n운송비·무역수지에 연쇄 영향\n2026년 9월, 미국의 파병요청(압박)에 정부가 호르무즈해협 파병을 검토 중이라는 보도로 논란 촉발 — “비용 대비\n실익 불확실” 지적과 “사회적 논의 선행” 요구가 공존\n군사적 억지와 외교적 긴장완화, 전략비축유·수입선 다변화가 동시에 요구되는 상황\n예상 질문 중동 안보위기와 파병 논란 속에서 한국이 우선해야 할 대응은?\n답변 방향 동맹과 국제규범을 존중하되 최우선은 국민경제 충격 완화입니다. 전략비축유, 수입선·운송로 다변화,\n취약계층 에너지 지원을 병행하고, 파병 여부는 비용 대비 실익과 사회적 공감대를 충분히 검토한 뒤 결\n정해야 합니다.","target":"미국·이란(이스라엘) 전쟁과 호르무즈해협 위기"}],"origin":"PDF 신규","summary":"주요 해상 운송로의 불안에 대비해 외교·비축·수입선 다변화를 함께 검토하는 에너지 안보 논점이다.","prep":{"point":"저는 에너지 안보 대응에서 공급 차질 완화와 국민 생활 보호를 우선해야 한다고 생각합니다.","reason":"외교·안보 선택의 효과가 실제 공급 안정과 연결되는지 따져야 제한된 자원을 효과적으로 사용할 수 있기 때문입니다.","example":"가상의 정책 제안으로 운송 차질 단계별 대응표를 만들고, 비축 방출 조건과 취약가구 지원 기준을 사전에 공개할 수 있습니다.","pointAgain":"따라서 국제 협력의 필요성을 인정하되, 각 대응 수단의 위험과 공급 안정 효과를 따져 조합해야 합니다."},"lens":["국제관계학","에너지공학","경제학","물류학"],"evidenceCheck":"해협 통항 상황은 해운·외교 당국의 날짜가 명시된 자료로 확인하고, 유가의 종류·기준일과 한국의 수입 의존 비중을 따로 확인한다. 원문에 적힌 전쟁 경과와 파병 검토는 검증 전 사실로 인용하지 않는다.","id":"issue-055","order":54,"originalTitle":"미국·이란(이스라엘) 전쟁과 호르무즈해협 위기","originalNotes":"핵심 팩트\n2026년 3월이란의 대규모 미사일·드론 공격으로 미국·이스라엘과 전면적 무력충돌로 확대, 6월 잠정 양해각서 체결\n에도 7월 재개전되어 9월 현재까지 교착 상태\n이란의 호르무즈해협 봉쇄로 국제유가 급등, 세계적 에너지위기 촉발 — 한국은 에너지 수입의존도가 높아 유가·물가·\n운송비·무역수지에 연쇄 영향\n2026년 9월, 미국의 파병요청(압박)에 정부가 호르무즈해협 파병을 검토 중이라는 보도로 논란 촉발 — “비용 대비\n실익 불확실” 지적과 “사회적 논의 선행” 요구가 공존\n군사적 억지와 외교적 긴장완화, 전략비축유·수입선 다변화가 동시에 요구되는 상황\n예상 질문 중동 안보위기와 파병 논란 속에서 한국이 우선해야 할 대응은?\n답변 방향 동맹과 국제규범을 존중하되 최우선은 국민경제 충격 완화입니다. 전략비축유, 수입선·운송로 다변화,\n취약계층 에너지 지원을 병행하고, 파병 여부는 비용 대비 실익과 사회적 공감대를 충분히 검토한 뒤 결\n정해야 합니다.","lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"군사적 대응을 중심에 두면 갈등 확대와 인명 위험, 장기적 재정 부담을 키울 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"A","field":"법·정치·국제","title":"지방선거와 생활 공약 검증","keywords":"정치·사회","conflict":"정당 중심의 정치적 대표성과 지역 생활문제에 대한 구체적 책임성","background":"지방정부의 결정은 교통, 돌봄, 주거 환경처럼 주민이 일상에서 만나는 서비스와 이어진다. 후보의 공약을 평가할 때는 목표의 매력뿐 아니라 지방정부의 권한, 필요한 예산과 운영 인력도 살펴야 한다. 선거 이후 주민이 이행 여부를 확인할 수 있어야 투표가 일회성 선택을 넘어 지역 행정의 책임성을 높일 수 있다.","pro":["공약의 재원과 일정, 성과지표를 같은 기준으로 공개하면 유권자가 후보 간 차이를 구체적으로 비교할 수 있다.","주민의 생활 경험을 반영한 검증은 중앙정치 의제에 가려진 지역의 교통·돌봄 문제를 드러낼 수 있다."],"con":["수치로 제시하기 쉬운 사업만 평가하면 문화·공동체처럼 효과가 천천히 나타나는 공약이 과소평가될 수 있다.","정보를 읽는 시간과 역량의 격차가 있으므로 쉬운 설명과 공정한 토론 기회도 함께 제공해야 한다."],"questions":["무료 대중교통 공약을 검증하려면 후보에게 어떤 자료를 요구하겠습니까?","공약을 이행하지 못했지만 더 시급한 재난 대응에 예산을 쓴 경우 어떻게 평가하겠습니까?","지방정부의 권한 밖에 있는 공약을 유권자가 구별하려면 어떤 정보가 필요합니까?"],"answer":"저는 지방선거에서 생활 공약의 실행 가능성과 사후 책임을 중요하게 평가하겠습니다. 공약이 주민의 삶을 바꾸려면 예산과 권한, 운영 능력이 목표와 맞아야 하기 때문입니다. 가상의 검증 활동으로 통학버스 확대 공약의 대상 학생 수, 예상 비용, 운행 인력과 점검 시기를 한 장의 비교표로 만들 수 있습니다. 좋은 공약은 큰 약속에 그치지 않고 주민이 성과와 변경 이유를 확인할 수 있어야 합니다.","check":"선거 일정과 결과는 선거관리기관의 공식 자료로, 후보 공약과 사업 권한은 해당 선거공보·지방자치단체 예산서로 구분해 확인한다. 특정 선거의 투표율·개표 논란은 근거 없이 일반화하지 않는다.","sources":[],"pdf":[{"part":1,"number":2,"title":"제9회 전국동시지방선거","tag":"정치·사회","page":3,"text":"핵심 팩트\n2026년 6월3일 실시, 이재명 정부 출범 이후 첫 전국 단위 선거로 광역·기초단체장, 교육감,지방의원을 동시에 선출\n하는 4년 주기 선거\n여야 모두에게 국정 중간평가 성격으로 받아들여졌으며, 투표율·개표 관리 관련 잡음도 일부 제기\n지역소멸·돌봄·교통·교육 같은생활 의제가 핵심이었으나, 중앙정치 대리전 양상과 낮은 정책 검증, 지방의회 책임성\n문제가 반복적으로 지적됨\n예상 질문 지방선거에서 정당보다 공약을 봐야 하는 이유는?\n답변 방향 지방정부는 생활서비스와 예산 집행을 담당합니다. 재원 조달 가능성, 성과지표, 임기 내 실행 범위를\n따져야 유권자의 선택이 실제 지역 변화로 이어집니다.","target":"제9회 전국동시지방선거"}],"origin":"PDF 신규","summary":"지방선거의 선택을 생활서비스의 재원·실행 가능성·성과 검증으로 연결하는 논점이다.","prep":{"point":"저는 지방선거에서 생활 공약의 실행 가능성과 사후 책임을 중요하게 평가하겠습니다.","reason":"공약이 주민의 삶을 바꾸려면 예산과 권한, 운영 능력이 목표와 맞아야 하기 때문입니다.","example":"가상의 검증 활동으로 통학버스 확대 공약의 대상 학생 수, 예상 비용, 운행 인력과 점검 시기를 한 장의 비교표로 만들 수 있습니다.","pointAgain":"좋은 공약은 큰 약속에 그치지 않고 주민이 성과와 변경 이유를 확인할 수 있어야 합니다."},"lens":["행정학","정치외교학","사회복지학"],"evidenceCheck":"선거 일정과 결과는 선거관리기관의 공식 자료로, 후보 공약과 사업 권한은 해당 선거공보·지방자치단체 예산서로 구분해 확인한다. 특정 선거의 투표율·개표 논란은 근거 없이 일반화하지 않는다.","id":"issue-056","order":55,"originalTitle":"제9회 전국동시지방선거","originalNotes":"핵심 팩트\n2026년 6월3일 실시, 이재명 정부 출범 이후 첫 전국 단위 선거로 광역·기초단체장, 교육감,지방의원을 동시에 선출\n하는 4년 주기 선거\n여야 모두에게 국정 중간평가 성격으로 받아들여졌으며, 투표율·개표 관리 관련 잡음도 일부 제기\n지역소멸·돌봄·교통·교육 같은생활 의제가 핵심이었으나, 중앙정치 대리전 양상과 낮은 정책 검증, 지방의회 책임성\n문제가 반복적으로 지적됨\n예상 질문 지방선거에서 정당보다 공약을 봐야 하는 이유는?\n답변 방향 지방정부는 생활서비스와 예산 집행을 담당합니다. 재원 조달 가능성, 성과지표, 임기 내 실행 범위를\n따져야 유권자의 선택이 실제 지역 변화로 이어집니다.","lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"수치로 제시하기 쉬운 사업만 평가하면 문화·공동체처럼 효과가 천천히 나타나는 공약이 과소평가될 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"A","field":"과학·산업·기술","title":"AI 반도체와 산업 기반 투자","keywords":"산업·경제","conflict":"전략 산업의 신속한 투자 지원과 산업 편중·지역 부담·시장 위험 관리","background":"AI 서비스를 운영하려면 연산 장치와 메모리뿐 아니라 데이터센터, 전력망과 냉각 설비가 함께 필요하다. 반도체 생산 능력 확대도 인재와 장비·소재 공급망이 뒷받침되어야 지속될 수 있다. 산업 지원을 평가할 때는 개별 기업의 생산량보다 기반 시설의 공공성, 지역의 자원 부담, 수요 변동에 대한 대응력을 함께 살펴야 한다.","pro":["전력망과 연구 인력에 대한 투자는 여러 기업이 함께 활용하는 기반을 만들어 장기 경쟁력을 높일 수 있다.","장비·소재·설계 기업까지 지원 대상을 넓히면 특정 제품의 수요 변화에 대응할 산업 역량을 키울 수 있다."],"con":["수요 전망을 낙관해 대규모 투자를 집중하면 설비 과잉과 공공 재정의 손실 위험이 커질 수 있다.","생산시설 주변의 전력·용수 부담과 주민 생활에 미치는 영향을 지원 규모 결정에 반영해야 한다."],"questions":["반도체 기업에 대한 지원과 공공 전력망 투자는 어떤 기준으로 우선순위를 정하겠습니까?","첨단 산업 단지가 지역의 용수 이용과 충돌할 때 어떤 협의 절차가 필요합니까?","특정 반도체 제품의 수요가 감소해도 유지할 공공 투자는 무엇입니까?"],"answer":"저는 AI 반도체 지원을 기업별 보조금과 공통 기반 투자로 나누어 평가해야 한다고 생각합니다. 여러 기업과 지역 인재가 활용할 수 있는 기반은 시장 수요가 변해도 가치가 남을 수 있기 때문입니다. 가상의 정책 제안으로 공동 연구시설과 지역대학 교육을 지원하되, 전력·용수 계획과 중소기업의 이용 실적을 단계별 평가 조건으로 둘 수 있습니다. 산업 경쟁력은 단기 생산 확대뿐 아니라 다양한 기업과 지역이 함께 버틸 기반에서 나와야 합니다.","check":"제품 세대와 양산·출하 시점은 제조사 공식 발표에서 확인하고, 투자액은 발표 계획과 실제 집행을 구별한다. 원문의 코스피 수준과 주가 변동 수치는 검증 없이 사용하지 않는다.","sources":[],"pdf":[{"part":1,"number":3,"title":"반도체 초호황과 AI인프라 투자 경쟁","tag":"산업·경제","page":4,"text":"핵심 팩트\nAI 데이터센터 투자 확대에 힘입어 HBM4(4세대 고대역폭메모리) 출하가 2026년 본격화, 삼성전자·SK하이닉스가 글\n로벌 AI반도체 수요의 핵심 공급자로 부상\n한국 수출 회복의 핵심 동력이지만, 특정 품목·기업 의존도가 높아지는 구조적 위험도 함께 증가\n상반기 코스피가 8000~8800대까지 오르는 사상 최고 랠리를 이끌었으나, 9월 미국 CPI 우려와 국제유가 급등이 겹\n치며 반도체 대형주가 장중 3~4% 대 약세를 보이는 등 단기 변동성도 확대\n전력·용수·인재·소부장 생태계 확충이 산업 경쟁력의 조건으로 부상, 산업 구조 재편 논의도 활발\n예상 질문 반도체 호황을 지속 가능한 성장으로 연결하려면?\n답변 방향 메모리 우위만으로는 부족합니다. 시스템반도체·첨단패키징·장비·소재를 함께 육성하고, 지역 인재와\n전력망을 확충해 산업 생태계의 폭을 넓혀야 하며, 단기 주가 변동성에 일희일비하지 않는 중장기 투자\n관점이 필요합니다.","target":"반도체 초호황과 AI인프라 투자 경쟁"}],"origin":"PDF 신규","summary":"AI용 반도체 경쟁력의 기반인 전력·용수·인재·공급망에 공공자원을 어떻게 투입할지 논의한다.","prep":{"point":"저는 AI 반도체 지원을 기업별 보조금과 공통 기반 투자로 나누어 평가해야 한다고 생각합니다.","reason":"여러 기업과 지역 인재가 활용할 수 있는 기반은 시장 수요가 변해도 가치가 남을 수 있기 때문입니다.","example":"가상의 정책 제안으로 공동 연구시설과 지역대학 교육을 지원하되, 전력·용수 계획과 중소기업의 이용 실적을 단계별 평가 조건으로 둘 수 있습니다.","pointAgain":"산업 경쟁력은 단기 생산 확대뿐 아니라 다양한 기업과 지역이 함께 버틸 기반에서 나와야 합니다."},"lens":["반도체공학","전기공학","산업공학","경제학"],"evidenceCheck":"제품 세대와 양산·출하 시점은 제조사 공식 발표에서 확인하고, 투자액은 발표 계획과 실제 집행을 구별한다. 원문의 코스피 수준과 주가 변동 수치는 검증 없이 사용하지 않는다.","id":"issue-057","order":56,"originalTitle":"반도체 초호황과 AI인프라 투자 경쟁","originalNotes":"핵심 팩트\nAI 데이터센터 투자 확대에 힘입어 HBM4(4세대 고대역폭메모리) 출하가 2026년 본격화, 삼성전자·SK하이닉스가 글\n로벌 AI반도체 수요의 핵심 공급자로 부상\n한국 수출 회복의 핵심 동력이지만, 특정 품목·기업 의존도가 높아지는 구조적 위험도 함께 증가\n상반기 코스피가 8000~8800대까지 오르는 사상 최고 랠리를 이끌었으나, 9월 미국 CPI 우려와 국제유가 급등이 겹\n치며 반도체 대형주가 장중 3~4% 대 약세를 보이는 등 단기 변동성도 확대\n전력·용수·인재·소부장 생태계 확충이 산업 경쟁력의 조건으로 부상, 산업 구조 재편 논의도 활발\n예상 질문 반도체 호황을 지속 가능한 성장으로 연결하려면?\n답변 방향 메모리 우위만으로는 부족합니다. 시스템반도체·첨단패키징·장비·소재를 함께 육성하고, 지역 인재와\n전력망을 확충해 산업 생태계의 폭을 넓혀야 하며, 단기 주가 변동성에 일희일비하지 않는 중장기 투자\n관점이 필요합니다.","lensQuestion":"기술 원리와 성능뿐 아니라 안전·자원·검증 방법을 함께 설명해 보세요.","followup":"수요 전망을 낙관해 대규모 투자를 집중하면 설비 과잉과 공공 재정의 손실 위험이 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"A","field":"경제·노동·금융","title":"주택시장 안정과 임대차 안전망","keywords":"경제·사회","conflict":"금융 위험 억제와 주거 접근성 확보, 시장 자율과 거래 안전 강화","background":"주택은 거주에 필요한 공간인 동시에 가계 자산과 대출이 집중되는 대상이다. 같은 대출 규제도 소득과 자산, 거주 지역에 따라 서로 다른 영향을 준다. 임대차 거래에서는 정보가 부족한 임차인이 위험을 떠안을 수 있으므로 가격 안정 대책과 별도로 거래 정보의 신뢰성, 피해 예방과 회복 지원을 검토할 필요가 있다.","pro":["상환 능력과 거래 위험을 고려한 관리는 과도한 차입이 가계와 금융기관에 누적되는 것을 줄일 수 있다.","임대차 정보 확인과 상담 지원을 강화하면 전문 지식이 부족한 임차인의 의사결정을 도울 수 있다."],"con":["일률적인 대출 제한은 자산은 적지만 소득이 있는 실수요자의 주거 이동을 어렵게 만들 수 있다.","거래 절차만 복잡하게 만들면 안전 개선 효과가 작을 수 있으므로 정보 정확성과 책임 주체를 함께 설계해야 한다."],"questions":["주택 대출 규제를 평가할 때 집값 외에 어떤 지표를 보겠습니까?","첫 임대차 계약을 하는 청년에게 어떤 정보를 우선 제공해야 합니까?","주거비 지원이 임대료 상승으로 흡수되는 문제를 어떻게 점검하겠습니까?"],"answer":"저는 주택시장 대책에서 대출 위험 관리와 임차인 보호를 함께 강화해야 한다고 생각합니다. 가격 변화만으로는 가계의 실제 상환 부담이나 거래 과정의 피해 위험을 충분히 설명할 수 없기 때문입니다. 가상의 정책 제안으로 계약 전 공공 상담을 확대하고, 대출 지원 대상을 정할 때 소득과 상환 여력, 실제 거주 필요를 함께 살필 수 있습니다. 주거 안정의 성과는 가격뿐 아니라 안전하게 계약하고 계속 거주할 수 있는지로 평가해야 합니다.","check":"감독기구 신설·월세 지원·준주택 관리 등 원문의 제도는 입법안, 확정 법령, 시행 공고를 구별해 확인한다. 대출·보증 대상과 한도는 최신 공식 안내로 따로 확인한다.","sources":[],"pdf":[{"part":1,"number":11,"title":"부동산 제도개편과 주택시장","tag":"경제·사회","page":8,"text":"핵심 팩트\n국무총리 소속 부동산감독원(가칭) 설립 추진으로 시장교란 행위 대응 강화, 무주택 청년 월세 지원사업이 한시사업에\n서 계속사업으로 전환\n임대형 기숙사·오피스텔 등 준주택까지 주택임대관리업 규제 대상에 포함\n주거비와 대출 부담은 소비·결혼·출산·지역 이동에 영향을 미치며, 전세사기는 정보 비대칭과 보증·등기·중개 제도의\n허점을 드러냄\n공급 확대, 금융 건전성, 피해 회복을 균형 있게 설계해야 한다는 지적\n예상 질문 집값 안정을 위해 대출을 더 규제해야 하는가?\n답변 방향 투기성·고위험 대출은 관리해야 하지만 실수요자까지 막으면 주거 사다리가 약해집니다. 지역·주택가격\n·상환능력별 정교한 규제와 공급·임대차 안전망을 병행해야 합니다.","target":"부동산 제도개편과 주택시장"}],"origin":"PDF 신규","summary":"주택 가격·대출 위험을 관리하면서 실수요자의 주거 접근성과 임차인의 안전을 확보하는 논점이다.","prep":{"point":"저는 주택시장 대책에서 대출 위험 관리와 임차인 보호를 함께 강화해야 한다고 생각합니다.","reason":"가격 변화만으로는 가계의 실제 상환 부담이나 거래 과정의 피해 위험을 충분히 설명할 수 없기 때문입니다.","example":"가상의 정책 제안으로 계약 전 공공 상담을 확대하고, 대출 지원 대상을 정할 때 소득과 상환 여력, 실제 거주 필요를 함께 살필 수 있습니다.","pointAgain":"주거 안정의 성과는 가격뿐 아니라 안전하게 계약하고 계속 거주할 수 있는지로 평가해야 합니다."},"lens":["도시계획학","경제학","사회복지학","법학"],"evidenceCheck":"감독기구 신설·월세 지원·준주택 관리 등 원문의 제도는 입법안, 확정 법령, 시행 공고를 구별해 확인한다. 대출·보증 대상과 한도는 최신 공식 안내로 따로 확인한다.","id":"issue-058","order":57,"originalTitle":"부동산 제도개편과 주택시장","originalNotes":"핵심 팩트\n국무총리 소속 부동산감독원(가칭) 설립 추진으로 시장교란 행위 대응 강화, 무주택 청년 월세 지원사업이 한시사업에\n서 계속사업으로 전환\n임대형 기숙사·오피스텔 등 준주택까지 주택임대관리업 규제 대상에 포함\n주거비와 대출 부담은 소비·결혼·출산·지역 이동에 영향을 미치며, 전세사기는 정보 비대칭과 보증·등기·중개 제도의\n허점을 드러냄\n공급 확대, 금융 건전성, 피해 회복을 균형 있게 설계해야 한다는 지적\n예상 질문 집값 안정을 위해 대출을 더 규제해야 하는가?\n답변 방향 투기성·고위험 대출은 관리해야 하지만 실수요자까지 막으면 주거 사다리가 약해집니다. 지역·주택가격\n·상환능력별 정교한 규제와 공급·임대차 안전망을 병행해야 합니다.","lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"일률적인 대출 제한은 자산은 적지만 소득이 있는 실수요자의 주거 이동을 어렵게 만들 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"A","field":"경제·노동·금융","title":"최저임금과 업종별 차등 적용","keywords":"노동·경제","conflict":"공통된 임금 하한의 형평성과 업종별 생산성·지불 능력 차이","background":"최저임금 논의에서는 임금 수준뿐 아니라 노동시간, 고용 형태와 생활비를 함께 살펴야 한다. 업종마다 수익 구조와 인건비 비중이 다르다는 점은 차등 적용의 논거가 되지만, 낮은 임금 업종이 고착될 수 있다는 우려도 있다. 임금 하한의 조정과 사업자의 생산성·비용 개선 지원은 효과와 비용을 나누어 비교할 필요가 있다.","pro":["공통된 임금 하한을 강화하면 협상력이 약한 노동자의 기본적인 생활 기반을 보호할 수 있다.","예측 가능한 조정 기준과 생산성 지원을 함께 제시하면 사업자도 인력·설비 계획을 세우는 데 도움을 받을 수 있다."],"con":["업종의 비용 구조를 충분히 살피지 않은 급격한 조정은 근로시간 축소나 채용 감소로 이어질 가능성이 있다.","반대로 업종별 하한을 낮추는 방식은 노동자의 이동과 업종 분류 과정에서 형평성 논란을 만들 수 있다."],"questions":["업종별 차등 적용을 판단하려면 어떤 자료가 필요합니까?","최저임금 인상 뒤 총소득이 줄었다면 정책 효과를 어떻게 평가하겠습니까?","임금 보장과 영세사업자 지원을 함께 설계할 때 지원 조건은 무엇이어야 합니까?"],"answer":"저는 공통된 임금 하한을 기본으로 두되 업종별 어려움에 맞춘 보완 지원을 설계하는 접근이 필요하다고 생각합니다. 생활 보호 기능을 유지하면서 사업자의 비용 문제를 직접 개선하는 방안을 비교할 수 있기 때문입니다. 가상의 정책 제안으로 소규모 음식점의 업무 효율 개선을 지원하고, 지원 전후의 노동시간과 임금 총액, 고용 유지 여부를 함께 살필 수 있습니다. 최저임금의 성과는 시급 하나보다 노동자의 실제 소득과 고용의 질을 함께 보아야 합니다.","check":"연도별 최저임금 액수와 적용 범위는 최저임금 관련 공식 고시로 확인한다. 업종별 고용 효과는 조사 기간·사업체 규모·노동시간을 함께 제시한 자료로 비교한다.","sources":[],"pdf":[{"part":1,"number":14,"title":"최저임금 인상과 업종별 차등 논쟁","tag":"노동·경제","page":9,"text":"핵심 팩트\n2026년 1월 1일부터 최저임금이 시간당 10,320원으로 인상 시행\n최저임금은 생활 안정 장치이지만 영세사업자의 지불능력과 충돌한다는 지적이 꾸준히 제기\n업종별 차등 적용은 고용 충격 완화 주장과 저임금 낙인·형평성 우려가 공존, 근로장려세제·사회보험료 지원·생산성 개\n선이 보완책으로 논의\n예상 질문 최저임금을 업종별로 다르게 정해야 하는가?\n답변 방향 같은 노동의 기본선을 지키기 위해 전국 단일 최저임금이 원칙적으로 타당합니다. 어려운 업종은 노동\n자 임금 삭감보다 세제·사회보험·전환 지원으로 돕는 편이 낫습니다.","target":"최저임금 인상과 업종별 차등 논쟁"}],"origin":"PDF 신규","summary":"노동자의 최소 생활 기반과 업종별 지불 능력 차이를 어떤 방식으로 조정할지 논의한다.","prep":{"point":"저는 공통된 임금 하한을 기본으로 두되 업종별 어려움에 맞춘 보완 지원을 설계하는 접근이 필요하다고 생각합니다.","reason":"생활 보호 기능을 유지하면서 사업자의 비용 문제를 직접 개선하는 방안을 비교할 수 있기 때문입니다.","example":"가상의 정책 제안으로 소규모 음식점의 업무 효율 개선을 지원하고, 지원 전후의 노동시간과 임금 총액, 고용 유지 여부를 함께 살필 수 있습니다.","pointAgain":"최저임금의 성과는 시급 하나보다 노동자의 실제 소득과 고용의 질을 함께 보아야 합니다."},"lens":["경제학","경영학","사회복지학"],"evidenceCheck":"연도별 최저임금 액수와 적용 범위는 최저임금 관련 공식 고시로 확인한다. 업종별 고용 효과는 조사 기간·사업체 규모·노동시간을 함께 제시한 자료로 비교한다.","id":"issue-059","order":58,"originalTitle":"최저임금 인상과 업종별 차등 논쟁","originalNotes":"핵심 팩트\n2026년 1월 1일부터 최저임금이 시간당 10,320원으로 인상 시행\n최저임금은 생활 안정 장치이지만 영세사업자의 지불능력과 충돌한다는 지적이 꾸준히 제기\n업종별 차등 적용은 고용 충격 완화 주장과 저임금 낙인·형평성 우려가 공존, 근로장려세제·사회보험료 지원·생산성 개\n선이 보완책으로 논의\n예상 질문 최저임금을 업종별로 다르게 정해야 하는가?\n답변 방향 같은 노동의 기본선을 지키기 위해 전국 단일 최저임금이 원칙적으로 타당합니다. 어려운 업종은 노동\n자 임금 삭감보다 세제·사회보험·전환 지원으로 돕는 편이 낫습니다.","lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"업종의 비용 구조를 충분히 살피지 않은 급격한 조정은 근로시간 축소나 채용 감소로 이어질 가능성이 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"B","field":"법·정치·국제","title":"타국 군사개입과 국제질서","keywords":"국제","conflict":"국제사회의 인권·안전 대응 필요성과 주권 존중·무력 사용 확대의 위험","background":"국경을 넘어 이루어지는 군사작전은 안보와 인권 문제를 해결한다는 명분과 국가 주권을 침해한다는 비판이 충돌한다. 지도자에 대한 평가와 작전 방식의 정당성은 구별해서 판단할 필요가 있다. 면접에서는 특정 사건의 단정적 찬반보다 사전 절차, 대안의 검토, 민간인 피해와 작전 이후의 책임을 일관된 기준으로 설명하는 것이 중요하다.","pro":["중대한 피해를 방치하지 않도록 국제사회가 공동 대응 수단과 책임 있는 의사결정 절차를 갖출 필요가 있다.","민간인 보호와 피해 감시를 강화하면 개입을 주장하는 국가가 목적과 결과에 책임을 지도록 요구할 수 있다."],"con":["개입국이 위협과 명분을 자의적으로 판단하면 강대국의 선택적 무력 사용을 정당화할 위험이 있다.","지도부 교체만으로 사회 안정이 보장되지 않으므로 장기 혼란과 주민의 자기결정권에 미칠 영향을 검토해야 한다."],"questions":["어떤 기준이 충족되어야 외부의 군사개입을 검토할 수 있습니까?","개입 대상 지도자의 문제와 군사작전의 정당성을 왜 구별해야 합니까?","제재·외교·인도적 지원의 효과가 제한적일 때 다음 단계의 판단 기준은 무엇입니까?"],"answer":"저는 타국 군사개입을 판단할 때 목적뿐 아니라 절차와 예상되는 민간인 피해를 함께 평가해야 한다고 생각합니다. 좋은 명분을 내세워도 수단과 사후 계획이 부실하면 더 큰 불안정을 만들 수 있기 때문입니다. 가상의 판단 사례에서 국제적 공동 조사와 외교 중재, 주민 보호 대안을 먼저 비교하고, 각 수단의 피해와 책임 주체를 공개하도록 제안할 수 있습니다. 개입의 정당성은 상대 지도자에 대한 호불호가 아니라 일관된 기준과 결과에 대한 책임에서 찾아야 합니다.","check":"원문의 군사작전·체포·정권 교체 주장은 각국 공식 발표만으로 확정하지 말고 국제기구 자료와 독립된 보도를 대조한다. 작전 날짜·행위 주체·법적 평가를 구분하며 확인 전 사건명으로 단정하지 않는다.","sources":[],"pdf":[{"part":2,"number":1,"title":"미국의 베네수엘라 침공과 마두로 대통령 체포","tag":"국제","page":10,"text":" ],"answer":"저는 투자자 보호의 중심을 가격 보장보다 정보의 질과 거래 공정성에 두어야 한다고 생각합니다. 투자 판단에는 위험이 따르지만 허위 정보나 이해하기 어려운 설명에서 생기는 피해는 줄일 수 있기 때문입니다. 가상의 교육 제안으로 학생들이 같은 투자상품의 수수료, 차입 여부와 손실 시나리오를 비교한 뒤 선택 이유를 설명하는 활동을 할 수 있습니다. 변동성이 클수록 상승 전망보다 손실 조건을 이해할 수 있는 시장 환경을 만드는 일이 중요합니다.","check":"지수는 거래소의 날짜·종가·장중 수치를 구분해 확인하고, 등락의 원인은 확인된 사실과 해석을 나누어 설명한다. 원문의 8천선·7천선 및 특정 종가 수치는 검증 전 인용하지 않는다.","sources":[],"pdf":[{"part":2,"number":3,"title":"코스피 급등락 —  8천피 랠리에서 9월 7천선 붕괴","tag":"경제","page":10,"text":"반도체 수출 호조로 8000~8800대까지 치솟았던 코스피가 9월 11일 6,909대로 밀려나며 7천선이 붕괴, 미국 CPI 우려와 국제유\n가 상승이 주된 원인으로 지목됐다.","target":"코스피 급등락 —  8천피 랠리에서 9월 7천선 붕괴"}],"origin":"PDF 신규","summary":"시장 가격이 크게 움직일 때 정보 공개·위험 설명·거래 질서가 투자자의 판단을 어떻게 도울지 논의한다.","prep":{"point":"저는 투자자 보호의 중심을 가격 보장보다 정보의 질과 거래 공정성에 두어야 한다고 생각합니다.","reason":"투자 판단에는 위험이 따르지만 허위 정보나 이해하기 어려운 설명에서 생기는 피해는 줄일 수 있기 때문입니다.","example":"가상의 교육 제안으로 학생들이 같은 투자상품의 수수료, 차입 여부와 손실 시나리오를 비교한 뒤 선택 이유를 설명하는 활동을 할 수 있습니다.","pointAgain":"변동성이 클수록 상승 전망보다 손실 조건을 이해할 수 있는 시장 환경을 만드는 일이 중요합니다."},"lens":["경제학","금융학","통계학","경영학"],"evidenceCheck":"지수는 거래소의 날짜·종가·장중 수치를 구분해 확인하고, 등락의 원인은 확인된 사실과 해석을 나누어 설명한다. 원문의 8천선·7천선 및 특정 종가 수치는 검증 전 인용하지 않는다.","id":"issue-062","order":61,"originalTitle":"코스피 급등락 —  8천피 랠리에서 9월 7천선 붕괴","originalNotes":"반도체 수출 호조로 8000~8800대까지 치솟았던 코스피가 9월 11일 6,909대로 밀려나며 7천선이 붕괴, 미국 CPI 우려와 국제유\n가 상승이 주된 원인으로 지목됐다.","lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"가격 하락 때마다 손실을 공공자원으로 보전하면 위험을 과도하게 감수하도록 유도할 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"B","field":"법·정치·국제","title":"정치적 사건의 재판과 사법 신뢰","keywords":"정치","conflict":"재판의 독립성·당사자 권리와 공적 감시·시민의 알 권리","background":"정치적 갈등과 연결된 재판에서는 사건의 사실관계에 대한 판단과 정치적 평가가 쉽게 섞일 수 있다. 수사기관의 주장, 법정에서 다투는 내용과 재판부의 판단은 서로 다른 단계이므로 구별해야 한다. 시민이 절차를 이해할 수 있도록 정보를 제공하면서도 여론이나 정치적 압력이 판단을 대신하지 않게 하는 것이 사법 신뢰의 핵심 과제다.","pro":["주요 절차와 판단 이유를 시민이 이해할 수 있게 설명하면 근거 없는 추측을 줄이고 공적 감시를 도울 수 있다.","재판 과정의 일관된 운영과 당사자의 의견 제시 기회는 결론에 대한 견해가 달라도 절차의 정당성을 높일 수 제·인적 교류의 협력 이익과 과거사에 대한 책임·피해자 존중","background":"이웃 국가 사이에는 공급망, 재난 대응과 인적 교류처럼 협력이 필요한 분야가 존재한다. 동시에 과거사에 대한 인식 차이와 피해자의 경험은 관계의 신뢰를 좌우하는 문제다. 협력을 논의할 때는 실무적 이익만 강조하거나 모든 의제를 한 문제에 묶기보다, 각 사안의 당사자와 책임·협의 절차를 구체적으로 살펴야 한다.","pro":["재난 정보 공유와 청년·학술 교류 같은 협력은 양국 주민에게 직접적인 편익과 상호 이해의 기회를 줄 수 있다.","과거사 문제에 대한 대화를 지속할 공식 통로가 있으면 갈등이 발생해도 협의 가능성을 유지할 수 있다."],"con":["성과를 서둘러 발표하면서 피해 당사자의 의견을 충분히 듣지 않으면 합의의 지속성과 국내 신뢰가 약해질 수 있다.","협력의 이익이 집단마다 다르므로 무역·지역경제·시민사회에 미칠 영향을 구체적으로 설명해야 한다."],"questions":["실무 협력을 확대하면서 과거사 문제를 소홀히 하지 않으려면 어떤 절차가 필요합니까?","외교 합의의 국내 수용성을 높이기 위해 누구의 의견을 들어야 합니까?","청년 교류 사업의 성과를 참가자 수 외에 어떻게 평가하겠습니까?"],"answer":"저는 한일 협력의 실질적 이익과 과거사 당사자의 권리를 함께 다루는 지속적인 대화가 필요하다고 생각합니다. 피해자의 경험을 배제한 성과는 신뢰를 얻기 어렵고, 대화의 단절도 공동 과제를 해결하기 어렵게 하기 때문입니다. 가상의 정책 제안으로 공동 재난 훈련을 추진하면서 과거사 관련 협의에는 당사자 의견 청취와 설명 절차를 별도로 마련할 수 있습니다. 오래가는 협력은 빠른 발표보다 합의 내용과 절차에 대한 사회적 신뢰를 바탕으로 해야 합니다.","check":"회담 일정과 공동 발표는 외교 당국의 원문을 확인하고, 과거사 관련 합의·판결·정책 제안은 성격을 나눠 읽는다. 원문의 장소·날짜를 검증 없이 회담 사실로 사용하지 않는다.","sources":[],"pdf":[{"part":2,"number":8,"title":"한일정상회담 개최","tag":"국제","page":10,"text":"1월 13일 나라(奈良) 국립박물관에서 개최돼 양국 협력 강화 방안이 논의됐으며, 과거사 문제와 실용외교 사이 한일관계의 방향을\n보여준 계기로 평가된다.","target":"한일정상회담 개최"}],"origin":"PDF 신규","summary":"한일 간 실무 협력의 필요성과 과거사에 대한 피해자의 권리·사회적 신뢰를 함께 다루는 논점이다.","prep":{"point":"저는 한일 협력의 실질적 이익과 과거사 당사자의 권리를 함께 다루는 지속적인 대화가 필요하다고 생각합니다.","reason":"피해자의 경험을 배제한 성과는 신뢰를 얻기 어렵고, 대화의 단절도 공동 과제를 해결하기 어렵게 하기 때문입니다.","example":"가상의 정책 제안으로 공동 재난 훈련을 추진하면서 과거사 관련 협의에는 당사자 의견 청취와 설명 절차를 별도로 마련할 수 있습니다.","pointAgain":"오래가는 협력은 빠른 발표보다 합의 내용과 절차에 대한 사회적 신뢰를 바탕으로 해야 합니다."},"lens":["국제관계학","역사학","일본학","행정학"],"evidenceCheck":"회담 일정과 공동 발표는 외교 당국의 원문을 확인하고, 과거사 관련 합의·판결·정책 제안은 성격을 나눠 읽는다. 원문의 장소·날짜를 검증 없이 회담 사실로 사용하지 않는다.","id":"issue-065","order":64,"originalTitle":"한일정상회담 개최","originalNotes":"1월 13일 나라(奈良) 국립박물관에서 개최돼 양국 협력 강화 방안이 논의됐으며, 과거사 문제와 실용외교 사이 한일관계의 방향을\n보여준 계기로 평가된다.","lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"성과를 서둘러 발표하면서 피해 당사자의 의견을 충분히 듣지 않으면 합의의 지속성과 국내 신뢰가 약해질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"B","field":"환경·인구·사회","title":"대중교통 노동권과 운행의 공공성","keywords":"사회","conflict":"노동자의 협상권·안전한 근무와 시민의 필수 이동·재정 부담","background":"버스는 통학과 출근, 병원 이용에 연결되는 생활 기반이면서 운전자의 노동으로 운영되는 서비스다. 임금 문제와 함께 휴식, 인력과 운행 안전이 협상의 대상이 될 수 있다. 분쟁이 생기면 대체 수단이 적은 주민에게 영향이 집중될 수 있으므로 노사 협의의 예측 가능성, 비상교통 안내와 공적 지원금의 투명성을 함께 살펴야 한다.","pro":["근무와 휴식 조건을 개선하면 운전자의 건강뿐 아니라 승객의 안전과 서비스 지속성에도 도움이 될 수 있다.","노사·지자체가 비용과 운영 자료를 공유하면 재정 부담의 근거를 검증하고 분쟁을 조기에 조정할 수 있다."],"con":["운행 중단이 길어지면 이동 대안이 부족한 학생·고령자 등의 생활 피해가 커질 수 있다.","요금이나 보조금 인상만으로 갈등을 해결하면 운영 효율과 사업자의 책임을 점검할 기회를 놓칠 수 있다."],"questions":["대중교통 분쟁에서 노동조건과 이동권을 함께 보호할 수 있는 장치는 무엇입니까?","버스 보조금 확대에 동의하기 전에 어떤 운영 자료를 보겠습니까?","운행 중단에 대비한 대체 교통을 누구에게 우선 제공해야 합니까?"],"answer":"저는 대중교통의 공공성을 운행 유지와 노동조건을 함께 살피는 기준으로 이해해야 한다고 생각합니다. 안전한 근무가 지속되지 않으면 시민에게 안정적인 교통 서비스를 제공하기도 어렵기 때문입니다. 가상의 지역 정책으로 협상 쟁점의 비용 자료를 공개하고, 분쟁 기간에는 병원·학교 접근이 어려운 구간에 임시 이동 수단을 우선 배치할 수 있습니다. 분쟁 해결은 일시적인 타결률보다 안전한 운행과 투명한 재정 운영이 이어지는지로 평가해야 합니다.","check":"파업 시작·종료일과 합의 내용은 해당 노사·지자체 공식 자료로 확인한다. 임금 인상률의 기준과 적용 대상, 준공영제 운영 조건은 지역마다 다를 수 있으므로 원문 수치를 일반화하지 않는다.","sources":[],"pdf":[{"part":2,"number":9,"title":"서울 시내버스 노조 파업과 타결","tag":"사회","page":10,"text":"1월 13일 무기한 파업 돌입 후 이틀 만인 1월 15일 임금 인상률 2.9%로 노사 합의, 대중교통 공공성과 준공영제 운영방식에 대한\n논의로 이어졌다.","target":"서울 시내버스 노조 파업과 타결"}],"origin":"PDF 신규","summary":"버스 노동조건과 시민의 이동권을 함께 고려해 분쟁 예방·비상교통·재정 투명성을 설계하는 논점이다.","prep":{"point":"저는 대중교통의 공공성을 운행 유지와 노동조건을 함께 살피는 기준으로 이해해야 한다고 생각합니다.","reason":"안전한 근무가 지속되지 않으면 시민에게 안정적인 교통 서비스를 제공하기도 어렵기 때문입니다.","example":"가상의 지역 정책으로 협상 쟁점의 비용 자료를 공개하고, 분쟁 기간에는 병원·학교 접근이 어려운 구간에 임시 이동 수단을 우선 배치할 수 있습니다.","pointAgain":"분쟁 해결은 일시적인 타결률보다 안전한 운행과 투명한 재정 운영이 이어지는지로 평가해야 합니다."},"lens":["노동학","교통공학","행정학","사회복지학"],"evidenceCheck":"파업 시작·종료일과 합의 내용은 해당 노사·지자체 공식 자료로 확인한다. 임금 인상률의 기준과 적용 대상, 준공영제 운영 조건은 지역마다 다를 수 있으므로 원문 수치를 일반화하지 않는다.","id":"issue-066","order":65,"originalTitle":"서울 시내버스 노조 파업과 타결","originalNotes":"1월 13일 무기한 파업 돌입 후 이틀 만인 1월 15일 임금 인상률 2.9%로 노사 합의, 대중교통 공공성과 준공영제 운영방식에 대한\n논의로 이어졌다.","lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"운행 중단이 길어지면 이동 대안이 부족한 학생·고령자 등의 생활 피해가 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"B","field":"환경·인구·사회","title":"동계올림픽과 스포츠 지원의 기준","keywords":"문화","conflict":"국제대회 성과를 위한 집중 투자와 다양한 종목·선수 복지·생활체육 지원의 형평성","background":"올림픽은 선수의 오랜 훈련 성과를 보여주지만 메달 수만으로 스포츠 정책 전체를 평가하기는 어렵다. 훈련 과정의 안전과 진로, 종목별 접근성도 공적 지원의 중요한 기준이다. 특히 시설과 장비의 제약이 있는 종목은 참여 기회의 차이를 살펴야 하며, 대회에 대한 관심을 지속적인 스포츠 참여로 연결할 방안도 검토할 수 있다.","pro":["전문 코칭과 훈련시설, 부상 예방에 대한 지원은 선수의 경쟁력과 건강을 함께 높일 수 있다.","국제대회에 대한 관심을 지역 체험 프로그램으로 연결하면 잘 알려지지 않은 종목의 참여 기회를 넓힐 수 있다."],"con":["메달 가능성이 높은 종목에만 예산을 집중하면 다른 종목의 선수와 일반 시민의 참여 기반이 약해질 수 있다.","성과 압박이 선수의 휴식과 학업·진로 선택을 침해하지 않도록 지원 평가 기준을 넓혀야 한다."],"questions":["스포츠 지원의 성과를 메달 수 외에 어떤 지표로 평가하겠습니까?","국제 경쟁력이 있는 종목과 참여자가 적은 종목의 예산을 어떻게 배분하겠습니까?","국제대회 이후 생긴 관심을 청소년의 실제 운동 참여로 연결하려면 무엇이 필요합니까?"],"answer":"저는 스포츠 지원에서 대회 성적과 선수의 안전·종목 참여 기반을 함께 평가해야 한다고 생각합니다. 단기 성적만 강조하면 훈련 과정의 문제와 장기적인 참여 기회를 놓칠 수 있기 때문입니다. 가상의 정책 제안으로 국제대회 관심 종목의 체험 교실을 운영하되, 시설 접근성·지도자 안전교육·참여 지속률을 함께 점검할 수 있습니다. 공적 지원은 뛰어난 경기 성과가 선수와 시민의 지속 가능한 스포츠 활동으로 이어지도록 설계해야 합니다.","check":"대회 공식 결과에서 종목·선수·메달 집계를 확인하고, 통산 기록과 취재진 선정 수상은 별도 근거로 확인한다. 원문의 메달 수·순위·개인 기록을 검증 없이 인용하지 않는다.","sources":[],"pdf":[{"part":2,"number":10,"title":"2026 밀라노-코르티나 동계올림픽, 한국 선전","tag":"문화","page":10,"text":"2월 한국은 금3·은4·동3, 총 10개 메달로 종합 13위를 기록했으며, 최민정 선수는 한국 동·하계올림픽 통산 최다 메달(7개) 신기록\n을, 김길리 선수는 현지 취재진 선정 M VP를 달성했다.","target":"2026 밀라노-코르티나 동계올림픽, 한국 선전"}],"origin":"PDF 신규","summary":"국제대회 성적을 넘어 선수의 안전·종목 저변·생활체육 연결을 스포츠 지원의 기준으로 논의한다.","prep":{"point":"저는 스포츠 지원에서 대회 성적과 선수의 안전·종목 참여 기반을 함께 평가해야 한다고 생각합니다.","reason":"단기 성적만 강조하면 훈련 과정의 문제와 장기적인 참여 기회를 놓칠 수 있기 때문입니다.","example":"가상의 정책 제안으로 국제대회 관심 종목의 체험 교실을 운영하되, 시설 접근성·지도자 안전교육·참여 지속률을 함께 점검할 수 있습니다.","pointAgain":"공적 지원은 뛰어난 경기 성과가 선수와 시민의 지속 가능한 스포츠 활동으로 이어지도록 설계해야 합니다."} 으로 받으려면 자금 흐름과 계약 관리가 연결되어야 하기 때문입니다.","example":"가상의 개선안으로 민감한 물품 내역은 보호하되, 지급 지연 건수·기간·개선 조치는 집계 형태로 공개하는 체계를 제안할 수 있습니다.","pointAgain":"보안과 투명성은 공개 범위를 정교하게 설계해 함께 확보해야 합니다."},"lens":["행정학","회계학","국방학","경영학"],"evidenceCheck":"원문의 미지급 금액·발생 시점·완료 여부는 예산 당국·국방 당국의 공식 설명과 감사 자료를 대조해 확인한다. 예산 부족과 자금 배정 지연, 지급 처리 지연을 구별한다.","id":"issue-068","order":67,"originalTitle":"국방비 미지급 사태","originalNotes":"1월 4일 약 5,002억 원의 국방비(급식·피복·군수·시설 등)가 연말 자금 배정 문제로 미지급된 사실이 보도됐으며, 정부가 1월 9일\n긴급 지급을 완료했다.","lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"집행 정보의 세부 공개가 군수 운영이나 시설의 민감한 정보를 드러낼 수 있으므로 공개 단위를 신중히 정해야 한다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"expanded"},{"priority":"B","field":"환경·인구·사회","title":"아시안게임과 대규모 스포츠 행사의 가치","keywords":"문화","conflict":"국제 교류와 지역 활력의 기대와 행사 비용·시설 부담·지속 가능성","background":"국제 스포츠 행사는 여러 나라의 선수가 교류하는 무대이자 도시가 교통·숙박·경기 운영을 준비하는 사업이다. 개최나 참가의 성과는 순위뿐 아니라 선수의 경험, 관람 접근성과 행사 이후 남는 자원으로도 평가할 수 있다. 기대 효과를 설명할 때는 실제 방문객과 지역 소비, 시설 유지 비용을 구별해 행사 전후를 비교해야 한다.","pro":["국제대회는 다양한 종목의 선수가 경험을 쌓고 다른 문화와 교류할 기회를 제공할 수 있다.","기존 시설과 대중교통을 활용해 행사를 운영하면 지역의 스포츠 접근성을 개선하는 계기로 삼을 수 있다."],"con":["방문객 수와 경제 효과를 과대 추정하면 시설 유지비와 지역 주민의 생활 불편을 충분히 고려하지 못할 수 있다.","경기 성적 목표가 선수의 건강과 선택보다 앞서지 않도록 준비·회복 지원을 마련해야 한다."],"questions":["국제 스포츠 행사의 성공을 어떤 세 가지 기준으로 판단하겠습니까?","새 경기장을 짓는 것과 기존 시설을 분산 활용하는 것 중 무엇을 비교해야 합니까?","대회 참가 경험을 소수 선수 외의 청소년에게도 의미 있게 전달하려면 어떻게 하겠습니까?"],"answer":"저는 국제 스포츠 행사를 성적과 관중 수 외에 이후에도 남는 공공 가치로 평가해야 한다고 생각합니다. 행사가 끝난 뒤의 시설 활용과 주민 접근성이 장기 비용과 편익을 좌우하기 때문입니다. 가상의 행사 계획으로 기존 시설 사용을 우선 검토하고, 종료 후 청소년 스포츠 교실과 장애인 접근 개선에 연결하도록 제안할 수 있습니다. 국제대회는 일시적인 관심을 지속적인 참여와 교류로 이어 갈 때 의미가 커집니다.","check":"개최 일정·참가 종목·선수단 규모와 최종 성적은 조직위원회·공식 선수단 발표에서 기준일을 확인한다. 개막 전 목표와 대회 종료 후 결과를 혼동하지 않는다.","sources":[],"pdf":[{"part":2,"number":12,"title":"2026 아이치·나고야 아시안게임 개막","tag":"문화","page":11,"text":"9월 19일부터 10월 4일까지 일본에서 개최되며, 한국은 금메달 45개 이상·종합 3위권을 목표로 38개 종목에 대규모 선수단을 파\n견했다.","target":"2026 아이치·나고야 아시안게임 개막"}],"origin":"PDF 신규","summary":"대규모 국 anded"},{"priority":"B","field":"법·정치·국제","title":"중국 경제 변화와 공급과잉 논쟁","keywords":"국제·경제","conflict":"저렴한 수입품·시장 경쟁의 편익 ↔ 생산 기반·고용과 공정 경쟁 보호","background":"특정 산업의 수출 가격이 낮다고 해서 바로 부당한 공급과잉이라고 판단할 수는 없다. 생산성, 내수 수요, 정부 지원, 기업의 가격 전략을 구분해야 한다. 한국에는 수입 가격 하락의 이익과 국내 기업의 경쟁 부담이 함께 생길 수 있으므로 업종과 소비자·노동자별 영향을 나누어 정책을 설계해야 한다.","pro":["기업 지원과 가격 형성 과정을 객관적으로 조사하면 공정 경쟁을 해치는 행위에 근거를 갖춰 대응할 수 있다.","수입·수출 시장을 다변화하고 국내 생산성을 높이면 특정 시장 변화가 기업과 노동자에게 주는 충격을 완화할 수 있다."],"con":["저렴한 제품을 일괄적으로 제한하면 소비자와 그 제품을 사용하는 국내 기업의 비용이 오를 수 있다.","산업 보호가 장기 보조금 의존으로 이어지지 않도록 지원 종료 조건과 경쟁력 개선 성과를 함께 점검해야 한다."],"questions":["낮은 수출 가격이 생산성 향상 때문인지 불공정 지원 때문인지 무엇으로 구분하겠는가?","저가 수입을 제한할 때 국내 제조업 노동자와 소비자의 이해를 어떻게 조정하겠는가?","한국 기업은 중국 내수 변화와 제삼국 시장 경쟁에 각각 어떻게 대응해야 하는가?"],"answer":"저는 공급과잉 논쟁에 업종별 근거로 대응하고 산업 보호와 경쟁력 개선을 함께 추진해야 한다고 봅니다. 같은 저가 수입도 최종 소비자에게는 이익이고 경쟁 기업에는 부담일 수 있어 일괄 대응은 손실을 키울 수 있기 때문입니다. 가상의 제안으로 불공정 지원 여부를 조사하면서 영향을 받는 중소기업의 공정 전환과 노동자 재교육을 기한을 정해 지원할 수 있습니다. 판단 기준은 특정 국가에 대한 인상보다 가격 형성 근거와 국내의 순편익이어야 합니다.","check":"중국 국가통계와 국제기구의 최신 내수·생산 자료, 품목별 수출 단가·물량, 정부 지원 조사와 무역구제 결정의 근거·적용 기간을 구분해 확인한다.","sources":[],"pdf":[{"part":3,"number":32,"title":"중국 성장 둔화와 공급과잉 논쟁","tag":"국제·경제","page":14,"text":"중국의 소비·부동산 부진이 구조적 부담으로 작용하는 가운데, 전기차·배터리·태양광의 저가 수출을 둘러싼 공급과잉 논쟁이 이어\n진다.","target":"중국 성장 둔화와 공급과잉 논쟁"}],"origin":"PDF 신규","summary":"저가 수출과 생산 확대를 소비자 편익·산업 경쟁·무역 갈등의 관점에서 나누어 판단하는 주제다.","prep":{"point":"저는 공급과잉 논쟁에 업종별 근거로 대응하고 산업 보호와 경쟁력 개선을 함께 추진해야 한다고 봅니다.","reason":"같은 저가 수입도 최종 소비자에게는 이익이고 경쟁 기업에는 부담일 수 있어 일괄 대응은 손실을 키울 수 있기 때문입니다.","example":"가상의 제안으로 불공정 지원 여부를 조사하면서 영향을 받는 중소기업의 공정 전환과 노동자 재교육을 기한을 정해 지원할 수 있습니다.","pointAgain":"판단 기준은 특정 국가에 대한 인상보다 가격 형성 근거와 국내의 순편익이어야 합니다."},"lens":["국제통상","경제학","산업공학"],"evidenceCheck":"중국 국가통계와 국제기구의 최신 내수·생산 자료, 품목별 수출 단가·물량, 정부 지원 조사와 무역구제 결정의 근거·적용 기간을 구분해 확인한다.","id":"issue-086","order":85,"originalTitle":"중국 성장 둔화와 공급과잉 논쟁","originalNotes":"중국의 소비·부동산 부진이 구조적 부담으로 작용하는 가운데, 전기차·배터리·태양광의 저가 수출을 둘러싼 공급과잉 논쟁이 이어\n진다.","lensQuestion":"권리·책임·절차와
