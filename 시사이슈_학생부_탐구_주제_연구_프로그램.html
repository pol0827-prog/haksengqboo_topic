<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시사이슈 학생부 탐구 주제 연구 프로그램 · 원자료 정리 영덕고 김형진</title>
<style>
:root{--bg:#eef1f5;--ink:#17202e;--muted:#5d6878;--line:#dde2e9;--pro:#1d4fa8;--pro-soft:#e9f0fb;--con:#a4501a;--con-soft:#fdf0e5;--f:"Pretendard Variable",Pretendard,"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 var(--f);word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}button{border:0;background:none;cursor:pointer}button:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #4a7be0;outline-offset:2px}
a{color:var(--pro)}svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
mark{background:#ffe58a;border-radius:3px;color:inherit}
.app{height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.top{display:flex;align-items:center;gap:16px;padding:12px 24px;background:#fff}
.brand b{display:block;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1.25}.brand small{font-size:12px;color:var(--muted)}
.search{flex:1;max-width:540px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;background:var(--bg);border:2px solid transparent;color:var(--muted)}
.search:focus-within{background:#fff;border-color:var(--ink)}.search input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--ink)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}.prog{font-size:12.5px;color:var(--muted);margin-right:8px}
.btn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:10px;font-size:13.5px;font-weight:700}.btn:hover{background:var(--bg)}
.filters{display:flex;align-items:center;gap:16px;padding:0 24px 12px;background:#fff;border-bottom:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:none;padding:2px}.chips::-webkit-scrollbar{display:none}
.category{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:600}
.category small{color:var(--muted);font-weight:500;font-size:12px}.category[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}.category[aria-pressed=true] small{color:#c5ccd8}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--field-color)}
.seg{display:flex;flex:none;padding:3px;border-radius:10px;background:var(--bg)}.seg button{height:30px;padding:0 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}.seg [aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #1722300f}
main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);min-height:0}
.list-pane{overflow:auto;background:#fff;border-right:1px solid var(--line);min-height:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.link{color:var(--ink);text-decoration:underline;font-size:12.5px;font-weight:700;margin-left:6px}
.st{flex:none;display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid #b4bdc9;margin-top:7px}.s-read{background:#b4bdc9}.s-practiced{background:#2f9e6e;border-color:#2f9e6e}
.legend .st{width:9px;height:9px;margin:0 3px 0 8px;vertical-align:-1px}
.topic{display:flex;gap:12px;width:100%;text-align:left;padding:13px 18px;border-left:4px solid transparent;border-bottom:1px solid var(--line)}
.topic:hover{background:#f5f7fa}.topic[aria-current=true]{background:var(--field-soft);border-left-color:var(--field-color)}
.topic-name{display:block;font-size:15px;font-weight:700;line-height:1.45}.topic-meta{display:block;font-size:12.5px;color:var(--muted)}
.note{margin:0;padding:18px;font-size:12.5px;color:var(--muted)}
.empty{padding:44px 24px;text-align:center;color:var(--muted)}.empty b{display:block;margin-bottom:6px;font-size:16px;color:var(--ink)}.empty .btn{margin-top:12px;background:var(--bg)}
#detail{position:relative;overflow:auto;min-height:0}
.d-head,.tabs,.d-body,.d-foot{padding-inline:max(20px,calc((100% - 780px)/2))}
.d-head{background:#fff;padding-top:18px;padding-bottom:20px}
.back{display:none;align-items:center;gap:4px;height:36px;margin:0 0 6px -8px;padding:0 10px;border-radius:9px;font-weight:700;color:var(--muted)}
.d-meta{display:flex;align-items:center;gap:10px;margin-bottom:10px}.no{font-size:13px;color:var(--muted)}
.field-tag{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;background:var(--field-soft);color:var(--field-color);font-size:13px;font-weight:700}
.star{margin-left:auto;display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 12px;border-radius:99px;border:1px solid var(--line);font-size:13px;font-weight:700}
.star[aria-pressed=true]{background:#fff4d6;border-color:#e2b53b;color:#7d5200}.star[aria-pressed=true] svg{fill:#e2b53b}
h2{margin:0 0 8px;font-size:clamp(22px,2.4vw,28px);line-height:1.35;font-weight:800;letter-spacing:-.02em}
.summary{margin:0 0 16px;font-size:15.5px;color:#364154}
.cap{font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:5px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;border-radius:12px;overflow:hidden;font-weight:700;font-size:14.5px;line-height:1.5}
.vs span{display:flex;align-items:center;padding:10px 14px;background:var(--pro-soft);color:var(--pro)}.vs span:last-child{justify-content:flex-end;text-align:right;background:var(--con-soft);color:var(--con)}
.vs i{display:grid;place-items:center;padding:0 11px;background:var(--ink);color:#fff;font-style:normal}.vs.one{display:block}.vs.one span{background:var(--bg);color:var(--ink)}
.tabs{display:flex;gap:2px;position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.tabs button{padding:13px 18px;margin-bottom:-1px;border-bottom:3px solid transparent;font-weight:700;color:var(--muted)}.tabs [aria-selected=true]{color:var(--ink);border-color:var(--ink)}
.d-body{padding-top:24px;padding-bottom:36px}
.d-foot{position:sticky;bottom:0;display:flex;justify-content:space-between;align-items:center;padding-top:10px;padding-bottom:10px;background:#fff;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.d-foot button{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 14px;border-radius:10px;background:var(--bg);font-weight:700}
.content-section{margin:0 0 26px}.section-label{display:none}.section-title{margin:0 0 10px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.body-text{margin:0;font-size:15.5px;line-height:1.85}.reading-note{margin:10px 0 0;font-size:13px;color:var(--muted)}
.perspectives{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.perspective{padding:16px 18px;border-radius:14px;background:var(--pro-soft);border-top:4px solid var(--pro)}.perspective.caution{background:var(--con-soft);border-color:var(--con)}
.perspective-title{margin:0 0 8px;font-size:14px;color:var(--pro)}.caution .perspective-title{color:var(--con)}.points{margin:0;padding-left:1.1em}.points li{margin:7px 0}
.lens,.ask,.src,.model-toggle,.question,.prep-step,.checklist label{background:#fff;border:1px solid var(--line);border-radius:12px}
.lens{padding:14px 18px}.lens strong{display:block;font-size:13px}.lens p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.src,.model-toggle{margin-top:6px}.src{margin-bottom:24px}summary{padding:12px 16px;cursor:pointer;font-weight:700;font-size:14px}
.src .content-section{margin:0}.source-box{padding:0 16px 14px;font-size:13.5px}.source-check{margin:8px 0}
.source-status{display:inline-block;padding:2px 10px;border-radius:99px;background:#eceff3;color:var(--muted);font-size:12px;font-weight:700}.source-status.verified{background:#e4f3eb;color:#1b6948}
.source-links{display:flex;flex-wrap:wrap;gap:4px 14px}.source-original{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);font-size:13px}
.question-list,.prep-grid,.checklist{display:grid;gap:8px}.question{display:flex;gap:12px;padding:12px 16px}.question b{color:var(--pro)}.question p{margin:0}
.prep-step{display:flex;gap:12px;padding:12px 16px}.prep-step strong{font-size:13px}.prep-step p{margin:2px 0 0;font-size:14.5px}
.step-letter,.writer-letter{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:13px}
.model-caption{font-size:12.5px;color:var(--muted)}.model-answer{padding:0 16px 14px;white-space:pre-wrap;font-size:14.5px}
.ask{padding:14px 18px;margin-bottom:16px;border-left:4px solid var(--field-color)}.ask b{font-size:13px}.ask ol{margin:6px 0;padding-left:1.3em}.ask li{margin:4px 0}.ask p{margin:0;font-size:13px;color:var(--muted)}
.practice-intro{margin:0;color:var(--muted);font-size:14px}.small{font-size:12px!important;color:#c5ccd8!important}
.practice-tools{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0 20px;padding:12px 18px;border-radius:14px;background:var(--ink);color:#fff}
.timer{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}.timer.finished{color:#ffb4a0}
.timer-actions{display:flex;gap:6px}.timer-actions select,.timer-actions button{height:36px;padding:0 12px;border-radius:9px;background:#fff;color:var(--ink);font-weight:700;border:0}
.writer-block{margin-bottom:16px}.writer-label{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:700}.writer-letter{width:24px;height:24px;font-size:12px}
textarea{width:100%;min-height:96px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;line-height:1.7}.writer-block small{display:block;margin-top:4px;font-size:12.5px;color:var(--muted)}
.writer-bottom{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin:6px 0 28px}.save-message{font-size:13px;color:var(--muted)}.saved-dot{display:inline-block;width:8px;height:8px;margin-right:4px;border-radius:50%;background:#2f9e6e}
.solid-button{display:inline-flex;align-items:center;gap:6px;height:42px;padding:0 16px;border-radius:10px;background:var(--ink);color:#fff;font-weight:700}
.checklist label{display:flex;gap:10px;padding:10px 14px}.print-only{display:none}
#toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);padding:10px 18px;border-radius:99px;background:var(--ink);color:#fff;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}#toast.show{opacity:1}
@media(max-width:860px){.top{flex-wrap:wrap;gap:8px;padding:10px 14px}.brand small,.prog,.btn span{display:none}.search{order:3;flex:1 0 100%;max-width:none}
.filters{flex-direction:column;align-items:stretch;gap:8px;padding:0 14px 10px}.seg button{flex:1}
main{display:block;position:relative;overflow:hidden}.list-pane{height:100%;border:0}
#detail{position:fixed;inset:0;z-index:20;display:none}body.detail-open{overflow:hidden}body.detail-open #detail{display:block}.back{display:inline-flex}
.tabs button{flex:1;padding-inline:4px}.perspectives{grid-template-columns:1fr}}
@media print{body{background:#fff;font-size:11pt}.app{display:block;height:auto}.top,.filters,.list-pane,.tabs,.d-foot,.back,.star,.practice-tools,.writer-bottom,.checklist,#toast,.writer-block small{display:none!important}
main{display:block}#detail{position:static!important;overflow:visible;display:block!important}.d-head,.d-body{padding-inline:0}.print-only{display:block}details>*{display:block}}
.mode{display:flex;padding:3px;margin-bottom:8px;border-radius:12px;background:#fff;border:1px solid var(--line)}.mode button{flex:1;height:40px;border-radius:9px;font-weight:700;color:var(--muted)}.mode [aria-pressed=true]{background:var(--ink);color:#fff}
.hint{margin:0 0 14px;font-size:13.5px;color:var(--muted)}.major-box,.fld{display:block;margin-bottom:14px}.major-box b,.fld b{display:block;margin-bottom:4px;font-size:13.5px}
input[data-plan],#major{width:100%;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chipline{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.chipline button{height:32px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}.chipline [aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
.gcard h4{margin:0;font-size:16px}.gcard h4 small{margin-left:8px;font-size:12.5px;color:var(--field-color)}.lv{margin:2px 0 10px;font-size:13.5px;color:var(--muted)}
.cand{padding:14px 16px;margin-bottom:8px;border:1px solid var(--line);border-left:4px solid var(--field-color);border-radius:12px;background:#fff}.cand b{display:block;font-size:15px;line-height:1.5}.cand p{margin:4px 0 10px;font-size:13.5px;color:var(--muted)}
.kind{display:inline-block;margin-bottom:4px;padding:1px 9px;border-radius:99px;background:var(--field-soft);color:var(--field-color);font-size:12px;font-weight:700}
.pick{height:34px;padding:0 12px;border-radius:9px;background:var(--ink);color:#fff;font-size:13px;font-weight:700}.arrow{margin:2px 0 12px;text-align:center;font-size:12.5px;color:var(--muted)}
#draft{min-height:120px;background:#f8fafc}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.row .btn{border:1px solid var(--line);background:#fff}.chk{display:flex;gap:8px;align-items:center;font-weight:600}
@media print{.row,.chipline,.mode,.pick,.hint,.major-box{display:none!important}}
</style></head><body>
<div class="app"><header class="top"><div class="brand"><b>탐구 주제 연구 프로그램</b><small>시사이슈 106선 · 원자료 정리 영덕고 김형진 · 개작판</small></div>
<label class="search"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="q" type="search" autocomplete="off" placeholder="주제·키워드 검색   예) 저출생, 의료, AI" aria-label="주제·키워드 검색"></label>
<div class="top-actions"><span class="prog" id="progress"></span><button class="btn" id="csv" title="현재 목록을 CSV로 저장"><svg viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/></svg><span>목록 저장</span></button><button class="btn" id="print" title="지금 보는 화면을 인쇄하거나 PDF로 저장"><svg viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7zM17 11h.01"/></svg><span>인쇄 / PDF</span></button></div></header>
<div class="filters"><nav class="chips" id="categories" aria-label="분야"></nav><div class="seg" id="seg"><button data-seg="all">전체</button><button data-seg="saved">★ 관심</button><button data-seg="new">안 읽음</button><button data-seg="practiced">계획서 있음</button></div></div>
<main id="workspace"><aside class="list-pane" aria-label="주제 목록"><div class="list-head"><span id="result-count" aria-live="polite"></span><span class="legend"><i class="st"></i>안 읽음<i class="st s-read"></i>읽음<i class="st s-practiced"></i>계획서</span></div><div id="list"></div><p class="note">계획서·관심 주제는 이 브라우저에만 저장돼요. 기기를 옮기기 전에 ‘기록 전체 저장’으로 내려받으세요.</p></aside><article id="detail" tabindex="-1"></article></main></div>

<script type="application/json" id="source-data">[{"priority":"A+","field":"AI·디지털","title":"AI 기본법 시행과 고영향 AI 규제","keywords":"AI 기본법 고영향 AI 생성형 AI 합성콘텐츠 기본권 안전 설명가능성","conflict":"혁신 촉진 ↔ 기본권·안전 규제","background":"인공지능 발전과 신뢰 기반 조성 등에 관한 기본법은 2026년 1월 22일 시행됐으며, 2026년 7월 21일 시행된 개정 조문도 확인된다. 제31조는 고영향·생성형 AI를 이용한 제품·서비스의 사전 고지, 생성형 AI 결과물 표시, 실제와 구분하기 어려운 합성 음향·이미지·영상의 명확한 고지·표시를 규정한다. 면접에서는 모든 AI에 같은 의무가 적용된다고 단순화하지 말고, 적용 대상·위험 수준과 이용자 보호 장치를 구분해야 한다.","pro":["고영향 AI에 대한 투명성 요구는 차별과 안전사고를 줄인다.","생성형 AI 표시 의무는 허위정보와 딥페이크 피해를 예방한다.","법적 기준이 생기면 기업도 예측 가능하게 투자할 수 있다."],"con":["초기 규제가 과도하면 국내 AI 기업의 개발 속도가 늦어질 수 있다.","고영향 AI의 범위가 모호하면 현장 혼란이 커진다.","표시 의무만으로는 악의적 조작 콘텐츠를 막기 어렵다."],"questions":["고영향 AI를 별도로 규제해야 하는 이유는 무엇인가?","AI 면접·학생평가에 AI가 쓰인다면 어떤 조건이 필요할까?","AI 산업 육성과 기본권 보호가 충돌할 때 우선 기준은 무엇인가?","생성형 AI 표시 의무의 한계와 보완책을 말해 보라."],"answer":"저는 AI 기본법의 방향이 규제와 진흥을 동시에 설계해야 한다고 봅니다. AI는 의료 진단, 채용, 대출, 교육평가처럼 개인의 삶을 직접 바꿀 수 있기 때문에 결과 설명, 위험관리, 인간의 최종 책임이 필요합니다. 다만 모든 AI를 같은 강도로 규제하면 중소기업과 연구 현장이 위축될 수 있으므로 고영향 영역을 중심으로 차등 규제해야 합니다. 학교나 공공기관은 AI 사용 사실을 알리고, 이의제기 절차와 사람의 재검토 권리를 보장해야 합니다. 성공 여부는 산업 투자액만이 아니라 차별 민원, 사고 재발률, 설명 가능성 개선 정도로 함께 평가해야 합니다.","check":"2026-10-19 대표 사실 확인: 최초 시행일과 현행 제31조의 고지·표시 의무를 확인했다. 고영향 AI 해당 여부, 구체적 표시 방법·예외·가이드라인과 집행 유예 여부는 개별 서비스별로 추가 확인해야 한다. 법률 시행을 모든 사업자에 대한 즉시 동일 제재로 설명하지 않는다.","sources":["https://www.law.go.kr/lsInfoP.do?ancYnChk=0&efYd=20260122&lsiSeq=268543","https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1031810715","https://law.go.kr/LSW/lsInfoP.do?lsiSeq=288145&viewCls=lsRvsDocInfoR","https://www.law.go.kr/lsInfoP.do?lsId=014820"],"pdf":[{"part":1,"number":5,"title":"AI기본법 시행","tag":"법·과학","page":5,"text":"핵심 팩트\n2026년 1월 22일 한국형 인공지능 기본법 시행 —  EU  AI법에 이어 세계적으로 손꼽히는 포괄적 AI 규제체계\n고영향 AI·생성형 AI에 안전성 확보, 표시 의무 등 사업자 책임을 부과하며 산업 진흥도 함께 규정\n산업 혁신 위축 우려와 신뢰 기반 AI 생태계 조성 기대가 함께 제기되며, 기업 부담·규제 명확성·피해 구제의 실효성이\n쟁점\n예상 질문 AI 생성물 표시 의무는 필요한가?\n답변 방향 딥페이크와 허위정보 피해를 줄이기 위해 필요합니다. 다만 모든 결과물에 동일한 표시를 요구하기보다\n이용자가 실제와 혼동할 가능성과 피해 규모에 따라 차등 적용해야 합니다.","target":"AI 기본법 시행과 고영향 AI 규제"},{"part":3,"number":1,"title":"생성형 AI 경쟁과 안전 규제","tag":"과학·윤리","page":12,"text":"AI가 생산성을 높이는 동시에 오류·편향·일자리 대체 위험을 키우고 있어, 위험 수준별 차등 규제로 혁신과 안전의 균형을 맞추는\n것이 쟁점이다.","target":"AI 기본법 시행과 고영향 AI 규제"}],"origin":"기존 자료","summary":"AI 기본법은 2026년 1월 22일부터 시행됐다. 고영향·생성형 AI 서비스의 사전 고지와 생성형 AI 결과물 표시 등 신뢰 확보 의무를 산업 진흥과 함께 규정한다.","verifiedDate":"2026-10-19","id":"issue-001","order":0,"originalTitle":"AI 기본법 시행과 고영향 AI 규제","prep":{"point":"저는 AI 기본법의 방향이 규제와 진흥을 동시에 설계해야 한다고 봅니다.","reason":"AI는 의료 진단, 채용, 대출, 교육평가처럼 개인의 삶을 직접 바꿀 수 있기 때문에 결과 설명, 위험관리, 인간의 최종 책임이 필요합니다. 다만 모든 AI를 같은 강도로 규제하면 중소기업과 연구 현장이 위축될 수 있으므로 고영향 영역을 중심으로 차등 규제해야 합니다.","example":"적용 예시(제안): 가령 학교가 AI 평가를 도입한다면 사용 사실을 알리고, 판단 근거와 사람의 재검토 절차를 함께 마련할 수 있습니다.","pointAgain":"성공 여부는 산업 투자액만이 아니라 차별 민원, 사고 재발률, 설명 가능성 개선 정도로 함께 평가해야 합니다."},"originalNotes":"핵심 팩트\n2026년 1월 22일 한국형 인공지능 기본법 시행 —  EU  AI법에 이어 세계적으로 손꼽히는 포괄적 AI 규제체계\n고영향 AI·생성형 AI에 안전성 확보, 표시 의무 등 사업자 책임을 부과하며 산업 진흥도 함께 규정\n산업 혁신 위축 우려와 신뢰 기반 AI 생태계 조성 기대가 함께 제기되며, 기업 부담·규제 명확성·피해 구제의 실효성이\n쟁점\n예상 질문 AI 생성물 표시 의무는 필요한가?\n답변 방향 딥페이크와 허위정보 피해를 줄이기 위해 필요합니다. 다만 모든 결과물에 동일한 표시를 요구하기보다\n이용자가 실제와 혼동할 가능성과 피해 규모에 따라 차등 적용해야 합니다.\n\nAI가 생산성을 높이는 동시에 오류·편향·일자리 대체 위험을 키우고 있어, 위험 수준별 차등 규제로 혁신과 안전의 균형을 맞추는\n것이 쟁점이다.","evidenceCheck":"2026-10-19 대표 사실 확인: 최초 시행일과 현행 제31조의 고지·표시 의무를 확인했다. 고영향 AI 해당 여부, 구체적 표시 방법·예외·가이드라인과 집행 유예 여부는 개별 서비스별로 추가 확인해야 한다. 법률 시행을 모든 사업자에 대한 즉시 동일 제재로 설명하지 않는다.","lens":["컴퓨터공학","정보보호","미디어","법학"],"lensQuestion":"기술의 성능과 함께 데이터·책임·이용자의 권리를 연결해 설명해 보세요.","followup":"초기 규제가 과도하면 국내 AI 기업의 개발 속도가 늦어질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A+","field":"교육·의료","title":"의대 정원과 지역의사제","keywords":"의대 정원 지역의사제 필수의료 의료공공성 지역격차 직업선택 자유","conflict":"의료공공성 ↔ 직업선택의 자유·교육의 질","background":"정부는 2026년 2월 10일 기존 의대의 2027학년도 정원을 2024학년도보다 490명 늘리는 단계적 의사인력 양성 계획을 발표했다. 지역의사의 양성 및 지원 등에 관한 법률은 2025년 12월 23일 제정돼 2026년 2월 24일부터 시행됐다. 보건복지부는 2026년 4월 30일 대학·지역별 지역의사선발전형 정원 확정과 9월 3일 첫 선발 안내를 게시했다. 정원 확대 자체와 특정 전형의 지원자격·복무 조건을 구분해 이해해야 한다.","pro":["지역·필수의료 인력 부족을 국가가 방치하기 어렵다.","공공적 지원을 받는 선발이라면 일정한 지역 복무 의무를 설계할 수 있다.","비수도권 의료 접근성 개선은 생명권과 직결된다."],"con":["단순 증원만으로 필수과 기피와 지역 이탈을 해결하기 어렵다.","의학교육 실습 여건이 따라오지 않으면 교육의 질이 낮아질 수 있다.","장기 의무복무는 개인의 직업 선택 자유와 충돌할 수 있다."],"questions":["의대 정원 확대가 지역 의료 문제를 실제로 해결할 수 있을까?","지역의사제는 정당한 공공정책인가, 과도한 제한인가?","교육의 질을 보장하려면 무엇을 먼저 점검해야 하는가?","필수의료 기피 문제의 원인을 정원 부족만으로 볼 수 있을까?"],"answer":"의대 증원은 필요하지만, 정원 확대만으로 지역 의료 문제가 해결된다고 보기는 어렵습니다. 지역에 의사가 부족한 이유는 인원 부족뿐 아니라 근무 여건, 보상, 법적 위험, 교육·생활 인프라가 함께 작용하기 때문입니다. 지역의사제도 공공 장학금과 지역 수련, 적정 보상, 의무복무 이후 정착 지원이 결합될 때 정당성이 커집니다. 반대로 강제 배치처럼 보이면 직업 선택의 자유 침해 논란이 생깁니다. 따라서 정부는 대학별 교육 여건, 필수과 수련 환경, 지역 근무 유지율을 공개하고, 단기 증원보다 장기 정착률을 핵심 지표로 삼아야 합니다.","check":"2026-10-19 대표 사실 확인: 지역의사제를 단순한 법안 처리 대기 상태로 설명하지 않는다. 490명은 2026-02-10 정부 발표의 2027학년도 증원 규모이다. 대학·전형별 실제 모집인원과 지원자격, 의무복무지역·기간 계산은 대학의 최종 모집요강과 최신 시행령·시행규칙을 함께 확인해야 한다. 공공의대·신설 지역의대 설립 가정이 포함된 중장기 수치를 현재 확정 모집인원과 혼용하지 않는다.","sources":["https://www.mohw.go.kr/gallery.es?act=view&bid=0003&list_no=379870&mid=a10605040000","https://www.law.go.kr/lsInfoP.do?lsId=014995","https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1490390&mid=a10503010100","https://www.mohw.go.kr/board.es?act=view&bid=0027&list_no=1491782&mid=a10503010100","https://www.mohw.go.kr/gallery.es?act=view&bid=0003&list_no=379870&mid=a10605040000&tag="],"pdf":[{"part":1,"number":7,"title":"2027학년도 의대정원 증원과 의료개혁","tag":"보건·지역","page":6,"text":"핵심 팩트\n2026년 2월, 2025·2026학년도 내내 이어진 의정 갈등 끝에 2027학년도 의대 정원을 490명 늘리기로 확정, 이후 5년\n간 연평균 668명씩 단계적 증원하는 중장기 계획도 함께 발표\n의료 공백 우려(의료계) vs 의사 수 부족 해소 필요성(정부) 간 입장차는 여전히 진행 중\n필수·지역의료 인력 부족과 수도권 대형병원 쏠림이 지속되는 가운데, 의대 정원뿐 아니라 수련·보상·근무환경·배치가\n함께 논의돼야 한다는 지적\n지역의사제는 공공성 강화와 직업선택 자유 사이의 논쟁으로 이어짐\n예상 질문 지역의사제에 찬성하는가?\n답변 방향 조건부 찬성입니다. 장학 지원과 일정 기간 지역근무를 연계하되 충분한 교육·수련환경, 합리적 보상,\n예외·이동 기준을 마련해야 지속 가능한 제도가 됩니다.","target":"2027 의대 증원과 지역의사제"}],"origin":"기존 자료","summary":"2027학년도 의대 인력 양성 확대와 지역의사선발전형은 지역·필수의료 확보를 목표로 한다. 지역의사법은 이미 시행 중이므로 법안 논의 단계와 구별해야 한다.","verifiedDate":"2026-10-19","id":"issue-002","order":1,"originalTitle":"2027 의대 증원과 지역의사제","prep":{"point":"의대 증원은 필요하지만, 정원 확대만으로 지역 의료 문제가 해결된다고 보기는 어렵습니다.","reason":"지역에 의사가 부족한 이유는 인원 부족뿐 아니라 근무 여건, 보상, 법적 위험, 교육·생활 인프라가 함께 작용하기 때문입니다. 지역의사제도 공공 장학금과 지역 수련, 적정 보상, 의무복무 이후 정착 지원이 결합될 때 정당성이 커집니다.","example":"적용 예시(제안): 지역 수련과 장기 근무를 연결하되, 주거·교육·협진 환경을 지원하는 정책을 함께 설계하는 방안을 제안할 수 있습니다.","pointAgain":"따라서 정부는 대학별 교육 여건, 필수과 수련 환경, 지역 근무 유지율을 공개하고, 단기 증원보다 장기 정착률을 핵심 지표로 삼아야 합니다."},"originalNotes":"핵심 팩트\n2026년 2월, 2025·2026학년도 내내 이어진 의정 갈등 끝에 2027학년도 의대 정원을 490명 늘리기로 확정, 이후 5년\n간 연평균 668명씩 단계적 증원하는 중장기 계획도 함께 발표\n의료 공백 우려(의료계) vs 의사 수 부족 해소 필요성(정부) 간 입장차는 여전히 진행 중\n필수·지역의료 인력 부족과 수도권 대형병원 쏠림이 지속되는 가운데, 의대 정원뿐 아니라 수련·보상·근무환경·배치가\n함께 논의돼야 한다는 지적\n지역의사제는 공공성 강화와 직업선택 자유 사이의 논쟁으로 이어짐\n예상 질문 지역의사제에 찬성하는가?\n답변 방향 조건부 찬성입니다. 장학 지원과 일정 기간 지역근무를 연계하되 충분한 교육·수련환경, 합리적 보상,\n예외·이동 기준을 마련해야 지속 가능한 제도가 됩니다.","evidenceCheck":"2026-10-19 대표 사실 확인: 지역의사제를 단순한 법안 처리 대기 상태로 설명하지 않는다. 490명은 2026-02-10 정부 발표의 2027학년도 증원 규모이다. 대학·전형별 실제 모집인원과 지원자격, 의무복무지역·기간 계산은 대학의 최종 모집요강과 최신 시행령·시행규칙을 함께 확인해야 한다. 공공의대·신설 지역의대 설립 가정이 포함된 중장기 수치를 현재 확정 모집인원과 혼용하지 않는다.","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"단순 증원만으로 필수과 기피와 지역 이탈을 해결하기 어렵다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A+","field":"환경·인구·사회","title":"2035 국가 온실가스 감축목표","keywords":"2035 NDC 온실가스 감축 탄소중립 기후위기 산업경쟁력 전력정책","conflict":"미래세대 기후책임 ↔ 산업경쟁력·전환비용","background":"2035 NDC는 기후윤리를 넘어 산업 전환, 전기요금, 재생에너지, 원전, 탄소국경조정까지 연결되는 종합형 면접 주제다.","pro":["강한 감축목표는 미래세대 피해와 국제 통상 리스크를 줄인다.","녹색 산업과 에너지 효율 투자를 촉진한다.","기업의 장기 투자 방향을 명확히 한다."],"con":["전환 속도가 너무 빠르면 제조업 비용과 고용 충격이 커질 수 있다.","전력망·저장장치가 따라오지 않으면 목표가 선언에 그칠 수 있다.","취약계층 에너지 비용 부담이 커질 수 있다."],"questions":["기후목표를 높이면 어떤 산업·세대 갈등이 생길까?","기후정책에서 공정전환이 필요한 이유는 무엇인가?","청소년 세대가 기후정책에 더 강하게 요구할 수 있는 근거는 무엇인가?"],"answer":"2035 NDC는 단순한 환경 목표가 아니라 산업정책이기도 합니다. 감축 목표를 낮게 잡으면 미래세대와 수출기업이 더 큰 기후 비용과 통상 장벽을 부담할 수 있습니다. 그러나 목표만 높이고 전력망, 재생에너지 입지, 산업 전환 지원을 마련하지 않으면 현장 비용만 커집니다. 그래서 저는 감축 목표와 함께 업종별 전환 로드맵, 노동자 재교육, 취약계층 전기요금 보호, 지역별 재생에너지 이익 공유가 같이 가야 한다고 봅니다. 성공 지표는 배출량뿐 아니라 전환 과정의 고용 유지와 에너지 빈곤 감소까지 포함해야 합니다.","check":"정부 최종 제출 NDC 수치, 산업별 감축 로드맵, 전력수급계획","sources":["https://ebrief.korea.kr/briefing/66875"],"pdf":[],"origin":"기존 자료","id":"issue-003","order":2,"originalTitle":"2035 국가 온실가스 감축목표","summary":"2035 NDC는 기후윤리를 넘어 산업 전환, 전기요금, 재생에너지, 원전, 탄소국경조정까지 연결되는 종합형 면접 주제다.","prep":{"point":"2035 NDC는 단순한 환경 목표가 아니라 산업정책이기도 합니다.","reason":"감축 목표를 낮게 잡으면 미래세대와 수출기업이 더 큰 기후 비용과 통상 장벽을 부담할 수 있습니다. 그러나 목표만 높이고 전력망, 재생에너지 입지, 산업 전환 지원을 마련하지 않으면 현장 비용만 커집니다.","example":"적용 예시(제안): 감축 지원이 필요한 중소기업에는 공정 전환과 노동자 재교육을 묶고 성과를 단계별로 점검하는 방안을 생각할 수 있습니다.","pointAgain":"성공 지표는 배출량뿐 아니라 전환 과정의 고용 유지와 에너지 빈곤 감소까지 포함해야 합니다."},"originalNotes":"","evidenceCheck":"정부 최종 제출 NDC 수치, 산업별 감축 로드맵, 전력수급계획","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"전환 속도가 너무 빠르면 제조업 비용과 고용 충격이 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A+","field":"경제·노동·금융","title":"국민연금 개혁과 세대 간 형평성","keywords":"국민연금 보험료율 소득대체율 기금소진 세대 형평성 노후소득","conflict":"재정 지속가능성 ↔ 세대 간 형평성","background":"개정 국민연금 제도에 따라 보험료율은 2026년 9.5%부터 매년 0.5%포인트씩 인상돼 2033년 13%가 된다. 명목소득대체율은 2026년부터 43%로 조정된다. 이는 모든 기존 수급자의 연금이 일괄 인상된다는 뜻이 아니며 가입기간·소득 등에 따라 실제 급여가 달라진다. 면접에서는 노후소득 보장, 현재의 보험료 부담, 장기 재정 지속가능성을 함께 논의해야 한다.","pro":["보험료율 조정은 기금 고갈 시점을 늦추고 제도 신뢰를 높인다.","소득대체율을 일정 수준 유지해야 노인빈곤을 줄일 수 있다.","일찍 개혁할수록 충격을 나눌 수 있다."],"con":["청년 세대는 고용 불안 속에서 보험료 부담 증가를 크게 느낄 수 있다.","기금 고갈 시점 연장만으로 장기 지속가능성이 완성되지는 않는다.","사각지대 노동자는 개혁의 혜택에서 밀릴 수 있다."],"questions":["국민연금 개혁에서 청년 세대가 불리하다고 느끼는 이유는 무엇인가?","보험료율 인상과 급여 보장의 균형은 어떻게 잡아야 하는가?","국민연금 사각지대를 줄이는 방법을 제안해 보라."],"answer":"국민연금 개혁은 어느 한 세대의 양보만 요구해서는 지속되기 어렵습니다. 보험료를 조금씩 올리는 것은 기금 안정에 필요하지만, 청년들은 불안정 고용과 주거비 부담 속에서 현재 부담을 크게 느낍니다. 따라서 보험료율 조정은 저소득·플랫폼 노동자 지원, 출산·군복무 크레딧 확대, 기금 운용 투명성 강화와 함께 가야 합니다. 또한 소득대체율을 무조건 낮추면 노인빈곤이 악화될 수 있으므로 기초연금, 퇴직연금과의 역할 분담도 필요합니다. 성공은 기금소진 시점뿐 아니라 가입 사각지대 감소와 세대별 순부담 공개로 평가해야 합니다.","check":"2026-10-19 대표 사실 확인: 보험료율 9.5% 및 단계적 인상 일정, 명목소득대체율 43%를 확인했다. 보험료율 13%를 2026년 즉시 적용 수치로 쓰지 않는다. 기금소진 예상연도와 수익률은 추계 시점·가정에 따라 달라지므로 이번 확인에서는 최신 확정 수치로 제시하지 않는다.","sources":["https://www.korea.kr/news/policyNewsView.do?newsId=148957270","https://m.korea.kr/briefing/pressReleaseView.do?newsId=156679996","https://www.nps.or.kr/pnsinfo/ntpsklg/getOHAF0104M0.do"],"pdf":[{"part":1,"number":4,"title":"국민연금 개혁과 세대 간 형평","tag":"복지·경제","page":4,"text":"핵심 팩트\n2026년 1월 1일부터 개정 국민연금법 시행(2007년 이후 18년 만의 개혁) —  보험료율은 9% 에서 2033년까지 매년\n0.5% p씩 인상(2026년 첫 인상), 소득대체율은 2026년부터 곧바로 43% 로 상향\n다만 2026년 1월 이후 가입기간부터 적용되어 세대 간 형평성 논란이 계속\n저출생·고령화로 보험료 부담과 급여 지속가능성 문제가 심화되는 가운데, 보험료율·소득대체율·국고지원·수급개시연\n령을 함께 검토해야 한다는 지적\n청년 불신을 줄이려면 장기 재정전망과 자동조정 기준의 투명성이 중요\n예상 질문 연금개혁에서 무엇을 가장 우선해야 하나?\n답변 방향 지속가능성과 노후소득 보장을 동시에 봐야 합니다. 부담 조정은 단계적으로 하고 저소득 가입자 지원\n과 기초연금 역할을 정비해 개혁 비용이 청년이나 취약층에 편중되지 않게 해야 합니다.","target":"국민연금 개혁과 세대 간 형평성"}],"origin":"기존 자료","summary":"2026년 국민연금 보험료율은 9.5%이고 2033년 13%까지 단계적으로 오른다. 명목소득대체율 43%는 40년 가입 등을 전제로 한 제도 지표로 개인별 실제 수령액과 다르다.","verifiedDate":"2026-10-19","id":"issue-004","order":3,"originalTitle":"국민연금 개혁과 세대 간 형평성","prep":{"point":"국민연금 개혁은 어느 한 세대의 양보만 요구해서는 지속되기 어렵습니다.","reason":"보험료를 조금씩 올리는 것은 기금 안정에 필요하지만, 청년들은 불안정 고용과 주거비 부담 속에서 현재 부담을 크게 느낍니다. 따라서 보험료율 조정은 저소득·플랫폼 노동자 지원, 출산·군복무 크레딧 확대, 기금 운용 투명성 강화와 함께 가야 합니다.","example":"적용 예시(제안): 보험료 부담만 비교하지 않고 세대별 가입기간·소득·수급 전망을 함께 보는 상담 자료를 제안할 수 있습니다.","pointAgain":"성공은 기금소진 시점뿐 아니라 가입 사각지대 감소와 세대별 순부담 공개로 평가해야 합니다."},"originalNotes":"핵심 팩트\n2026년 1월 1일부터 개정 국민연금법 시행(2007년 이후 18년 만의 개혁) —  보험료율은 9% 에서 2033년까지 매년\n0.5% p씩 인상(2026년 첫 인상), 소득대체율은 2026년부터 곧바로 43% 로 상향\n다만 2026년 1월 이후 가입기간부터 적용되어 세대 간 형평성 논란이 계속\n저출생·고령화로 보험료 부담과 급여 지속가능성 문제가 심화되는 가운데, 보험료율·소득대체율·국고지원·수급개시연\n령을 함께 검토해야 한다는 지적\n청년 불신을 줄이려면 장기 재정전망과 자동조정 기준의 투명성이 중요\n예상 질문 연금개혁에서 무엇을 가장 우선해야 하나?\n답변 방향 지속가능성과 노후소득 보장을 동시에 봐야 합니다. 부담 조정은 단계적으로 하고 저소득 가입자 지원\n과 기초연금 역할을 정비해 개혁 비용이 청년이나 취약층에 편중되지 않게 해야 합니다.","evidenceCheck":"2026-10-19 대표 사실 확인: 보험료율 9.5% 및 단계적 인상 일정, 명목소득대체율 43%를 확인했다. 보험료율 13%를 2026년 즉시 적용 수치로 쓰지 않는다. 기금소진 예상연도와 수익률은 추계 시점·가정에 따라 달라지므로 이번 확인에서는 최신 확정 수치로 제시하지 않는다.","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"청년 세대는 고용 불안 속에서 보험료 부담 증가를 크게 느낄 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A+","field":"경제·노동·금융","title":"한미 관세·전략투자와 경제안보","keywords":"한미 관세 전략투자 공급망 경제안보 보호무역 자유무역","conflict":"자유무역 ↔ 경제안보·공급망 자립","background":"미중 경쟁과 미국 통상정책 변화 속에서 관세, 강제노동, 과잉생산, 전략산업 투자가 함께 다뤄지는 주제다.","pro":["전략산업 투자는 공급망 리스크를 줄이고 일자리를 만들 수 있다.","인권·안보 기준을 반영한 통상정책은 국제 규범을 강화한다.","핵심 소재·부품 자립은 위기 대응력을 높인다."],"con":["관세는 소비자 가격 상승과 기업 비용 부담으로 이어질 수 있다.","보호무역이 확산되면 수출 중심 경제에 불리하다.","기업 투자가 정치적 조건에 지나치게 묶일 수 있다."],"questions":["자유무역과 경제안보가 충돌할 때 국가는 무엇을 우선해야 하는가?","관세 정책은 국내 산업 보호인가, 소비자 부담인가?","청소년 소비자와 노동자는 통상정책의 영향을 어떻게 받는가?"],"answer":"최근 통상정책은 값싼 상품을 자유롭게 거래하는 문제를 넘어 안보와 인권, 공급망 안정까지 포함합니다. 핵심 산업을 보호하려는 관세와 전략투자는 위기 대응력을 높일 수 있지만, 비용은 소비자 가격과 기업 부담으로 돌아올 수 있습니다. 그래서 저는 모든 산업을 보호하기보다 반도체, 배터리, 에너지처럼 안보성이 큰 분야에 한정하고, 관세로 생긴 부담은 취약계층과 중소기업 지원으로 완화해야 한다고 봅니다. 정책 효과는 국내 생산 증가뿐 아니라 소비자 물가, 수출 감소, 공급망 안정성을 함께 보며 판단해야 합니다.","check":"미국 통상조치 최종 관세율, 한국 기업 투자 조건, WTO·FTA 분쟁 가능성","sources":["https://www.yna.co.kr/view/AKR20260724080100003"],"pdf":[{"part":3,"number":2,"title":"미국 관세정책과 세계 무역질서 재편","tag":"국제·경제","page":12,"text":"보편·품목 관세와 상호 투자 요구가 공급망과 기업 입지를 바꾸고 있으며, 수출 비중이 큰 한국은 업종별 충격 대응과 시장 다변화\n가 과제다.","target":"한미 관세·전략투자와 경제안보"}],"origin":"기존 자료","id":"issue-005","order":4,"originalTitle":"한미 관세·전략투자와 경제안보","summary":"미중 경쟁과 미국 통상정책 변화 속에서 관세, 강제노동, 과잉생산, 전략산업 투자가 함께 다뤄지는 주제다.","prep":{"point":"최근 통상정책은 값싼 상품을 자유롭게 거래하는 문제를 넘어 안보와 인권, 공급망 안정까지 포함합니다.","reason":"핵심 산업을 보호하려는 관세와 전략투자는 위기 대응력을 높일 수 있지만, 비용은 소비자 가격과 기업 부담으로 돌아올 수 있습니다. 그래서 저는 모든 산업을 보호하기보다 반도체, 배터리, 에너지처럼 안보성이 큰 분야에 한정하고, 관세로 생긴 부담은 취약계층과 중소기업 지원으로 완화해야 한다고 봅니다.","example":"적용 예시(제안): 수출기업 지원을 시장 다변화·원산지 관리·협력업체 전환 지원과 함께 추진하는 방안을 검토할 수 있습니다.","pointAgain":"정책 효과는 국내 생산 증가뿐 아니라 소비자 물가, 수출 감소, 공급망 안정성을 함께 보며 판단해야 합니다."},"originalNotes":"보편·품목 관세와 상호 투자 요구가 공급망과 기업 입지를 바꾸고 있으며, 수출 비중이 큰 한국은 업종별 충격 대응과 시장 다변화\n가 과제다.","evidenceCheck":"미국 통상조치 최종 관세율, 한국 기업 투자 조건, WTO·FTA 분쟁 가능성","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"관세는 소비자 가격 상승과 기업 비용 부담으로 이어질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"AI·디지털","title":"생성형 AI 저작권·딥페이크","keywords":"생성형 AI 저작권 딥페이크 초상권 학습데이터 창작자 권리","conflict":"기술혁신 ↔ 창작자 권리·인격권","background":"생성형 AI는 창작 도구이면서 타인의 저작물, 얼굴, 목소리를 학습·모방할 수 있어 저작권과 인격권 논쟁을 낳는다.","pro":["AI는 창작 접근성을 높이고 새로운 산업을 만든다.","공정한 학습 기준이 마련되면 교육·연구 활용이 커진다.","탐지·표시 기술은 피해 예방에 도움을 준다."],"con":["무단 학습은 창작자의 경제적 권리를 침해할 수 있다.","딥페이크는 명예훼손과 성범죄 피해로 이어질 수 있다.","AI 생성물의 책임 주체가 불분명하다."],"questions":["AI 학습에 저작물을 사용하는 것은 어디까지 허용해야 하는가?","딥페이크 피해를 줄이기 위한 학교·플랫폼의 역할은 무엇인가?","AI 창작물을 인간 창작물과 같은 방식으로 보호해야 할까?"],"answer":"생성형 AI는 창작의 문턱을 낮추지만, 타인의 작품과 얼굴을 무단으로 이용할 수 있다는 점에서 명확한 기준이 필요합니다. 저는 공익적 연구와 개인 학습은 일정 범위에서 허용하되, 상업적 서비스는 학습 데이터 출처 공개, 보상 체계, 삭제 요청권을 갖춰야 한다고 봅니다. 딥페이크는 표현의 자유 문제가 아니라 피해자의 인격권과 안전 문제로 접근해야 합니다. 학교에서는 제작 금지 교육만이 아니라 피해 신고 절차와 디지털 시민성 교육을 병행해야 합니다. 성공 기준은 AI 산업 성장과 함께 창작자 보상, 피해 신고 처리 속도, 재유포 차단률입니다.","check":"저작권법 개정 논의, 딥페이크 처벌·플랫폼 책임 강화안","sources":["https://www.copyright.or.kr/information-materials/trend/tmis/view.do?brdctsno=55125"],"pdf":[{"part":3,"number":7,"title":"딥페이크 성범죄·허위정보","tag":"디지털·인권","page":12,"text":"생성형 AI로 얼굴·음성 합성 비용이 급감하면서 피해가 빠르게 확산돼, 비동의 합성물 처벌 강화와 플랫폼의 신속 삭제 의무가 대안\n으로 제시된다.","target":"생성형 AI 저작권·딥페이크"}],"origin":"기존 자료","id":"issue-006","order":5,"originalTitle":"생성형 AI 저작권·딥페이크","summary":"생성형 AI는 창작 도구이면서 타인의 저작물, 얼굴, 목소리를 학습·모방할 수 있어 저작권과 인격권 논쟁을 낳는다.","prep":{"point":"생성형 AI는 창작의 문턱을 낮추지만, 타인의 작품과 얼굴을 무단으로 이용할 수 있다는 점에서 명확한 기준이 필요합니다.","reason":"저는 공익적 연구와 개인 학습은 일정 범위에서 허용하되, 상업적 서비스는 학습 데이터 출처 공개, 보상 체계, 삭제 요청권을 갖춰야 한다고 봅니다. 딥페이크는 표현의 자유 문제가 아니라 피해자의 인격권과 안전 문제로 접근해야 합니다.","example":"적용 예시(제안): 학교의 생성형 AI 과제에 사용 범위와 인용 규칙을 정하고, 합성 이미지의 표시·동의 기준을 적용하는 방안을 제안할 수 있습니다.","pointAgain":"성공 기준은 AI 산업 성장과 함께 창작자 보상, 피해 신고 처리 속도, 재유포 차단률입니다."},"originalNotes":"생성형 AI로 얼굴·음성 합성 비용이 급감하면서 피해가 빠르게 확산돼, 비동의 합성물 처벌 강화와 플랫폼의 신속 삭제 의무가 대안\n으로 제시된다.","evidenceCheck":"저작권법 개정 논의, 딥페이크 처벌·플랫폼 책임 강화안","lens":["컴퓨터공학","정보보호","미디어","법학"],"lensQuestion":"기술의 성능과 함께 데이터·책임·이용자의 권리를 연결해 설명해 보세요.","followup":"무단 학습은 창작자의 경제적 권리를 침해할 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"고교학점제 보완과 평가 공정성","keywords":"고교학점제 선택과목 최소 성취수준 평가 공정성 학교 간 격차","conflict":"학생 선택권 ↔ 평가 공정성·학교 간 격차","background":"교육부의 2028 대학입시제도 개편 확정안은 국어·수학·사회·과학의 선택과목 없는 통합형 수능과 내신 5등급 체제를 규정했다. 수능 수학 출제에서 미적분Ⅱ·기하는 제외하며, 고교 내신의 사회·과학 융합 선택과목은 상대평가 석차등급을 기재하지 않는다. 2025년 고교 입학생부터 적용되는 내신과 2028학년도 대입을 연결하되, 현재 모든 고등학생에게 같은 평가 체제가 적용된다고 설명해서는 안 된다. 고교학점제에서는 과목 개설과 이수 기회의 학교 간 차이를 함께 살펴야 한다.","pro":["학생 진로에 맞는 과목 선택과 책임 있는 학습을 강화한다.","획일적 교육과정에서 벗어나 다양한 역량을 보여줄 수 있다.","최소 성취수준 보장은 학습 결손을 줄이는 장치가 될 수 있다."],"con":["학교별 개설 과목 차이가 입시 기회 격차로 이어질 수 있다.","과목 선택이 전략화되면 진로 탐색보다 내신 유불리가 커진다.","교사 업무와 평가 부담이 늘어날 수 있다."],"questions":["고교학점제가 대입 공정성을 높이는가, 낮추는가?","소규모 학교 학생의 선택권을 어떻게 보장할 수 있을까?","학생의 과목 선택을 평가할 때 무엇을 봐야 할까?"],"answer":"고교학점제의 취지는 학생이 진로에 맞게 배우도록 하는 데 있습니다. 그러나 학교마다 개설 과목과 교사 수가 다르면 선택권 자체가 불평등해질 수 있습니다. 그래서 공동교육과정, 온라인 수업, 지역 대학·기관 연계가 필요하며, 대입에서는 어려운 과목을 선택한 노력과 성취를 함께 보아야 합니다. 또한 최소 성취수준 보장은 낙인보다 보충학습 기회로 설계되어야 합니다. 제도 성공은 선택 과목 수만이 아니라 소규모 학교 학생의 이수 기회, 과목 쏠림 감소, 학생 만족도와 학업성취 회복률로 평가해야 합니다.","check":"2026-10-19 대표 사실 확인: 2028 대입 개편 확정안의 통합형 수능·내신 5등급·융합 선택과목 예외를 확인했다. 2028학년도 수능은 2027년에 치르는 시험이다. 최신 고교학점제 보완조치와 대학별 과목 이수·학생부 평가 기준은 별도 확인이 필요하며 이번에 전수 검증하지 않았다.","sources":["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=97551&lev=0&m=020402&opType=N&s=moe&statusYN=W","https://www.korea.kr/news/policyFocusView.do?newsId=148958816&pkgId=49500831"],"pdf":[{"part":1,"number":12,"title":"2028 대입제도 개편과 고교학점제 현장안착","tag":"교육","page":8,"text":"핵심 팩트\n2025년 고1부터 적용된 개편안이 2026년 고2까지 확대되며 현장 혼란과 논쟁이 본격화 —  수능 선택과목 폐지(수학\n은 대수·미적분Ⅰ·확률과통계로 단일화, 탐구는 통합사회·통합과학), 내신은 9등급제→5등급제로 전환\n표준점수 유불리 해소라는 기대와, 미적분Ⅱ·기하 제외에 따른 이공계 기초학력 저하 우려가 공존\n고교학점제는 학생 선택권 확대와 진로 맞춤 교육이 목표지만, 학교 규모·지역에 따른 과목 개설 격차, 교원 수급과 시\n간표 운영 문제가 과제로 남음\n예상 질문 고교학점제가 교육격차를 키울 수 있는가?\n답변 방향 가능성이 있습니다. 공동교육과정과 온라인학교, 순회교사만으로 끝내지 말고 소규모 학교의 교원·시설\n을 우선 지원하며 대학도 과목 선택 기회의 차이를 평가에 반영해야 합니다.","target":"고교학점제 보완과 평가 공정성"}],"origin":"기존 자료","summary":"2028학년도 대입은 통합형 수능과 고교 내신 5등급 체제가 핵심이다. 2025년 고교 입학생의 제도 적용과 2027년에 치르는 2028학년도 수능을 구분해야 한다.","verifiedDate":"2026-10-19","id":"issue-007","order":6,"originalTitle":"고교학점제 보완과 평가 공정성","prep":{"point":"고교학점제의 취지는 학생이 진로에 맞게 배우도록 하는 데 있습니다.","reason":"그러나 학교마다 개설 과목과 교사 수가 다르면 선택권 자체가 불평등해질 수 있습니다. 그래서 공동교육과정, 온라인 수업, 지역 대학·기관 연계가 필요하며, 대입에서는 어려운 과목을 선택한 노력과 성취를 함께 보아야 합니다.","example":"적용 예시(제안): 공동교육과정의 이동·시간표 부담을 줄이고, 과목별 평가 기준을 학생에게 미리 안내하는 방안을 생각할 수 있습니다.","pointAgain":"제도 성공은 선택 과목 수만이 아니라 소규모 학교 학생의 이수 기회, 과목 쏠림 감소, 학생 만족도와 학업성취 회복률로 평가해야 합니다."},"originalNotes":"핵심 팩트\n2025년 고1부터 적용된 개편안이 2026년 고2까지 확대되며 현장 혼란과 논쟁이 본격화 —  수능 선택과목 폐지(수학\n은 대수·미적분Ⅰ·확률과통계로 단일화, 탐구는 통합사회·통합과학), 내신은 9등급제→5등급제로 전환\n표준점수 유불리 해소라는 기대와, 미적분Ⅱ·기하 제외에 따른 이공계 기초학력 저하 우려가 공존\n고교학점제는 학생 선택권 확대와 진로 맞춤 교육이 목표지만, 학교 규모·지역에 따른 과목 개설 격차, 교원 수급과 시\n간표 운영 문제가 과제로 남음\n예상 질문 고교학점제가 교육격차를 키울 수 있는가?\n답변 방향 가능성이 있습니다. 공동교육과정과 온라인학교, 순회교사만으로 끝내지 말고 소규모 학교의 교원·시설\n을 우선 지원하며 대학도 과목 선택 기회의 차이를 평가에 반영해야 합니다.","evidenceCheck":"2026-10-19 대표 사실 확인: 2028 대입 개편 확정안의 통합형 수능·내신 5등급·융합 선택과목 예외를 확인했다. 2028학년도 수능은 2027년에 치르는 시험이다. 최신 고교학점제 보완조치와 대학별 과목 이수·학생부 평가 기준은 별도 확인이 필요하며 이번에 전수 검증하지 않았다.","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"학교별 개설 과목 차이가 입시 기회 격차로 이어질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"저출생·인구감소와 구조개혁","keywords":"저출생 합계출산율 인구감소 출산지원 주거 돌봄 성평등 지역소멸","conflict":"출산지원 ↔ 개인의 선택·구조개혁","background":"출산율 반등 여부보다 왜 아이를 낳기 어려운 사회가 되었는지, 현금 지원과 구조개혁을 어떻게 결합할지가 핵심이다.","pro":["돌봄·주거·교육비 지원은 출산 포기의 구조적 원인을 낮춘다.","인구감소는 지역, 국방, 연금, 노동시장에 장기 영향을 준다.","일·가정 양립 정책은 성평등과 노동생산성에도 도움을 준다."],"con":["출산을 국가 목표로만 강조하면 개인의 선택을 압박할 수 있다.","현금 지원만으로 고용·주거 불안을 해결하기 어렵다.","지역 인프라가 사라지면 출산지원 효과도 제한된다."],"questions":["저출생을 개인의 선택 문제로 볼 수 없는 이유는 무엇인가?","출산지원금보다 중요한 구조개혁은 무엇인가?","청년 세대의 삶의 안정과 인구정책은 어떻게 연결되는가?"],"answer":"저출생은 개인이 아이를 원하지 않는다는 단순한 문제가 아니라 주거, 고용, 돌봄, 성평등이 모두 연결된 구조 문제입니다. 현금 지원은 단기 부담을 줄일 수 있지만, 안정된 일자리와 주거, 믿을 수 있는 돌봄이 없으면 지속 효과가 작습니다. 또한 출산을 애국심으로 압박하면 개인의 삶을 수단화할 위험이 있습니다. 저는 청년 주거 안정, 육아휴직의 실질적 사용, 남성 돌봄 참여, 지역 의료·교육 인프라를 함께 개선해야 한다고 봅니다. 성공 지표는 출산율뿐 아니라 청년 삶의 만족도와 경력단절 감소까지 포함해야 합니다.","check":"2025·2026 출생통계 확정치, 인구정책 예산, 지역별 차이","sources":["https://kostat.go.kr"],"pdf":[{"part":1,"number":9,"title":"저출생·초고령사회와 합계출산율 반등","tag":"인구·복지","page":7,"text":"핵심 팩트\n2026년 2분기 합계출산율 0.88명으로 전년 동기(0.77명) 대비 0.11명 상승, 상반기 출생아 수는 전년 대비 15.4%  증\n가 —  6월 혼인 건수도 전년 동월 대비 14%  늘며 2분기 연속 두 자릿수 증가율 기록\n30대 여성의 출산 증가와 혼인 증가, 정책적 지원 효과가 복합적으로 작용한 것으로 분석되나, 한국은 여전히 65세 이\n상 인구 비중 20% 를 넘는 초고령사회 단계\n출생아 수만이 아니라 주거·교육·돌봄·고용 불안이 복합적 원인이며, 연금·의료·돌봄·지역소멸·군 인력 문제로 파급\n예상 질문 현금지원이 저출생 해법이 될 수 있는가?\n답변 방향 필요하지만 충분하지 않습니다. 청년의 안정적 일자리와 주거, 성평등한 돌봄, 사교육비 완화, 경력단절\n방지처럼 아이를 낳아도 삶이 무너지지 않는 구조가 핵심입니다. 최근의 출산율 반등이 이런 구조 개선\n으로 이어질지 지켜볼 필요가 있습니다.","target":"저출생·인구감소와 구조개혁"}],"origin":"기존 자료","id":"issue-008","order":7,"originalTitle":"저출생·인구감소와 구조개혁","summary":"출산율 반등 여부보다 왜 아이를 낳기 어려운 사회가 되었는지, 현금 지원과 구조개혁을 어떻게 결합할지가 핵심이다.","prep":{"point":"저출생은 개인이 아이를 원하지 않는다는 단순한 문제가 아니라 주거, 고용, 돌봄, 성평등이 모두 연결된 구조 문제입니다.","reason":"현금 지원은 단기 부담을 줄일 수 있지만, 안정된 일자리와 주거, 믿을 수 있는 돌봄이 없으면 지속 효과가 작습니다. 또한 출산을 애국심으로 압박하면 개인의 삶을 수단화할 위험이 있습니다.","example":"적용 예시(제안): 신혼부부 지원만 확대하기보다 안정적 주거와 돌봄·근무시간을 함께 개선하는 지역 계획을 제안할 수 있습니다.","pointAgain":"성공 지표는 출산율뿐 아니라 청년 삶의 만족도와 경력단절 감소까지 포함해야 합니다."},"originalNotes":"핵심 팩트\n2026년 2분기 합계출산율 0.88명으로 전년 동기(0.77명) 대비 0.11명 상승, 상반기 출생아 수는 전년 대비 15.4%  증\n가 —  6월 혼인 건수도 전년 동월 대비 14%  늘며 2분기 연속 두 자릿수 증가율 기록\n30대 여성의 출산 증가와 혼인 증가, 정책적 지원 효과가 복합적으로 작용한 것으로 분석되나, 한국은 여전히 65세 이\n상 인구 비중 20% 를 넘는 초고령사회 단계\n출생아 수만이 아니라 주거·교육·돌봄·고용 불안이 복합적 원인이며, 연금·의료·돌봄·지역소멸·군 인력 문제로 파급\n예상 질문 현금지원이 저출생 해법이 될 수 있는가?\n답변 방향 필요하지만 충분하지 않습니다. 청년의 안정적 일자리와 주거, 성평등한 돌봄, 사교육비 완화, 경력단절\n방지처럼 아이를 낳아도 삶이 무너지지 않는 구조가 핵심입니다. 최근의 출산율 반등이 이런 구조 개선\n으로 이어질지 지켜볼 필요가 있습니다.","evidenceCheck":"2025·2026 출생통계 확정치, 인구정책 예산, 지역별 차이","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"출산을 국가 목표로만 강조하면 개인의 선택을 압박할 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"청년고용과 ‘쉬었음’ 증가","keywords":"청년고용 쉬었음 니트 첫 일자리 경력직 선호 노동시장 이중구조 AI 전환","conflict":"개인 책임 ↔ 노동시장 진입구조·AI 전환","background":"청년층 ‘쉬었음’ 증가는 취업 의지 부족으로만 설명하기 어렵다. 첫 일자리의 질, 경력직 선호, 자동화, 지역 격차가 함께 작동한다.","pro":["직업훈련과 구직 지원은 노동시장 진입 지연을 줄인다.","중소기업 근로조건 개선은 첫 일자리 선택지를 넓힌다.","AI 전환 교육은 미래 일자리 대응력을 높인다."],"con":["지원정책이 단기 프로그램에 그치면 실제 취업으로 이어지기 어렵다.","청년 문제를 개인 역량 부족으로만 보면 구조 개선이 늦어진다.","AI 교육도 지역·계층별 접근성 격차가 생길 수 있다."],"questions":["청년 ‘쉬었음’을 개인의 태도 문제로만 보면 왜 위험한가?","첫 일자리의 질이 왜 중요한가?","AI 시대 청년 고용정책은 어떤 역량을 길러야 하는가?"],"answer":"청년 ‘쉬었음’ 증가는 개인의 의지 부족만으로 설명할 수 없습니다. 기업은 경력직을 선호하고, 청년은 낮은 임금과 불안정한 일자리를 피하려 하며, AI 전환은 초급 일자리 구조를 바꿉니다. 따라서 정책은 이력서 특강보다 산업 현장 경험, 직무 교육, 지역 일자리 연결, 중소기업 근로조건 개선을 함께 다뤄야 합니다. 청년도 직무 탐색과 기초 역량을 갖추어야 하지만, 사회는 첫 실패가 장기 배제로 이어지지 않도록 재도전 경로를 만들어야 합니다. 성과는 취업률뿐 아니라 일자리 유지율과 임금 수준으로 봐야 합니다.","check":"통계청 고용동향 최신 월, 쉬었음 정의와 연령대, 청년고용대책","sources":["https://kostat.go.kr"],"pdf":[{"part":3,"number":6,"title":"청년고용과 AI 시대의 일자리 전환","tag":"노동·과학","page":12,"text":"AI가 업무 단위를 자동화하며 초급 사무직과 청년의 첫 일자리 진입에 영향을 줄 수 있어, 재교육과 고용안전망 보완이 논의된다.","target":"청년고용과 ‘쉬었음’ 증가"}],"origin":"기존 자료","id":"issue-009","order":8,"originalTitle":"청년고용과 ‘쉬었음’ 증가","summary":"청년층 ‘쉬었음’ 증가는 취업 의지 부족으로만 설명하기 어렵다.","prep":{"point":"청년 ‘쉬었음’ 증가는 개인의 의지 부족만으로 설명할 수 없습니다.","reason":"기업은 경력직을 선호하고, 청년은 낮은 임금과 불안정한 일자리를 피하려 하며, AI 전환은 초급 일자리 구조를 바꿉니다. 따라서 정책은 이력서 특강보다 산업 현장 경험, 직무 교육, 지역 일자리 연결, 중소기업 근로조건 개선을 함께 다뤄야 합니다.","example":"적용 예시(제안): 취업 공백 청년에게 획일적 교육을 배정하기보다 상담 후 직무 체험과 건강·생활 지원을 연결할 수 있습니다.","pointAgain":"성과는 취업률뿐 아니라 일자리 유지율과 임금 수준으로 봐야 합니다."},"originalNotes":"AI가 업무 단위를 자동화하며 초급 사무직과 청년의 첫 일자리 진입에 영향을 줄 수 있어, 재교육과 고용안전망 보완이 논의된다.","evidenceCheck":"통계청 고용동향 최신 월, 쉬었음 정의와 연령대, 청년고용대책","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"지원정책이 단기 프로그램에 그치면 실제 취업으로 이어지기 어렵다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"개정 노동조합법과 하청 노동권","keywords":"노동조합법 하청 노동자 원청 사용자 노란봉투법 손해배상 교섭권","conflict":"하청 노동권 ↔ 기업의 경영 예측가능성","background":"개정 노동조합법은 원청과 하청 노동자의 실질적 지배·교섭 관계, 파업 손해배상 제한 등 노동권과 경영권의 경계를 묻는다.","pro":["실질적으로 노동조건을 좌우하는 원청이 교섭에 책임져야 한다.","과도한 손해배상은 헌법상 노동3권을 위축시킬 수 있다.","하청 구조의 위험 전가를 줄인다."],"con":["사용자 범위가 넓어지면 기업의 법적 예측가능성이 낮아질 수 있다.","불법행위 책임 제한이 재산권 침해 논란을 낳을 수 있다.","교섭 상대가 복잡해져 노사관계 비용이 커질 수 있다."],"questions":["원청이 하청 노동자의 사용자로 인정될 수 있는 조건은 무엇인가?","노동3권과 기업 재산권이 충돌할 때 기준은 무엇인가?","노동시장 이중구조를 줄이기 위한 대안을 제시하라."],"answer":"하청 노동권 문제의 핵심은 형식상 사용자가 아니라 실제로 임금과 작업조건을 누가 결정하느냐입니다. 원청이 작업방식과 단가를 강하게 통제한다면 교섭 책임도 일정 부분 져야 합니다. 다만 사용자 범위를 너무 불명확하게 넓히면 기업은 어느 수준까지 책임져야 하는지 예측하기 어렵습니다. 따라서 법은 실질적 지배력, 계약 구조, 안전·임금 결정권 같은 판단 기준을 구체화해야 합니다. 동시에 파업 손해배상은 폭력이나 고의적 파괴는 책임을 묻되, 정당한 쟁의행위를 위축시키지 않는 방향이어야 합니다.","check":"개정 법률 시행일, 하위 규정, 헌법소원·판례 동향","sources":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285131&viewCls=lsRvsDocInfoR"],"pdf":[{"part":1,"number":10,"title":"노란봉투법 시행과 노동기본권","tag":"노동·법","page":7,"text":"핵심 팩트\n2026년 3월 10일 시행 —  파업 등 쟁의행위에 대한 사용자의 손해배상·가압류 청구를 제한하는 노동조합법 개정안\n사용자 범위 확대, 노동쟁의 판단 기준 변화를 두고 노사 양측의 실무 대응 전략이 엇갈리며, 노동자의 쟁의권 보호(노\n동계) vs 불법행위 정당화 우려(경영계) 대립이 시행 이후에도 지속\n실질적 결정권자와 교섭해야 한다는 주장과 경영 불확실성 우려가 충돌, 불법행위 면책과 정당한 쟁의 보호를 구분하\n는 세부 기준이 중요한 쟁점\n예상 질문 노란봉투법은 필요한가?\n답변 방향 실질적 사용자와의 교섭권 및 과도한 손배 제한은 필요합니다. 동시에 폭력·시설 파괴는 보호 대상이 아\n님을 명확히 하고 사용자성 판단 기준을 예측 가능하게 해야 합니다.","target":"개정 노동조합법과 하청 노동권"}],"origin":"기존 자료","id":"issue-010","order":9,"originalTitle":"개정 노동조합법과 하청 노동권","summary":"개정 노동조합법은 원청과 하청 노동자의 실질적 지배·교섭 관계, 파업 손해배상 제한 등 노동권과 경영권의 경계를 묻는다.","prep":{"point":"하청 노동권 문제의 핵심은 형식상 사용자가 아니라 실제로 임금과 작업조건을 누가 결정하느냐입니다.","reason":"원청이 작업방식과 단가를 강하게 통제한다면 교섭 책임도 일정 부분 져야 합니다. 다만 사용자 범위를 너무 불명확하게 넓히면 기업은 어느 수준까지 책임져야 하는지 예측하기 어렵습니다.","example":"적용 예시(제안): 하청 현장의 임금·안전 결정에 실제 영향을 미치는 주체와 교섭 책임을 사례별로 검토하는 절차를 제안할 수 있습니다.","pointAgain":"동시에 파업 손해배상은 폭력이나 고의적 파괴는 책임을 묻되, 정당한 쟁의행위를 위축시키지 않는 방향이어야 합니다."},"originalNotes":"핵심 팩트\n2026년 3월 10일 시행 —  파업 등 쟁의행위에 대한 사용자의 손해배상·가압류 청구를 제한하는 노동조합법 개정안\n사용자 범위 확대, 노동쟁의 판단 기준 변화를 두고 노사 양측의 실무 대응 전략이 엇갈리며, 노동자의 쟁의권 보호(노\n동계) vs 불법행위 정당화 우려(경영계) 대립이 시행 이후에도 지속\n실질적 결정권자와 교섭해야 한다는 주장과 경영 불확실성 우려가 충돌, 불법행위 면책과 정당한 쟁의 보호를 구분하\n는 세부 기준이 중요한 쟁점\n예상 질문 노란봉투법은 필요한가?\n답변 방향 실질적 사용자와의 교섭권 및 과도한 손배 제한은 필요합니다. 동시에 폭력·시설 파괴는 보호 대상이 아\n님을 명확히 하고 사용자성 판단 기준을 예측 가능하게 해야 합니다.","evidenceCheck":"개정 법률 시행일, 하위 규정, 헌법소원·판례 동향","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"사용자 범위가 넓어지면 기업의 법적 예측가능성이 낮아질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"AI·디지털","title":"소버린 AI와 AI 데이터센터","keywords":"소버린 AI 파운데이션 모델 데이터센터 전력 반도체 디지털 주권","conflict":"디지털 주권 ↔ 비용·에너지·개방성","background":"국가가 자체 AI 모델과 데이터 인프라를 갖춰야 하는지, 글로벌 AI 생태계와 어떻게 협력할지가 쟁점이다.","pro":["자국 언어·문화·공공데이터에 맞는 AI를 만들 수 있다.","해외 플랫폼 의존을 낮추고 안보 리스크를 줄인다.","데이터센터와 반도체 산업 경쟁력을 키울 수 있다."],"con":["대규모 투자와 전력 사용이 필요해 비용 부담이 크다.","닫힌 국가주의로 흐르면 기술 혁신과 국제 협력이 줄 수 있다.","데이터센터 입지 갈등과 환경 부담이 생긴다."],"questions":["소버린 AI가 필요한 이유와 한계는 무엇인가?","AI 데이터센터가 지역사회에 주는 이익과 부담은 무엇인가?","국가 AI와 민간 AI의 역할은 어떻게 나눠야 할까?"],"answer":"소버린 AI는 모든 기술을 국내에서만 만들자는 뜻이라기보다, 한국어와 공공서비스, 산업 보안에 필요한 핵심 역량을 확보하자는 의미로 봐야 합니다. 해외 플랫폼에만 의존하면 비용, 데이터 이전, 문화적 편향 문제가 생길 수 있습니다. 그러나 자체 모델 개발은 막대한 전력과 예산을 요구하므로 무조건 국산화보다 공공성이 큰 분야를 우선해야 합니다. 데이터센터는 지역 일자리와 세수를 만들 수 있지만 전력망과 냉각수, 환경 부담을 함께 논의해야 합니다. 성과는 모델 성능뿐 아니라 공공서비스 개선, 에너지 효율, 중소기업 활용도까지 봐야 합니다.","check":"독자 AI 파운데이션 모델 평가, 데이터센터 전력·입지 정책","sources":["https://www.msit.go.kr/eng/"],"pdf":[{"part":3,"number":12,"title":"데이터센터 전력·물 사용과 지역 갈등","tag":"과학·환경","page":12,"text":"AI 연산 증가로 대규모 전력·냉각용수 수요가 늘면서 지역 일자리 효과와 전기요금·환경 부담 사이 갈등이 발생하고 있다.","target":"소버린 AI와 AI 데이터센터"}],"origin":"기존 자료","id":"issue-011","order":10,"originalTitle":"소버린 AI와 AI 데이터센터","summary":"국가가 자체 AI 모델과 데이터 인프라를 갖춰야 하는지, 글로벌 AI 생태계와 어떻게 협력할지가 쟁점이다.","prep":{"point":"소버린 AI는 모든 기술을 국내에서만 만들자는 뜻이라기보다, 한국어와 공공서비스, 산업 보안에 필요한 핵심 역량을 확보하자는 의미로 봐야 합니다.","reason":"해외 플랫폼에만 의존하면 비용, 데이터 이전, 문화적 편향 문제가 생길 수 있습니다. 그러나 자체 모델 개발은 막대한 전력과 예산을 요구하므로 무조건 국산화보다 공공성이 큰 분야를 우선해야 합니다.","example":"적용 예시(제안): 공공 AI 사업에서 국산 여부와 별도로 보안·성능·전력·교체 가능성을 공개 평가하는 방안을 생각할 수 있습니다.","pointAgain":"성과는 모델 성능뿐 아니라 공공서비스 개선, 에너지 효율, 중소기업 활용도까지 봐야 합니다."},"originalNotes":"AI 연산 증가로 대규모 전력·냉각용수 수요가 늘면서 지역 일자리 효과와 전기요금·환경 부담 사이 갈등이 발생하고 있다.","evidenceCheck":"독자 AI 파운데이션 모델 평가, 데이터센터 전력·입지 정책","lens":["컴퓨터공학","정보보호","미디어","법학"],"lensQuestion":"기술의 성능과 함께 데이터·책임·이용자의 권리를 연결해 설명해 보세요.","followup":"대규모 투자와 전력 사용이 필요해 비용 부담이 크다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"원화 스테이블코인·예금토큰·CBDC","keywords":"스테이블코인 예금토큰 CBDC 프로젝트 한강 디지털자산 금융안정","conflict":"금융혁신 ↔ 금융안정·소비자보호","background":"디지털화폐 논의는 결제 편의성뿐 아니라 은행 예금 이탈, 통화주권, 개인정보, 불법자금 위험까지 포함한다.","pro":["결제 비용과 속도를 개선하고 핀테크 혁신을 촉진한다.","원화 기반 디지털자산은 해외 코인 의존을 낮출 수 있다.","예금토큰 실험은 안전한 디지털 결제 인프라를 만들 수 있다."],"con":["민간 스테이블코인이 커지면 은행 예금과 금융안정이 흔들릴 수 있다.","발행주체와 준비자산 규제가 약하면 소비자 피해가 생긴다.","거래 추적과 개인정보 보호의 균형이 어렵다."],"questions":["스테이블코인과 CBDC는 무엇이 다른가?","디지털화폐가 금융소외를 줄일까, 개인정보 침해를 키울까?","민간 발행과 공공 통제의 균형은 어떻게 잡아야 할까?"],"answer":"디지털화폐는 편리하지만 돈에 대한 신뢰를 다루기 때문에 실험적으로 접근해야 합니다. 스테이블코인은 빠른 결제와 새로운 서비스를 만들 수 있지만, 준비자산이 불투명하면 이용자가 손실을 볼 수 있고 은행 예금이 급격히 빠질 위험도 있습니다. CBDC와 예금토큰은 공공성과 안정성이 장점이지만 개인정보 침해 우려가 있습니다. 그래서 저는 발행주체 자격, 준비자산 공개, 이용자 보호, 자금세탁 방지 기준을 먼저 세우고 제한된 실험으로 확대해야 한다고 봅니다. 성공은 거래량보다 사고 발생률, 금융포용, 개인정보 보호 수준으로 평가해야 합니다.","check":"디지털자산기본법·스테이블코인 법안 처리, 한국은행 실험 결과","sources":["https://www.fsc.go.kr/po010106/86373"],"pdf":[{"part":3,"number":30,"title":"가상자산·스테이블코인 제도화","tag":"금융·과학","page":14,"text":"디지털자산이 결제·송금 혁신 가능성을 지니는 한편 가격·해킹 위험도 있어, 기능이 같은 위험에는 같은 규제를 적용해야 한다는 원\n칙이 제시된다.","target":"원화 스테이블코인·예금토큰·CBDC"}],"origin":"기존 자료","id":"issue-012","order":11,"originalTitle":"원화 스테이블코인·예금토큰·CBDC","summary":"디지털화폐 논의는 결제 편의성뿐 아니라 은행 예금 이탈, 통화주권, 개인정보, 불법자금 위험까지 포함한다.","prep":{"point":"디지털화폐는 편리하지만 돈에 대한 신뢰를 다루기 때문에 실험적으로 접근해야 합니다.","reason":"스테이블코인은 빠른 결제와 새로운 서비스를 만들 수 있지만, 준비자산이 불투명하면 이용자가 손실을 볼 수 있고 은행 예금이 급격히 빠질 위험도 있습니다. CBDC와 예금토큰은 공공성과 안정성이 장점이지만 개인정보 침해 우려가 있습니다.","example":"적용 예시(제안): 디지털 화폐 실험을 한다면 환급·보호 장치와 오프라인 접근성, 개인정보 처리 방식을 먼저 검토할 수 있습니다.","pointAgain":"성공은 거래량보다 사고 발생률, 금융포용, 개인정보 보호 수준으로 평가해야 합니다."},"originalNotes":"디지털자산이 결제·송금 혁신 가능성을 지니는 한편 가격·해킹 위험도 있어, 기능이 같은 위험에는 같은 규제를 적용해야 한다는 원\n칙이 제시된다.","evidenceCheck":"디지털자산기본법·스테이블코인 법안 처리, 한국은행 실험 결과","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"민간 스테이블코인이 커지면 은행 예금과 금융안정이 흔들릴 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"산불·폭염·집중호우와 국가 예방책임","keywords":"산불 폭염 집중호우 재난 기후적응 국가책임 예방 복구 취약계층","conflict":"개인 대비 ↔ 국가 예방책임·기후적응","background":"기후재난은 자연현상이지만 피해 규모는 예방 투자, 도시계획, 경보체계, 취약계층 보호에 따라 달라진다.","pro":["국가는 생명과 안전을 보호할 의무가 있으므로 예방 투자가 필요하다.","기후적응 인프라는 장기적으로 복구비를 줄인다.","취약계층 보호는 재난 불평등을 줄인다."],"con":["모든 재난 피해를 국가 책임으로만 돌리면 개인·지자체의 대비가 약해질 수 있다.","예방 예산은 단기 성과가 보이지 않아 우선순위 갈등이 생긴다.","위험지역 규제는 재산권과 지역경제 문제를 낳을 수 있다."],"questions":["재난 피해를 줄이기 위해 예방과 복구 중 무엇이 더 중요한가?","기후재난에서 취약계층이 더 큰 피해를 보는 이유는 무엇인가?","위험지역 개발 제한은 정당한가?"],"answer":"산불과 폭염, 집중호우는 자연재해이지만 피해를 키우거나 줄이는 것은 사회의 선택입니다. 위험지역 개발, 배수시설, 산림 관리, 경보 전달, 대피 지원이 부족하면 같은 비와 더위도 더 큰 참사가 됩니다. 저는 재난정책의 중심을 사후 복구에서 사전 예방으로 옮겨야 한다고 봅니다. 다만 개인과 지자체의 책임도 있으므로 중앙정부는 위험지도와 예산을 제공하고, 지자체는 현장 대피계획을 구체화해야 합니다. 성공 지표는 복구비 지출이 아니라 인명피해 감소, 대피 취약계층 지원률, 위험시설 개선률이어야 합니다.","check":"해당 연도 재난 통계, 폭염·산불 대책, 기후적응대책","sources":["https://www.korea.kr/news/policyNewsView.do?newsId=148960601"],"pdf":[{"part":1,"number":6,"title":"기후위기 —  2026년 한반도 폭염·폭우","tag":"환경·안전","page":5,"text":"핵심 팩트\n7월 말~8월 초 폭염이 절정을 이루며 8월 2일 경남 양산에서 42.5℃를 기록, 한국 기상관측 사상 최초로 42℃ 돌파\n—  온열질환자 4,036명, 온열사망자 34명 발생\n4월 9일 초기 폭우에 이어 5월 11일~9월 1일 정체전선에 의한 집중호우가 반복 발생, 7월 가장 심각한 강우 집중 —\n사망 4명·부상 3명·시설피해 453건, 누적 대피 1,122명\n기후위기는 재난 빈도뿐 아니라 농산물 가격, 노동생산성, 건강 격차를 확대하며 피해가 저소득층·옥외노동자에 집중\n되는 기후정의 문제로 이어짐\n감축정책과 함께 도시 그늘·냉방복지·산불·홍수 대비 같은 적응 투자의 중요성이 커짐\n예상 질문 탄소감축과 경제성장이 충돌할 때 무엇을 우선해야 하나?\n답변 방향 장기적으로 감축은 성장의 조건입니다. 다만 전환 비용이 취약계층과 특정 산업에 몰리지 않도록 재교\n육·에너지 지원·녹색산업 투자를 묶는 정의로운 전환이 필요합니다.","target":"산불·폭염·집중호우와 국가 예방책임"}],"origin":"기존 자료","id":"issue-013","order":12,"originalTitle":"산불·폭염·집중호우와 국가 예방책임","summary":"기후재난은 자연현상이지만 피해 규모는 예방 투자, 도시계획, 경보체계, 취약계층 보호에 따라 달라진다.","prep":{"point":"산불과 폭염, 집중호우는 자연재해이지만 피해를 키우거나 줄이는 것은 사회의 선택입니다.","reason":"위험지역 개발, 배수시설, 산림 관리, 경보 전달, 대피 지원이 부족하면 같은 비와 더위도 더 큰 참사가 됩니다. 저는 재난정책의 중심을 사후 복구에서 사전 예방으로 옮겨야 한다고 봅니다.","example":"적용 예시(제안): 침수 위험 지역에서 취약계층 대피 지원과 경보 전달, 시설 점검을 연계한 사전 훈련을 제안할 수 있습니다.","pointAgain":"성공 지표는 복구비 지출이 아니라 인명피해 감소, 대피 취약계층 지원률, 위험시설 개선률이어야 합니다."},"originalNotes":"핵심 팩트\n7월 말~8월 초 폭염이 절정을 이루며 8월 2일 경남 양산에서 42.5℃를 기록, 한국 기상관측 사상 최초로 42℃ 돌파\n—  온열질환자 4,036명, 온열사망자 34명 발생\n4월 9일 초기 폭우에 이어 5월 11일~9월 1일 정체전선에 의한 집중호우가 반복 발생, 7월 가장 심각한 강우 집중 —\n사망 4명·부상 3명·시설피해 453건, 누적 대피 1,122명\n기후위기는 재난 빈도뿐 아니라 농산물 가격, 노동생산성, 건강 격차를 확대하며 피해가 저소득층·옥외노동자에 집중\n되는 기후정의 문제로 이어짐\n감축정책과 함께 도시 그늘·냉방복지·산불·홍수 대비 같은 적응 투자의 중요성이 커짐\n예상 질문 탄소감축과 경제성장이 충돌할 때 무엇을 우선해야 하나?\n답변 방향 장기적으로 감축은 성장의 조건입니다. 다만 전환 비용이 취약계층과 특정 산업에 몰리지 않도록 재교\n육·에너지 지원·녹색산업 투자를 묶는 정의로운 전환이 필요합니다.","evidenceCheck":"해당 연도 재난 통계, 폭염·산불 대책, 기후적응대책","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"모든 재난 피해를 국가 책임으로만 돌리면 개인·지자체의 대비가 약해질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"사회·문화·미디어","title":"청소년 SNS 연령제한과 플랫폼 책임","keywords":"청소년 SNS 연령제한 플랫폼 책임 알고리즘 중독 개인정보 호주 16세","conflict":"청소년 보호 ↔ 표현·접근의 자유·프라이버시","background":"호주의 16세 미만 SNS 제한 사례는 청소년 정신건강, 알고리즘 책임, 연령 확인 과정의 개인정보 문제를 함께 묻는다.","pro":["중독적 설계와 유해 콘텐츠로부터 청소년을 보호할 수 있다.","플랫폼에 안전 설계 책임을 부과하는 계기가 된다.","부모와 학교만으로 해결하기 어려운 구조 문제를 다룬다."],"con":["연령 확인 과정에서 개인정보 수집이 늘 수 있다.","청소년의 표현·참여·정보 접근권이 제한될 수 있다.","우회 접속이 쉬우면 실효성이 낮다."],"questions":["청소년 SNS 제한은 보호인가, 과잉통제인가?","플랫폼 알고리즘에 어떤 책임을 물어야 하는가?","연령 확인과 개인정보 보호를 어떻게 양립할 수 있을까?"],"answer":"청소년 SNS 문제는 사용 시간을 개인이 조절하지 못해서만 생기는 문제가 아닙니다. 플랫폼은 오래 머물게 하는 알고리즘과 알림 설계를 통해 이용자의 행동을 유도합니다. 따라서 청소년 보호를 위해 일정한 연령 제한이나 추천 알고리즘 제한은 검토할 수 있습니다. 다만 전면 금지는 표현의 자유와 정보 접근권, 개인정보 수집 문제를 낳을 수 있습니다. 저는 연령 확인 정보를 최소화하고, 야간 알림 제한, 유해 콘텐츠 추천 금지, 기본 비공개 설정처럼 설계 책임을 강화하는 방식이 더 현실적이라고 봅니다.","check":"호주 시행 세부 기준, 국내 플랫폼 규제 논의, 청소년 정신건강 통계","sources":["https://www.esafety.gov.au/young-people/pressures-from-social-media"],"pdf":[],"origin":"기존 자료","id":"issue-014","order":13,"originalTitle":"청소년 SNS 연령제한과 플랫폼 책임","summary":"호주의 16세 미만 SNS 제한 사례는 청소년 정신건강, 알고리즘 책임, 연령 확인 과정의 개인정보 문제를 함께 묻는다.","prep":{"point":"청소년 SNS 문제는 사용 시간을 개인이 조절하지 못해서만 생기는 문제가 아닙니다.","reason":"플랫폼은 오래 머물게 하는 알고리즘과 알림 설계를 통해 이용자의 행동을 유도합니다. 따라서 청소년 보호를 위해 일정한 연령 제한이나 추천 알고리즘 제한은 검토할 수 있습니다.","example":"적용 예시(제안): 연령 확인만 도입하기보다 추천 설정·야간 알림·신고 대응을 함께 바꾸는 청소년 보호 방안을 제안할 수 있습니다.","pointAgain":"저는 연령 확인 정보를 최소화하고, 야간 알림 제한, 유해 콘텐츠 추천 금지, 기본 비공개 설정처럼 설계 책임을 강화하는 방식이 더 현실적이라고 봅니다."},"originalNotes":"","evidenceCheck":"호주 시행 세부 기준, 국내 플랫폼 규제 논의, 청소년 정신건강 통계","lens":["미디어커뮤니케이션","사회학","문화콘텐츠","교육학"],"lensQuestion":"정보 전달과 문화 참여가 사람들의 판단·접근성에 미치는 영향을 살펴보세요.","followup":"연령 확인 과정에서 개인정보 수집이 늘 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"사회·문화·미디어","title":"K-콘텐츠 수출·AI·IP","keywords":"K콘텐츠 수출 생성형 AI IP 저작권 플랫폼 창작자 보상","conflict":"문화산업 성장 ↔ 창작자 권리·플랫폼 의존","background":"K-콘텐츠는 단순한 문화 인기보다 IP 소유권, 글로벌 플랫폼 협상력, AI 학습권리, 창작노동 보상으로 확장되는 주제다.","pro":["콘텐츠 수출은 국가 이미지와 산업 경쟁력을 높인다.","AI 제작 도구는 번역·편집·시각효과 비용을 낮춘다.","IP 전략은 장기 수익과 파생 산업을 키운다."],"con":["플랫폼 의존이 커지면 창작자가 수익 배분에서 불리할 수 있다.","AI 학습과 자동 제작이 창작노동을 대체할 수 있다.","상업적 성공 위주로 다양성이 줄어들 수 있다."],"questions":["K-콘텐츠 성공을 수출액만으로 평가해도 될까?","AI가 창작산업에 주는 기회와 위험은 무엇인가?","창작자와 플랫폼의 수익 배분을 어떻게 개선할 수 있을까?"],"answer":"K-콘텐츠의 성장은 자랑스러운 일이지만, 수출액만 보면 산업 내부의 불균형을 놓칠 수 있습니다. 글로벌 플랫폼이 유통을 장악하면 제작사는 흥행해도 IP를 충분히 보유하지 못할 수 있고, 창작자는 불안정 노동에 놓일 수 있습니다. 생성형 AI는 번역과 제작비 절감에 도움이 되지만, 학습 데이터와 보상 기준이 없으면 창작자의 권리를 침해할 수 있습니다. 그래서 정부와 산업은 IP 보유율, 창작자 표준계약, AI 학습 보상, 중소 제작사 해외 진출 지원을 함께 봐야 합니다. 성공은 매출뿐 아니라 권리 배분의 공정성으로 평가해야 합니다.","check":"콘텐츠산업 매출·수출 확정 통계, AI 활용 실태, 표준계약 개선","sources":["https://welcon.kocca.kr/en/info/business/1957553"],"pdf":[{"part":2,"number":6,"title":"‘케이팝 데몬 헌터스’, 오스카·그래미 동시 석권","tag":"문화","page":10,"text":"3월 아카데미 장편 애니메이션상, 2월 그래미 영상 미디어 부문 최우수 노래상(‘Golden’)을 동시에 수상하며 K-컬처의 세계적 위\n상을 다시 입증했다.","target":"K-콘텐츠 수출·AI·IP"},{"part":3,"number":24,"title":"K-콘텐츠 성장과 창작자 권리","tag":"문화·산업","page":13,"text":"음악·영상·웹툰의 해외 성장과 함께 수익배분·불공정 계약, AI 학습데이터 저작권 문제가 새로운 쟁점으로 떠오르고 있다.","target":"K-콘텐츠 수출·AI·IP"}],"origin":"기존 자료","id":"issue-015","order":14,"originalTitle":"K-콘텐츠 수출·AI·IP","summary":"K-콘텐츠는 단순한 문화 인기보다 IP 소유권, 글로벌 플랫폼 협상력, AI 학습권리, 창작노동 보상으로 확장되는 주제다.","prep":{"point":"K-콘텐츠의 성장은 자랑스러운 일이지만, 수출액만 보면 산업 내부의 불균형을 놓칠 수 있습니다.","reason":"글로벌 플랫폼이 유통을 장악하면 제작사는 흥행해도 IP를 충분히 보유하지 못할 수 있고, 창작자는 불안정 노동에 놓일 수 있습니다. 생성형 AI는 번역과 제작비 절감에 도움이 되지만, 학습 데이터와 보상 기준이 없으면 창작자의 권리를 침해할 수 있습니다.","example":"적용 예시(제안): 창작자와 플랫폼 계약에서 권리 범위·AI 학습 활용·수익 정산을 구체적으로 설명하는 표준 항목을 제안할 수 있습니다.","pointAgain":"성공은 매출뿐 아니라 권리 배분의 공정성으로 평가해야 합니다."},"originalNotes":"3월 아카데미 장편 애니메이션상, 2월 그래미 영상 미디어 부문 최우수 노래상(‘Golden’)을 동시에 수상하며 K-컬처의 세계적 위\n상을 다시 입증했다.\n\n음악·영상·웹툰의 해외 성장과 함께 수익배분·불공정 계약, AI 학습데이터 저작권 문제가 새로운 쟁점으로 떠오르고 있다.","evidenceCheck":"콘텐츠산업 매출·수출 확정 통계, AI 활용 실태, 표준계약 개선","lens":["미디어커뮤니케이션","사회학","문화콘텐츠","교육학"],"lensQuestion":"정보 전달과 문화 참여가 사람들의 판단·접근성에 미치는 영향을 살펴보세요.","followup":"플랫폼 의존이 커지면 창작자가 수익 배분에서 불리할 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"수사·기소 분리와 형사사법 개편","keywords":"검찰개혁 공소청 중대범죄수사청 수사 기소 분리 권력분립","conflict":"권한 분산 ↔ 수사 효율·책임성","background":"수사와 기소를 나누는 검찰개혁은 권력기관 견제와 범죄 대응 효율 사이의 균형을 묻는 전형적인 법·정치 면접 주제다.","pro":["수사와 기소 권한 집중을 줄여 권력 남용을 방지할 수 있다.","기관 간 견제는 인권 보호에 도움이 된다.","검사의 기소 판단을 더 객관화할 수 있다."],"con":["기관이 나뉘면 책임 소재가 불분명해지고 수사가 지연될 수 있다.","중대범죄 대응 전문성이 약화될 수 있다.","정치적 개편으로 보이면 국민 신뢰가 낮아질 수 있다."],"questions":["수사권과 기소권을 분리해야 하는 이유는 무엇인가?","권한 분산과 수사 효율 중 무엇이 더 중요한가?","새 기관의 정치적 중립성을 보장하려면 무엇이 필요할까?"],"answer":"검찰개혁의 핵심은 특정 기관에 너무 큰 권한이 집중될 때 생기는 남용 위험을 줄이는 것입니다. 수사와 기소를 분리하면 서로 견제할 수 있고 피의자의 권리 보호에도 도움이 될 수 있습니다. 그러나 기관만 나누면 사건 처리 지연과 책임 회피가 생길 수 있습니다. 따라서 조직개편보다 중요한 것은 사건 이송 기준, 기록 공유, 지휘·감독 책임, 정치적 중립 장치입니다. 저는 권한 분산의 원칙에는 찬성하지만, 국민이 체감하는 기준은 이름이 바뀌었는지가 아니라 억울한 수사 감소와 중대범죄 대응 능력 유지라고 봅니다.","check":"조직개편 시행일, 하위 법령, 실제 사건 처리 절차","sources":["https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285131&viewCls=lsRvsDocInfoR"],"pdf":[{"part":2,"number":4,"title":"검찰청 폐지, 공소청·중대범죄수사청 출범","tag":"정치","page":10,"text":"1948년 설립된 검찰청이 78년 만에 폐지되고 2026년 10월 공소청(기소)과 중대범죄수사청(수사)으로 분리 출범할 예정이며, 수\n사 공백 우려와 권력 분산 필요성 간 찬반 논쟁이 이어지고 있다.","target":"검찰청 폐지·공소청·중대범죄수사청"}],"origin":"기존 자료","id":"issue-016","order":15,"originalTitle":"검찰청 폐지·공소청·중대범죄수사청","summary":"수사와 기소를 나누는 검찰개혁은 권력기관 견제와 범죄 대응 효율 사이의 균형을 묻는 전형적인 법·정치 면접 주제다.","prep":{"point":"검찰개혁의 핵심은 특정 기관에 너무 큰 권한이 집중될 때 생기는 남용 위험을 줄이는 것입니다.","reason":"수사와 기소를 분리하면 서로 견제할 수 있고 피의자의 권리 보호에도 도움이 될 수 있습니다. 그러나 기관만 나누면 사건 처리 지연과 책임 회피가 생길 수 있습니다.","example":"적용 예시(제안): 권한을 분리하는 제도를 설계한다면 기관 간 사건 이첩과 책임 소재, 피해자 안내 절차도 함께 정할 수 있습니다.","pointAgain":"저는 권한 분산의 원칙에는 찬성하지만, 국민이 체감하는 기준은 이름이 바뀌었는지가 아니라 억울한 수사 감소와 중대범죄 대응 능력 유지라고 봅니다."},"originalNotes":"1948년 설립된 검찰청이 78년 만에 폐지되고 2026년 10월 공소청(기소)과 중대범죄수사청(수사)으로 분리 출범할 예정이며, 수\n사 공백 우려와 권력 분산 필요성 간 찬반 논쟁이 이어지고 있다.","evidenceCheck":"조직개편 시행일, 하위 법령, 실제 사건 처리 절차","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"기관이 나뉘면 책임 소재가 불분명해지고 수사가 지연될 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"헌법 개정과 권력구조","keywords":"개헌 권력구조 기본권 지방분권 대통령제 국민투표 2027","conflict":"정치개혁 필요 ↔ 사회적 합의·정치적 이용 우려","background":"개헌은 권력구조, 기본권, 지방분권, 선거제도 등 다양한 쟁점을 포함하지만 정치적 이해관계와 국민적 합의가 핵심 변수다.","pro":["1987년 체제가 반영하지 못한 디지털 기본권, 기후권, 지방분권을 논의할 수 있다.","권력구조 개편으로 대통령에게 집중된 권한을 조정할 수 있다.","사회 변화에 맞게 헌법 가치를 갱신할 수 있다."],"con":["정치권 이해관계에 따라 개헌이 정략화될 수 있다.","국민적 합의 없이 추진하면 사회 갈등이 커진다.","권력구조 논쟁이 민생 의제를 밀어낼 수 있다."],"questions":["현행 헌법을 바꿔야 한다면 가장 중요한 의제는 무엇인가?","개헌을 선거 일정과 함께 추진할 때 장단점은 무엇인가?","청소년과 미래세대의 권리는 헌법에 어떻게 반영될 수 있을까?"],"answer":"개헌은 단순히 대통령 임기를 바꾸는 문제가 아니라 우리 사회의 기본 규칙을 다시 정하는 일입니다. 디지털 기본권, 기후위기, 지방분권처럼 1987년 헌법이 충분히 담지 못한 의제는 논의할 필요가 있습니다. 그러나 개헌이 특정 정치세력의 유불리로 보이면 국민적 신뢰를 얻기 어렵습니다. 저는 권력구조 논의와 기본권 논의를 분리해 공개 숙의하고, 청년·지역·전문가 참여를 넓혀야 한다고 봅니다. 성공 조건은 빠른 추진이 아니라 국민이 내용을 이해하고 동의할 수 있는 절차적 정당성입니다.","check":"국회 개헌특위 구성, 합의 의제, 국민투표 일정","sources":["https://www.yna.co.kr/view/AKR20260508141300001"],"pdf":[],"origin":"기존 자료","id":"issue-017","order":16,"originalTitle":"2027 개헌 논의","summary":"개헌은 권력구조, 기본권, 지방분권, 선거제도 등 다양한 쟁점을 포함하지만 정치적 이해관계와 국민적 합의가 핵심 변수다.","prep":{"point":"개헌은 단순히 대통령 임기를 바꾸는 문제가 아니라 우리 사회의 기본 규칙을 다시 정하는 일입니다.","reason":"디지털 기본권, 기후위기, 지방분권처럼 1987년 헌법이 충분히 담지 못한 의제는 논의할 필요가 있습니다. 그러나 개헌이 특정 정치세력의 유불리로 보이면 국민적 신뢰를 얻기 어렵습니다.","example":"적용 예시(제안): 권력구조 개편안을 비교할 때 견제 장치와 교착 해소 절차가 함께 있는지 살피는 기준표를 만들 수 있습니다.","pointAgain":"성공 조건은 빠른 추진이 아니라 국민이 내용을 이해하고 동의할 수 있는 절차적 정당성입니다."},"originalNotes":"","evidenceCheck":"국회 개헌특위 구성, 합의 의제, 국민투표 일정","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"정치권 이해관계에 따라 개헌이 정략화될 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"우크라이나 전쟁과 정의로운 평화","keywords":"우크라이나 전쟁 영토보전 휴전 평화 식량안보 국제법","conflict":"정의로운 평화 ↔ 빠른 휴전·민간인 보호","background":"우크라이나 전쟁은 영토 보전과 침략 금지 원칙, 휴전의 현실성, 민간인 피해, 식량·에너지 안보를 함께 묻는다.","pro":["침략을 인정하지 않는 원칙은 국제질서를 지키는 데 필요하다.","피해국의 주권과 영토보전을 존중해야 한다.","장기적으로 불법 침략의 보상을 막아야 한다."],"con":["전쟁 장기화는 민간인 피해와 난민, 식량 위기를 키운다.","빠른 휴전이 생명을 구할 수 있다는 현실론도 있다.","군사지원이 확전 위험을 높일 수 있다."],"questions":["정의로운 평화와 빠른 휴전이 충돌할 때 무엇을 우선해야 하는가?","국제사회는 침략국에 어떤 책임을 물어야 하는가?","전쟁이 한국 청소년의 삶과 연결되는 지점을 말해 보라."],"answer":"우크라이나 전쟁에서 빠른 휴전은 민간인 생명을 구할 수 있다는 점에서 중요합니다. 그러나 침략으로 얻은 이익을 그대로 인정하면 국제사회는 힘으로 국경을 바꿔도 된다는 신호를 줄 수 있습니다. 그래서 저는 정의로운 평화와 인도주의적 휴전이 함께 논의되어야 한다고 봅니다. 즉 민간인 보호와 포로 교환, 곡물 수출 안전을 즉시 확보하되, 최종 평화안은 우크라이나의 주권과 국제법 원칙을 존중해야 합니다. 한국도 에너지 가격, 식량안보, 국제규범이라는 측면에서 이 문제와 연결되어 있습니다.","check":"휴전 협상 상태, 민간인 피해 통계, 곡물·에너지 영향","sources":["https://www.reuters.com/world/pope-leo-renews-call-ukraine-war-end-2026-08-09/"],"pdf":[{"part":1,"number":8,"title":"러시아-우크라이나 전쟁 장기화와 북러 밀착","tag":"안보·국제","page":6,"text":"핵심 팩트\n2026년 5월 트럼프 미국 대통령 중재로 3일간 잠정 휴전에 합의했으나, 6월 양해각서 체결에도 7월 전투가 재개되며\n장기화\n전쟁 장기화가 식량·에너지·방산 공급망과 유럽 안보질서를 흔들고 있으며, 종전·휴전 논의에서도 영토·안전보장·책임\n문제가 계속 충돌\n북한의 대러 군사협력 강화는 한반도 안보와 국제 제재체계에 직접 영향을 미치는 변수로 주목\n장기화된 전쟁의 향방이 국제 안보·에너지 시장에 미치는 영향에 관심이 집중\n예상 질문 평화를 위해 현실적 타협이 필요한가?\n답변 방향 협상은 필요하지만 무력에 의한 영토 변경을 당연시하면 국제규범이 약화됩니다. 민간인 보호와 휴전을\n추진하면서 당사국의 주권, 지속 가능한 안전보장을 함께 다뤄야 합니다.","target":"우크라이나 전쟁과 정의로운 평화"}],"origin":"기존 자료","id":"issue-018","order":17,"originalTitle":"우크라이나 전쟁과 정의로운 평화","summary":"우크라이나 전쟁은 영토 보전과 침략 금지 원칙, 휴전의 현실성, 민간인 피해, 식량·에너지 안보를 함께 묻는다.","prep":{"point":"우크라이나 전쟁에서 빠른 휴전은 민간인 생명을 구할 수 있다는 점에서 중요합니다.","reason":"그러나 침략으로 얻은 이익을 그대로 인정하면 국제사회는 힘으로 국경을 바꿔도 된다는 신호를 줄 수 있습니다. 그래서 저는 정의로운 평화와 인도주의적 휴전이 함께 논의되어야 한다고 봅니다.","example":"적용 예시(제안): 휴전안을 평가할 때 무력 중단뿐 아니라 민간인 보호·재건·안전 보장의 지속 가능성을 함께 검토할 수 있습니다.","pointAgain":"한국도 에너지 가격, 식량안보, 국제규범이라는 측면에서 이 문제와 연결되어 있습니다."},"originalNotes":"핵심 팩트\n2026년 5월 트럼프 미국 대통령 중재로 3일간 잠정 휴전에 합의했으나, 6월 양해각서 체결에도 7월 전투가 재개되며\n장기화\n전쟁 장기화가 식량·에너지·방산 공급망과 유럽 안보질서를 흔들고 있으며, 종전·휴전 논의에서도 영토·안전보장·책임\n문제가 계속 충돌\n북한의 대러 군사협력 강화는 한반도 안보와 국제 제재체계에 직접 영향을 미치는 변수로 주목\n장기화된 전쟁의 향방이 국제 안보·에너지 시장에 미치는 영향에 관심이 집중\n예상 질문 평화를 위해 현실적 타협이 필요한가?\n답변 방향 협상은 필요하지만 무력에 의한 영토 변경을 당연시하면 국제규범이 약화됩니다. 민간인 보호와 휴전을\n추진하면서 당사국의 주권, 지속 가능한 안전보장을 함께 다뤄야 합니다.","evidenceCheck":"휴전 협상 상태, 민간인 피해 통계, 곡물·에너지 영향","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"전쟁 장기화는 민간인 피해와 난민, 식량 위기를 키운다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"법·정치·국제","title":"가자 인도주의 위기와 국제인도법","keywords":"가자 인도주의 위기 국제인도법 자위권 비례성 구별원칙 민간인 보호","conflict":"자위권 ↔ 비례성·구별원칙·인도지원","background":"가자 문제는 특정 편을 암기하는 것이 아니라 민간인 보호, 자위권, 비례성, 인도지원 접근이라는 국제인도법의 기준을 적용하는 주제다.","pro":["국가는 공격으로부터 국민을 보호할 자위권이 있다.","무장단체의 민간인 방패 사용도 국제법 위반이다.","안보 위협을 무시한 평화는 지속되기 어렵다."],"con":["자위권도 민간인 구별과 비례성 원칙을 넘어설 수 없다.","봉쇄와 의료·식량 부족은 집단적 처벌 논란을 낳는다.","민간인 피해가 커지면 장기 평화가 더 어려워진다."],"questions":["자위권은 어디까지 인정되어야 하는가?","국제인도법의 구별원칙과 비례성 원칙을 설명해 보라.","인도주의 위기에서 국제사회가 할 수 있는 역할은 무엇인가?"],"answer":"가자 인도주의 위기는 어느 한쪽의 주장만 반복해서는 설명하기 어렵습니다. 국가는 국민을 보호할 자위권이 있지만, 전쟁 중에도 민간인과 전투원을 구별하고 피해가 과도하지 않도록 해야 합니다. 병원, 식량, 물, 피난민 보호는 정치적 입장과 별개로 보장되어야 합니다. 저는 즉각적인 인도지원 통로 확보, 인질과 민간인 보호, 국제 감시, 장기적인 정치 협상이 함께 필요하다고 봅니다. 면접에서는 감정적 편들기보다 국제법 원칙을 기준으로 민간인 피해를 줄이는 현실적 대안을 제시하는 것이 중요합니다.","check":"휴전·인도지원 상황, 국제기구 피해 집계, 협상 진행","sources":["https://www.un.org/unispal/"],"pdf":[],"origin":"기존 자료","id":"issue-019","order":18,"originalTitle":"가자 인도주의 위기와 국제인도법","summary":"가자 문제는 특정 편을 암기하는 것이 아니라 민간인 보호, 자위권, 비례성, 인도지원 접근이라는 국제인도법의 기준을 적용하는 주제다.","prep":{"point":"가자 인도주의 위기는 어느 한쪽의 주장만 반복해서는 설명하기 어렵습니다.","reason":"국가는 국민을 보호할 자위권이 있지만, 전쟁 중에도 민간인과 전투원을 구별하고 피해가 과도하지 않도록 해야 합니다. 병원, 식량, 물, 피난민 보호는 정치적 입장과 별개로 보장되어야 합니다.","example":"적용 예시(제안): 구호 통로를 논의한다면 민간인 접근성·안전·지원의 중립성을 독립적으로 점검하는 방안을 제안할 수 있습니다.","pointAgain":"면접에서는 감정적 편들기보다 국제법 원칙을 기준으로 민간인 피해를 줄이는 현실적 대안을 제시하는 것이 중요합니다."},"originalNotes":"","evidenceCheck":"휴전·인도지원 상황, 국제기구 피해 집계, 협상 진행","lens":["법학","정치외교","행정학","국제학"],"lensQuestion":"권리·책임·절차와 여러 이해관계자의 입장을 함께 검토해 보세요.","followup":"자위권도 민간인 구별과 비례성 원칙을 넘어설 수 없다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"AI·디지털 교육자료와 교육 데이터 보호","keywords":"AI 디지털교과서 교육데이터 맞춤형 학습 개인정보 학습격차 에듀테크","conflict":"맞춤형 학습 ↔ 개인정보·디지털 격차","background":"교육부의 2025년 12월 29일 안내는 옛 AI 디지털교과서를 ‘AI·디지털 교육자료’로 명시한다. 2025년 8월 14일 개정된 초·중등교육법 제29조의2에 따라 학교장이 학습지원 소프트웨어를 교육자료로 선정할 때에는 교육부 기준을 준수하고 학교운영위원회 심의를 거쳐야 한다. 필수기준에는 개인정보 최소처리·안전조치, 열람·정정·삭제·처리정지 절차, 만 14세 미만 아동 보호 등이 포함된다. 면접에서는 전국 일괄 교과서 도입을 전제로 하기보다 학교의 선택, 교육 효과와 데이터 보호를 함께 논의해야 한다.","pro":["학생 수준에 맞춘 피드백으로 학습 결손을 줄일 수 있다.","교사는 학습 데이터를 바탕으로 더 정밀하게 지도할 수 있다.","농어촌·소규모 학교의 과목·자료 접근성을 높일 수 있다."],"con":["학생의 민감한 학습 데이터가 과도하게 수집될 수 있다.","기기·네트워크·가정환경 차이가 학습 격차로 이어질 수 있다.","AI 추천에 의존하면 교사의 전문적 판단이 약해질 수 있다."],"questions":["AI 디지털교과서가 학습격차를 줄일까, 키울까?","학생 학습데이터는 누가 어디까지 활용할 수 있어야 할까?","교사의 역할은 AI 도입 이후 어떻게 달라져야 하는가?"],"answer":"저는 AI·디지털 교육자료의 사용 여부를 학습 효과와 권리 보호를 함께 살펴 결정해야 한다고 봅니다. 교사의 조정 권한, 접근성, 개인정보 처리, 실제 수업 효과를 확인하고 학교의 적법한 선정 절차를 거쳐야 합니다. 가령 시범 수업에서 학생의 학습 변화와 교사의 준비 부담을 함께 점검하는 방안을 제안할 수 있습니다. 기술의 도입 자체보다 모든 학생에게 유익하고 책임 있게 쓰이는지가 판단 기준입니다.","check":"2026-10-19 대표 사실 확인: 교육자료 지위·선정기준·학교운영위원회 심의 절차를 확인했다. ‘AI 디지털교과서’는 종전 명칭임을 밝혀 사용한다. 학교별 실제 채택 여부, 적용 과목·업체·이용률과 학습 효과는 이번에 확인하지 않았으므로 일반화하지 않는다.","sources":["https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105007&lev=0&m=020402"],"pdf":[{"part":3,"number":4,"title":"AI 디지털교육과 기초학력","tag":"교육·과학","page":12,"text":"AI 코스웨어가 개인별 맞춤학습을 지원할 수 있지만, 화면 의존과 디지털 격차, 교사 역할 약화에 대한 우려도 함께 제기된다.","target":"AI 디지털교과서와 교육 데이터 보호"}],"origin":"기존 자료","summary":"옛 AI 디지털교과서는 현재 AI·디지털 교육자료라는 지위와 명칭으로 다뤄진다. 맞춤형 학습 효과와 함께 학교의 선정 절차, 학생 데이터 최소 수집과 보호가 쟁점이다.","verifiedDate":"2026-10-19","id":"issue-020","order":19,"originalTitle":"AI 디지털교과서와 교육 데이터 보호","prep":{"point":"학습 효과와 권리 보호를 함께 살펴 AI·디지털 교육자료의 사용을 결정해야 합니다.","reason":"법적 지위, 학교의 선정 절차, 데이터 처리와 교사의 조정 권한을 함께 확인해야 합니다.","example":"적용 예시(제안): 시범 수업의 학습 변화·접근성·교사의 준비 부담을 함께 점검할 수 있습니다.","pointAgain":"도입 자체보다 모든 학생에게 유익하고 책임 있게 쓰이는지를 판단 기준으로 삼겠습니다."},"originalNotes":"AI 코스웨어가 개인별 맞춤학습을 지원할 수 있지만, 화면 의존과 디지털 격차, 교사 역할 약화에 대한 우려도 함께 제기된다.","evidenceCheck":"2026-10-19 대표 사실 확인: 교육자료 지위·선정기준·학교운영위원회 심의 절차를 확인했다. ‘AI 디지털교과서’는 종전 명칭임을 밝혀 사용한다. 학교별 실제 채택 여부, 적용 과목·업체·이용률과 학습 효과는 이번에 확인하지 않았으므로 일반화하지 않는다.","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"학생의 민감한 학습 데이터가 과도하게 수집될 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"간병비 부담과 간호·간병통합서비스","keywords":"간병비 간호간병통합서비스 건강보험 가족돌봄 노인돌봄 의료비","conflict":"보편적 돌봄 ↔ 재정 부담·인력 부족","background":"고령화로 병원 간병비가 가족의 경제 부담이 되면서, 간병을 개인 책임으로 둘 것인지 공적 돌봄 체계로 넓힐 것인지가 중요해졌다.","pro":["간병비 부담을 낮추면 의료 접근성과 가족의 삶의 질이 개선된다.","전문 인력이 돌봄을 맡으면 안전과 감염관리 수준이 높아질 수 있다.","가족돌봄으로 인한 경력단절과 소득 손실을 줄인다."],"con":["건강보험 재정 부담과 보험료 인상 논란이 생길 수 있다.","간호·간병 인력이 부족하면 서비스 질이 떨어질 수 있다.","병원 중심 돌봄만 확대하면 지역·재가 돌봄이 약해질 수 있다."],"questions":["간병비를 개인 부담으로 두는 것이 공정한가?","공적 간병 확대에서 가장 먼저 해결할 문제는 무엇인가?","의료와 복지를 분리해서 볼 수 없는 이유는 무엇인가?"],"answer":"간병은 가족의 사랑만으로 해결할 수 없는 사회적 돌봄 문제가 되었습니다. 고령화가 빨라지면서 장기 입원과 간병비는 가계 파산이나 경력단절로 이어질 수 있습니다. 저는 간호·간병통합서비스를 확대하되 모든 비용을 한 번에 건강보험으로 떠넘기기보다 중증도와 소득 수준에 따라 우선순위를 정해야 한다고 봅니다. 동시에 병원 인력 확충, 처우 개선, 지역 방문돌봄과의 연계가 필요합니다. 성과는 간병비 감소액뿐 아니라 가족돌봄 시간 감소, 환자 안전, 간호 인력 이탈률까지 함께 봐야 합니다.","check":"건강보험 적용 범위, 간호·간병 인력 수급, 시범사업 성과","sources":["https://www.mohw.go.kr"],"pdf":[{"part":3,"number":40,"title":"돌봄인력 부족과 간병비 부담","tag":"복지·노동","page":15,"text":"고령화로 요양·간병 수요는 느는데 저임금·고강도 구조로 인력이 부족해, 통합돌봄과 종사자 처우 개선이 함께 요구된다.","target":"간병비 부담과 간호·간병통합서비스"}],"origin":"기존 자료","id":"issue-021","order":20,"originalTitle":"간병비 부담과 간호·간병통합서비스","summary":"고령화로 병원 간병비가 가족의 경제 부담이 되면서, 간병을 개인 책임으로 둘 것인지 공적 돌봄 체계로 넓힐 것인지가 중요해졌다.","prep":{"point":"간병은 가족의 사랑만으로 해결할 수 없는 사회적 돌봄 문제가 되었습니다.","reason":"고령화가 빨라지면서 장기 입원과 간병비는 가계 파산이나 경력단절로 이어질 수 있습니다. 저는 간호·간병통합서비스를 확대하되 모든 비용을 한 번에 건강보험으로 떠넘기기보다 중증도와 소득 수준에 따라 우선순위를 정해야 한다고 봅니다.","example":"적용 예시(제안): 간병 지원을 확대한다면 환자 부담 감소와 함께 간호 인력 배치·야간 업무·지속 가능한 재원을 검토할 수 있습니다.","pointAgain":"성과는 간병비 감소액뿐 아니라 가족돌봄 시간 감소, 환자 안전, 간호 인력 이탈률까지 함께 봐야 합니다."},"originalNotes":"고령화로 요양·간병 수요는 느는데 저임금·고강도 구조로 인력이 부족해, 통합돌봄과 종사자 처우 개선이 함께 요구된다.","evidenceCheck":"건강보험 적용 범위, 간호·간병 인력 수급, 시범사업 성과","lens":["교육학","의학·간호","보건정책","사회복지"],"lensQuestion":"현장의 이용자·전문가·지원 체계가 각각 어떤 역할을 맡을지 생각해 보세요.","followup":"건강보험 재정 부담과 보험료 인상 논란이 생길 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"전 분야 마이데이터와 개인정보 전송요구권","keywords":"마이데이터 개인정보 전송요구권 데이터 이동권 개인정보보호 플랫폼","conflict":"데이터 활용 편익 ↔ 개인정보 자기결정권·보안","background":"마이데이터는 개인이 자신의 정보를 다른 서비스로 옮겨 더 나은 서비스를 받을 수 있게 하지만, 데이터 유출과 과도한 프로파일링 위험도 커진다.","pro":["개인이 자기 데이터를 통제하고 더 편리한 서비스를 선택할 수 있다.","금융을 넘어 교육·고용·의료 분야 혁신을 촉진한다.","플랫폼 독점 완화와 경쟁 촉진 효과가 있다."],"con":["전송 과정에서 민감정보 유출 위험이 커질 수 있다.","이용자가 동의 내용을 충분히 이해하지 못할 수 있다.","기업이 데이터를 결합해 차별적 가격·서비스를 제공할 수 있다."],"questions":["개인정보 전송요구권은 왜 필요한가?","마이데이터가 소비자에게 이익만 주는 것은 아닌 이유는 무엇인가?","동의 제도의 한계를 보완할 방법을 제안하라."],"answer":"마이데이터는 개인정보를 기업이 보관하는 대상에서 개인이 활용할 수 있는 권리로 바꾸는 제도입니다. 개인은 금융, 교육, 고용 정보를 옮겨 맞춤형 서비스를 받을 수 있지만, 정보가 많아질수록 유출과 차별 위험도 커집니다. 그래서 저는 전송요구권을 확대하되 전송 범위 최소화, 쉬운 동의 철회, 수신기관 심사, 사고 책임 강화가 필요하다고 봅니다. 특히 청소년·고령자처럼 동의 내용을 이해하기 어려운 이용자에게는 더 강한 설명 의무가 있어야 합니다. 성공은 서비스 수보다 정보 유출 감소와 이용자 통제권 강화로 평가해야 합니다.","check":"개인정보 전송요구권 적용 분야, 전문기관 지정 기준, 교육·고용 분야 확대 일정","sources":["https://pipc.go.kr/np/cop/bbs/selectBoardList.do?bbsId=BS217&etc1=%ED%98%84%EC%9E%AC+%EC%95%88%EB%82%B4%EC%84%9C&mCode=G010030020"],"pdf":[],"origin":"기존 자료","id":"issue-022","order":21,"originalTitle":"전 분야 마이데이터와 개인정보 전송요구권","summary":"마이데이터는 개인이 자신의 정보를 다른 서비스로 옮겨 더 나은 서비스를 받을 수 있게 하지만, 데이터 유출과 과도한 프로파일링 위험도 커진다.","prep":{"point":"마이데이터는 개인정보를 기업이 보관하는 대상에서 개인이 활용할 수 있는 권리로 바꾸는 제도입니다.","reason":"개인은 금융, 교육, 고용 정보를 옮겨 맞춤형 서비스를 받을 수 있지만, 정보가 많아질수록 유출과 차별 위험도 커집니다. 그래서 저는 전송요구권을 확대하되 전송 범위 최소화, 쉬운 동의 철회, 수신기관 심사, 사고 책임 강화가 필요하다고 봅니다.","example":"적용 예시(제안): 데이터 전송 동의 화면에서 수신자·목적·보관 기간을 따로 보여 주고 철회 절차를 쉽게 만드는 방안을 제안할 수 있습니다.","pointAgain":"성공은 서비스 수보다 정보 유출 감소와 이용자 통제권 강화로 평가해야 합니다."},"originalNotes":"","evidenceCheck":"개인정보 전송요구권 적용 분야, 전문기관 지정 기준, 교육·고용 분야 확대 일정","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"전송 과정에서 민감정보 유출 위험이 커질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"경제·노동·금융","title":"EU 탄소국경조정제도와 수출기업","keywords":"CBAM 탄소국경조정제도 EU 수출 중소기업 탄소배출 제조업","conflict":"기후무역 규범 ↔ 중소기업 비용 부담","background":"EU 집행위원회는 CBAM 본기간이 2026년 1월 1일부터 적용된다고 안내한다. 대상은 철강·알루미늄·시멘트·비료·전력·수소 분야의 특정 품목이며, EU 수입자 또는 간접 관세대리인이 신고·인증서 의무를 부담한다. 한국 수출기업은 관련 제품의 내재배출량 데이터를 제공할 준비가 필요하다. 2026년 수입분의 첫 연간 CBAM 신고와 인증서 제출 기한은 2027년 9월 30일이다. 면접에서는 전환기간이 계속되는 것으로 설명하지 말고 실제 배출량 관리와 중소기업 대응 비용을 함께 다뤄야 한다.","pro":["탄소배출을 줄인 기업이 국제시장에서 정당하게 평가받는다.","국내 산업의 저탄소 전환을 앞당긴다.","기후목표를 무역 규범과 연결해 실효성을 높인다."],"con":["중소기업은 배출량 산정과 인증 비용을 감당하기 어렵다.","선진국 중심의 무역장벽으로 작동할 수 있다.","소비자 가격 상승과 수출 경쟁력 약화가 생길 수 있다."],"questions":["CBAM은 환경정책인가, 무역장벽인가?","중소기업이 탄소 규제에 대응하려면 어떤 지원이 필요한가?","기후정책과 산업경쟁력은 어떻게 양립할 수 있을까?"],"answer":"CBAM은 기후위기 대응이라는 명분이 있지만 기업에게는 새로운 무역 규범입니다. 탄소를 많이 배출한 제품에 비용을 부과하면 저탄소 생산을 촉진할 수 있습니다. 그러나 중소기업은 배출량 계산, 인증, 설비 투자 비용을 감당하기 어렵기 때문에 준비 없이 시행되면 수출 경쟁력이 약해질 수 있습니다. 저는 정부가 업종별 배출량 산정 도구, 컨설팅, 설비 전환 금융을 제공하고 대기업은 협력사의 탄소관리까지 지원해야 한다고 봅니다. 성공은 규제 회피가 아니라 배출 감축과 수출 유지가 동시에 되는지로 판단해야 합니다.","check":"2026-10-19 대표 사실 확인: 본기간 개시일, 6개 대상 분야와 첫 연간 신고·인증서 제출 기한을 확인했다. 개별 품목의 CN코드, 50톤 면제기준의 적용·예외, 탄소가격 공제와 인증서 산정은 기업·거래별 최신 법령 확인이 필요하다. 2023년 원규정에 있는 과거 제출기한을 최신 안내와 혼용하지 않는다.","sources":["https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-definitive-regime_en","https://taxation-customs.ec.europa.eu/carbon-border-adjustment-mechanism/cbam-communication-and-news_en","https://www.mss.go.kr/site/smba/ex/bbs/View.do?bcIdx=1070920&cbIdx=86"],"pdf":[],"origin":"기존 자료","summary":"EU 탄소국경조정제도(CBAM)는 2026년 1월 1일부터 본기간에 들어갔다. 2026년 수입분의 첫 연간 신고·인증서 제출 기한은 2027년 9월 30일이다.","verifiedDate":"2026-10-19","id":"issue-023","order":22,"originalTitle":"EU 탄소국경조정제도와 수출기업","prep":{"point":"CBAM은 기후위기 대응이라는 명분이 있지만 기업에게는 새로운 무역 규범입니다.","reason":"탄소를 많이 배출한 제품에 비용을 부과하면 저탄소 생산을 촉진할 수 있습니다. 그러나 중소기업은 배출량 계산, 인증, 설비 투자 비용을 감당하기 어렵기 때문에 준비 없이 시행되면 수출 경쟁력이 약해질 수 있습니다.","example":"적용 예시(제안): 수출기업이 제품별 탄소 자료를 관리하도록 협력업체의 측정·보고 역량 지원을 함께 설계할 수 있습니다.","pointAgain":"성공은 규제 회피가 아니라 배출 감축과 수출 유지가 동시에 되는지로 판단해야 합니다."},"originalNotes":"","evidenceCheck":"2026-10-19 대표 사실 확인: 본기간 개시일, 6개 대상 분야와 첫 연간 신고·인증서 제출 기한을 확인했다. 개별 품목의 CN코드, 50톤 면제기준의 적용·예외, 탄소가격 공제와 인증서 산정은 기업·거래별 최신 법령 확인이 필요하다. 2023년 원규정에 있는 과거 제출기한을 최신 안내와 혼용하지 않는다.","lens":["경제학","경영학","금융","행정학"],"lensQuestion":"비용과 편익이 누구에게 돌아가며 어떤 유인이 생기는지 비교해 보세요.","followup":"중소기업은 배출량 산정과 인증 비용을 감당하기 어렵다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"지방소멸과 생활인구 정책","keywords":"지방소멸 생활인구 지역균형발전 청년유출 관계인구 지역대학","conflict":"지역 생존권 ↔ 선택과 집중·재정 효율","background":"인구가 줄어드는 지역에서 정주인구만 늘리기 어려워지면서 생활인구, 관계인구, 지역대학과 일자리 연계가 중요해졌다.","pro":["지역 의료·교육·교통 유지는 국민의 기본 생활권과 연결된다.","생활인구는 관광과 이주 사이의 현실적 대안이 될 수 있다.","지역대학과 산업을 연계하면 청년 유출을 줄일 수 있다."],"con":["모든 지역을 같은 방식으로 지원하면 재정 효율이 낮아질 수 있다.","일자리 없는 정착 지원은 오래 지속되기 어렵다.","생활인구가 실제 정주로 이어지는지는 불확실하다."],"questions":["지방소멸을 막기 위해 국가가 어디까지 개입해야 하는가?","생활인구 정책의 장점과 한계는 무엇인가?","지역대학 위기와 지역소멸은 어떻게 연결되는가?"],"answer":"지방소멸은 단순히 어느 지역에 사람이 적어지는 문제가 아니라 의료, 교육, 교통, 안전 같은 기본 생활권의 문제입니다. 다만 모든 지역에 같은 시설을 유지하는 방식은 지속되기 어렵습니다. 저는 정주인구만 목표로 하기보다 생활인구와 관계인구를 활용하고, 지역대학·기업·공공기관이 함께 일자리와 교육 기회를 만들어야 한다고 봅니다. 동시에 의료와 교통 같은 필수 서비스는 국가가 최소 기준을 보장해야 합니다. 성과는 인구 숫자만이 아니라 청년 순유출 감소, 생활서비스 접근성, 지역 일자리 유지율로 평가해야 합니다.","check":"생활인구 통계, 지방소멸대응기금 성과, 지역별 청년 유출입","sources":["https://www.mois.go.kr"],"pdf":[{"part":3,"number":3,"title":"수도권 집중과 세종 행정수도 구상","tag":"지역·정치","page":12,"text":"정부가 세종 대통령실 설치와 공공기관 추가 이전을 추진 중이며, 지역균형발전 효과와 민간 일자리·교육·의료 격차 해소 여부가 관\n건이다.","target":"지방소멸과 생활인구 정책"}],"origin":"기존 자료","id":"issue-024","order":23,"originalTitle":"지방소멸과 생활인구 정책","summary":"인구가 줄어드는 지역에서 정주인구만 늘리기 어려워지면서 생활인구, 관계인구, 지역대학과 일자리 연계가 중요해졌다.","prep":{"point":"지방소멸은 단순히 어느 지역에 사람이 적어지는 문제가 아니라 의료, 교육, 교통, 안전 같은 기본 생활권의 문제입니다.","reason":"다만 모든 지역에 같은 시설을 유지하는 방식은 지속되기 어렵습니다. 저는 정주인구만 목표로 하기보다 생활인구와 관계인구를 활용하고, 지역대학·기업·공공기관이 함께 일자리와 교육 기회를 만들어야 한다고 봅니다.","example":"적용 예시(제안): 관광객 수만 늘리는 사업보다 의료·교통·돌봄 접근성과 실제 체류를 함께 살피는 지역 계획을 제안할 수 있습니다.","pointAgain":"성과는 인구 숫자만이 아니라 청년 순유출 감소, 생활서비스 접근성, 지역 일자리 유지율로 평가해야 합니다."},"originalNotes":"정부가 세종 대통령실 설치와 공공기관 추가 이전을 추진 중이며, 지역균형발전 효과와 민간 일자리·교육·의료 격차 해소 여부가 관\n건이다.","evidenceCheck":"생활인구 통계, 지방소멸대응기금 성과, 지역별 청년 유출입","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"모든 지역을 같은 방식으로 지원하면 재정 효율이 낮아질 수 있다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"환경·인구·사회","title":"이민정책과 다문화 사회 통합","keywords":"이민정책 외국인 노동자 다문화 사회통합 인구감소 숙련인력","conflict":"인력 확보 ↔ 사회통합·차별 방지","background":"저출생과 산업 인력 부족 속에서 이민 확대가 논의되지만, 노동권 보호와 지역사회 통합 없이는 갈등이 커질 수 있다.","pro":["인구감소와 돌봄·제조업 인력 부족을 완화할 수 있다.","다양한 문화와 인재 유입은 사회 활력을 높인다.","숙련인력 유치는 산업 경쟁력에 도움이 된다."],"con":["저임금 노동력으로만 활용하면 차별과 착취가 심해진다.","언어·교육·주거 지원이 부족하면 지역 갈등이 커질 수 있다.","국내 노동자의 임금·일자리 불안 우려가 생긴다."],"questions":["이민 확대는 저출생의 해법이 될 수 있는가?","외국인 노동자 정책에서 가장 중요한 권리는 무엇인가?","다문화 사회 통합을 위해 학교가 할 수 있는 일은 무엇인가?"],"answer":"이민정책은 인구 부족을 메우는 수단으로만 접근하면 실패할 가능성이 큽니다. 외국인 노동자가 필요한 산업이 있지만, 이들을 저임금 인력으로만 보면 차별과 사회 갈등이 커집니다. 저는 숙련도에 맞는 체류 경로, 한국어 교육, 노동권 보호, 자녀 교육 지원, 지역 주민과의 교류가 함께 필요하다고 봅니다. 국내 노동자의 불안을 줄이려면 임금 하락을 막는 근로감독과 산업 전환 교육도 중요합니다. 성공은 외국인 수 증가가 아니라 정착률, 권리침해 감소, 지역사회 수용성으로 판단해야 합니다.","check":"외국인력 도입 규모, 이민청·전담기구 논의, 체류자격 개선안","sources":["https://www.moj.go.kr"],"pdf":[{"part":3,"number":16,"title":"외국인력 확대와 이민사회 준비","tag":"인구·인권","page":13,"text":"산업·돌봄 현장의 인력 부족으로 외국인 취업·정주가 확대되면서, 단기 노동력 정책에서 통합·시민권 정책으로의 전환 필요성이 제\n기된다.","target":"이민정책과 다문화 사회 통합"}],"origin":"기존 자료","id":"issue-025","order":24,"originalTitle":"이민정책과 다문화 사회 통합","summary":"저출생과 산업 인력 부족 속에서 이민 확대가 논의되지만, 노동권 보호와 지역사회 통합 없이는 갈등이 커질 수 있다.","prep":{"point":"이민정책은 인구 부족을 메우는 수단으로만 접근하면 실패할 가능성이 큽니다.","reason":"외국인 노동자가 필요한 산업이 있지만, 이들을 저임금 인력으로만 보면 차별과 사회 갈등이 커집니다. 저는 숙련도에 맞는 체류 경로, 한국어 교육, 노동권 보호, 자녀 교육 지원, 지역 주민과의 교류가 함께 필요하다고 봅니다.","example":"적용 예시(제안): 언어 교육과 노동권 안내를 지역 주민과의 교류·진로 지원에 연결하는 통합 프로그램을 생각할 수 있습니다.","pointAgain":"성공은 외국인 수 증가가 아니라 정착률, 권리침해 감소, 지역사회 수용성으로 판단해야 합니다."},"originalNotes":"산업·돌봄 현장의 인력 부족으로 외국인 취업·정주가 확대되면서, 단기 노동력 정책에서 통합·시민권 정책으로의 전환 필요성이 제\n기된다.","evidenceCheck":"외국인력 도입 규모, 이민청·전담기구 논의, 체류자격 개선안","lens":["환경공학","사회학","행정학","사회복지"],"lensQuestion":"개인의 선택과 지역·국가의 제도적 조건을 나누어 살펴보세요.","followup":"저임금 노동력으로만 활용하면 차별과 착취가 심해진다. 이 우려에 대응할 보완책과, 효과를 확인할 기준을 각각 제안해 보세요.","contentStatus":"original-strengthened"},{"priority":"A","field":"교육·의료","title":"학교폭력 기록 보존과 대입 반영","keywords":"학교폭력 학생부 대입 반영 기록 보존 회복적 정의 피해자 보호","conflict":"피해자 보호·책임 ↔ 낙인·회복 기회","background":"학교폭력 조치사항의 학생부 기재와 대입 반영은 책임 강화와 낙인 방지, 피해자 보호와 가해학생 회복 기회가 충돌한다.","pro":["학교폭력의 책임을 무겁게 하여 예방 효과를 기대할 수 있다.","피해자 입장에서는 공정한 책임 인정이 중요하다.","대학도 공동체 생활 역량을 평가할 필요가 있다."],"con":["기록 보존이 과도하면 청소년의 회복 가능성을 막을 수 있다.","사안별 경중과 개선 노력을 구분하지 못할 수 있다.","입시 불이익이 징벌 경쟁으로 흐를 위험이 있다."],"questions":["학교폭력 기록을 대입에 반영하는 것이 공정한가?","피해자 보호와 가해학생 회복을 어떻게 함께 고려할 수 있을까?","학교폭력 예방에서 처벌보다 중요한 것은 무엇인가?"],"answer":"학교폭력은 피해자의 학교생활과 정신건강을 크게 훼손하기 때문에 가볍게 볼 수 없습니다. 대입
