<script>
'use strict';
const rows=JSON.parse(document.getElementById('source-data').textContent);
const $=id=>document.getElementById(id);
const fieldStyles={
 'AI·디지털':['#366c80','#edf5f8'],
 '교육·의료':['#4e7761','#edf5ef'],
 '환경·인구·사회':['#7d7942','#f5f4e9'],
 '경제·노동·금융':['#9c713d','#fbf3e8'],
 '사회·문화·미디어':['#9a5d67','#fbf0f2'],
 '법·정치·국제':['#6e608e','#f3f0fa'],
 '과학·산업·기술':['#4f7586','#edf3f7']
};
const statusLabels={new:'아직 안 읽음',read:'내용 살펴봄',practiced:'계획서 작성함'};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const icon=(name)=>{
 const paths={star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',left:'<path d="m14 6-6 6 6 6"/>',right:'<path d="m10 6 6 6-6 6"/>',arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',download:'<path d="M12 3v12m-4-4 4 4 4-4M4 16v5h16v-5"/>'};
 return `<svg viewBox="0 0 24 24" aria-hidden="true">${paths[name]||paths.arrow}</svg>`;
};
let storageOK=true;
let saved={favorites:[],progress:{},notes:{},checks:{}};
try{const raw=JSON.parse(localStorage.getItem('yd-interview-v4')||'null');if(raw&&typeof raw==='object'){saved={...saved,...raw};if(!Array.isArray(saved.favorites))saved.favorites=[];for(const key of ['progress','notes','checks'])if(!saved[key]||typeof saved[key]!=='object')saved[key]={};}}catch{storageOK=false;}
const state={q:'',field:'',savedOnly:false,status:'',selected:rows[0].id,tab:'understand',seg:'all'};
const fields=[...new Set(rows.map(r=>r.field))];
let toastTimeout,timerInterval,remaining=60,timerDuration=60,timerRunning=false;
const searchable=new Map(rows.map(r=>[r.id,[r.title,r.originalTitle,r.field,r.keywords,r.summary,r.conflict,r.background,...r.pro,...r.con,...r.questions,r.answer,JSON.stringify(r.prep),r.check,r.evidenceCheck,...(r.lens||[])].join(' ').normalize('NFKC').toLowerCase()]));
function persist(){try{localStorage.setItem('yd-interview-v4',JSON.stringify(saved));storageOK=true;}catch{storageOK=false;}}
function toast(message){clearTimeout(toastTimeout);$('toast').textContent=message;$('toast').classList.add('show');toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),2600);}
function current(){return rows.find(r=>r.id===state.selected);}
function statusFor(id){return statusLabels[saved.progress[id]]?saved.progress[id]:'new';}
function filtered(){const tokens=state.q.normalize('NFKC').toLowerCase().trim().split(/\s+/).filter(Boolean);return rows.filter(r=>(!state.field||r.field===state.field)&&(!state.savedOnly||saved.favorites.includes(r.id))&&(!state.status||statusFor(r.id)===state.status)&&tokens.every(t=>searchable.get(r.id).includes(t)));}
function highlighted(s){const parts=String(s??'').split(new RegExp('('+state.q.trim().split(/\s+/).filter(Boolean).map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','ig'));if(!state.q.trim())return esc(s);return parts.map((x,i)=>i%2?`<mark>${esc(x)}</mark>`:esc(x)).join('');}
function colors(field){return fieldStyles[field]||['#356e60','#edf5f0'];}
function fieldStyle(field){const [color,soft]=colors(field);return `--field-color:${color};--field-soft:${soft}`;}
function renderFields(){$('categories').innerHTML=[['', '전체 분야'],...fields.map(f=>[f,f])].map(([id,label])=>`<button class="category" data-field="${esc(id)}" aria-pressed="${state.field===id}" style="${fieldStyle(id)}">${id?'<i class="dot" aria-hidden="true"></i>':''}${esc(label)}<small>${id?rows.filter(r=>r.field===id).length:rows.length}</small></button>`).join('');}
function sourceBlock(r){const links=[...new Set(r.sources||[])].filter(u=>/^https?:\/\//.test(u));return `<section class="content-section"><div class="section-label">사실을 확인하는 습관</div><div class="source-box"><span class="source-status ${r.verifiedDate?'verified':''}">${r.verifiedDate?`공식 자료 일부 대조 · ${esc(r.verifiedDate)}`:'논점 학습용 · 최신 경과 별도 확인'}</span><p class="source-check">${esc(r.evidenceCheck||r.check||'정책·법령의 시행 상태와 수치를 공식 자료에서 확인하세요.')}</p><div class="source-links">${links.map(u=>{let label;try{label=new URL(u).hostname.replace(/^www\./,'');}catch{label='참고 자료';}return `<a href="${esc(u)}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`;}).join('')}</div>${r.originalNotes?`<details><summary>첨부자료의 기록 살펴보기</summary><div class="source-original"><b>원자료 기록</b><br>아래는 첨부자료의 내용입니다. 사건·수치·시행 여부는 현재 사실로 단정하지 않고 공식 자료와 대조하세요.<br><br>${r.originalTitle!==r.title?`원래 제목: ${esc(r.originalTitle)}<br><br>`:''}${esc(r.originalNotes)}</div></details>`:''}</div></section>`;}
function understand(r){return `<section class="content-section"><div class="section-label">01 · 이슈의 맥락</div><h3 class="section-title">왜 중요한 문제일까요?</h3><p class="body-text">${highlighted(r.background)}</p></section><section class="content-section"><div class="section-label">02 · 두 관점 비교</div><h3 class="section-title">주장의 이유와 한계를 함께 보기</h3><div class="perspectives"><div class="perspective"><h4 class="perspective-title">추진·강화의 논거</h4><ul class="points">${r.pro.map(s=>`<li>${highlighted(s)}</li>`).join('')}</ul></div><div class="perspective caution"><h4 class="perspective-title">우려·보완의 논거</h4><ul class="points">${r.con.map(s=>`<li>${highlighted(s)}</li>`).join('')}</ul></div></div><p class="reading-note">한쪽 입장을 외우기보다, 어느 조건에서 주장이 성립하는지 비교해 보세요.</p></section><section class="content-section"><div class="lens"><strong>전공과 연결하기</strong><p>${esc(r.lens.join(' · '))}<br>${esc(r.lensQuestion)}</p></div></section><details class="src"><summary>사실 확인 · 출처 보기</summary>${sourceBlock(r)}</details>`;}

 document.querySelector('.topic[aria-current="true"]')?.scrollIntoView({block:'nearest'});}

 el.style.cssText=fieldStyle(r.field);const list=filtered(),pos=list.findIndex(x=>x.id===r.id),fav=saved.favorites.includes(r.id),sides=String(r.conflict||'').split('↔').map(s=>s.trim()).filter(Boolean);
 el.innerHTML=`<header class="d-head"><button class="back" id="mobile-back">${icon('left')}목록</button><div class="d-meta"><span class="field-tag"><i class="dot"></i>${esc(r.field)}</span><span class="no">No.${r.order+1}</span><button id="favorite" class="star" aria-pressed="${fav}">${icon('star')}${fav?'관심 주제':'관심 저장'}</button></div><h2>${highlighted(r.title)}</h2><p class="summary">${highlighted(r.summary)}</p><div class="cap">핵심 쟁점</div>${sides.length>1?`<div class="vs"><span>${esc(sides[0])}</span><i>↔</i><span>${esc(sides.slice(1).join(' ↔ '))}</span></div>`:`<div class="vs one"><span>${esc(r.conflict)}</span></div>`}</header><div class="tabs" role="tablist">${[['understand','이슈 이해'],['interview','탐구 주제 찾기'],['practice','계획서·기록']].map(([t,l])=>`<button role="tab" id="tab-${t}" data-tab="${t}" aria-selected="${state.tab===t}" tabindex="${state.tab===t?0:-1}">${l}</button>`).join('')}</div><div class="d-body" id="tab-content" role="tabpanel">${state.tab==='understand'?understand(r):state.tab==='interview'?finder(r):planView(r)}</div><footer class="d-foot"><button id="previous" ${pos<=0?'disabled':''}>${icon('left')}이전</button><span>${pos+1} / ${list.length}</span><button id="next" ${pos<0||pos===list.length-1?'disabled':''}>다음${icon('right')}</button></footer>`;}

 if(statusFor(id)==='new'){saved.progress[id]='read';persist();}

 return [[],
 [[`${T}의 현황과 핵심 쟁점(${r.conflict}) 조사`,'신문·공공통계·법령 등 출처가 다른 자료를 3개 이상 비교해 정리'],[`‘${pro}’와 ‘${con}’ 주장 비교`,'두 관점의 근거를 표로 만들고 자료의 신뢰도를 판단']],
 [[`${con}는 우려, 자료로 검증하기`,'공개 통계·사례를 모아 우려가 어떤 조건에서 맞는지 확인'],[`${m} 관점에서 본 ${T}의 영향 분석`,'교과 개념(통계·모형·사례 분석 등)을 적용해 영향 정리']],
 [[`${m} 전공 관점의 ${T} 대안·정책 제안서`,'앞선 조사·검증을 바탕으로 대안과 한계, 필요한 조건을 함께 제시'],[`“${cut(q[1]||q[0])}”에 답하는 소논문·보고서`,'선행 자료를 인용하고 결론과 한계를 구분해 작성']]][g];}
function within(r,g,s){const m=major(r),T=r.title;
 return [['교과 · '+s,`${T} — ${SUBJ[s]}`,'교과 시간에 배운 개념으로 이슈를 해석하고 세특 탐구로 발전'],['동아리',`${T} 쟁점 토론회·자료집 만들기`,'교과 탐구를 팀 활동으로 넓히고 서로 다른 관점을 정리'],['진로활동',`${m} 분야에서 ${T}이(가) 바꾸는 일 조사·발표`,'진로 탐색과 연결해 직업·학문 분야의 변화를 정리'],['자율·학생회',`${T} 관련 학교 캠페인·설문 후 개선안 제안`,'학교 구성원의 의견을 모아 실천 가능한 제안으로 연결'],['독서',`${T} 관련 도서를 읽고 ‘${r.conflict}’ 관점의 서평 쓰기`,'책의 주장과 이슈의 쟁점을 비교해 생각을 확장']];}
function cands(r){const pick=(t,a)=>`<button class="pick" data-pick="${esc(t)}" data-area="${esc(a)}">이 주제로 계획서 쓰기</button>`;
 if(state.mode==='across')return [1,2,3].map(g=>`<section class="gcard"><h4>${GR[g]}<small>${LV[g].split(' — ')[0]}</small></h4><p class="lv">${LV[g].split(' — ')[1]}</p>${across(r,g).map(([t,w])=>`<div class="cand"><b>${esc(t)}</b><p>${esc(w)}</p>${pick(t,GR[g])}</div>`).join('')}</section>`).join('<div class="arrow" aria-hidden="true">↓ 이어서 심화</div>');
 const g=state.g;return `<p class="lv">${GR[g]} ${LV[g]}</p>`+within(r,g,state.subj).map(([k,t,w])=>`<div class="cand"><span class="kind">${esc(k)}</span><b>${esc(t)}</b><p>${esc(w)}</p>${pick(t,`${GR[g]} · ${k}`)}</div>`).join('<div class="arrow" aria-hidden="true">↓ 이어서 연계</div>');}
function finder(r){const btn=(a,v,l,on)=>`<button data-${a}="${v}" aria-pressed="${on}">${l}</button>`;
 return `<div class="mode">${btn('mode','across','횡적 연계 · 학년 간',state.mode==='across')}${btn('mode','within','종적 연계 · 같은 학년 내',state.mode==='within')}</div><p class="hint">${state.mode==='across'?'같은 이슈를 고1에서 고3까지 점점 깊게 이어 가는 주제예요.':'한 학년 안에서 교과와 비교과 활동을 서로 연결하는 주제예요.'}</p><label class="major-box"><b>내 전공·진로</b><input id="major" value="${esc(saved.major)}" placeholder="직접 입력 (예: 의예과, 컴퓨터공학)"></label><div class="chipline">${(r.lens||[]).map(x=>`<button data-major="${esc(x)}" aria-pressed="${saved.major===x}">${esc(x)}</button>`).join('')}</div>${state.mode==='within'?`<div class="chipline">${[1,2,3].map(g=>btn('g',g,GR[g],state.g===g)).join('')}</div><div class="chipline">${Object.keys(SUBJ).map(s=>btn('subj',s,s,state.subj===s)).join('')}</div>`:''}<div id="cands">${cands(r)}</div>`;}

function planView(r){const p=saved.plans[r.id]||{};
 return `<div class="ask"><b>탐구한 내용을 사실대로 적어요</b><p>학생부 문장은 입력한 내용으로 만든 초안이에요. 실제로 한 활동만 담고, 최종 기재는 교사가 확인해 고칩니다. 교외 대회·논문·특허·사교육 기관명 등 기재 불가 항목은 최신 기재요령에서 확인하세요.</p></div><label class="fld"><b>탐구 주제</b><input data-plan="topic" value="${esc(p.topic)}" placeholder="‘탐구 주제 찾기’에서 고르거나 직접 적어요"></label><label class="fld"><b>학년 · 교과/활동</b><input data-plan="area" value="${esc(p.area)}" placeholder="예) 고2 · 과학"></label>${PF.map(([k,l,h])=>`<label class="fld"><b>${l}</b><textarea data-plan="${k}" placeholder="${esc(h)}">${esc(p[k])}</textarea></label>`).join('')}<section class="content-section"><h3 class="section-title">학생부 문장 초안</h3><textarea id="draft" readonly>${esc(draftText(p))}</textarea><div class="row"><button class="solid-button" id="copy-draft">초안 복사</button><button class="btn" id="download-plan">계획서 내려받기</button></div><p class="reading-note">문장 끝을 ‘~함’으로 다듬고, 구체적인 활동과 변화가 드러나게 고쳐 보세요.</p></section><section class="content-section"><h3 class="section-title">교사 확인</h3><label class="fld"><b>교사 의견</b><textarea data-plan="teacher" placeholder="보완할 점이나 확인한 내용을 적어요">${esc(p.teacher)}</textarea></label><label class="chk"><input type="checkbox" data-done ${p.done?'checked':''}> 교사 확인 완료</label></section><section class="content-section"><h3 class="section-title">기록 옮기기</h3><p class="reading-note">학생이 저장한 파일을 교사가 불러와 확인하고, 다시 저장해 학생에게 돌려줄 수 있어요.</p><div class="row"><button class="btn" id="export-all">기록 전체 저장</button><button class="btn" id="import-all">기록 불러오기</button><input type="file" id="import-file" accept=".json" hidden></div></section>`;}

function init(){renderFields();renderList();renderDetail();
 $('q').addEventListener('input',e=>{state.q=e.target.value;refresh();});
 $('categories').addEventListener('click',e=>{const b=e.target.closest('[data-field]');if(!b)return;state.field=b.dataset.field;refresh();});
 $('seg').addEventListener('click',e=>{const b=e.target.closest('[data-seg]');if(b)setSeg(b.dataset.seg);});
 $('list').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)selectIssue(b.dataset.id);});
 document.addEventListener('click',e=>{if(e.target.closest('.reset'))resetFilters();});
 addEventListener('popstate',()=>document.body.classList.remove('detail-open'));
 document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
 $('csv').onclick=exportCSV;$('print').onclick=()=>window.print();
 $('detail').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const redo=()=>{renderDetail();keepTabsTop();};
  if(b.dataset.tab){state.tab=b.dataset.tab;return redo();}
  if(b.dataset.mode){state.mode=b.dataset.mode;return redo();}
  if(b.dataset.g){state.g=Number(b.dataset.g);return redo();}
  if(b.dataset.subj){state.subj=b.dataset.subj;return redo();}
  if(b.dataset.major!==undefined){saved.major=saved.major===b.dataset.major?'':b.dataset.major;persist();return redo();}
  if(b.dataset.pick){const p=saved.plans[state.selected]||={};p.topic=b.dataset.pick;p.area=b.dataset.area;saved.progress[state.selected]='practiced';persist();renderList();state.tab='practice';renderDetail();$('detail').scrollTop=0;toast('탐구 주제를 계획서에 넣었어요.');return;}
  const id=b.id;
  if(id==='favorite'){const is=saved.favorites.includes(state.selected);saved.favorites=is?saved.favorites.filter(x=>x!==state.selected):[...saved.favorites,state.selected];persist();if(state.savedOnly)refresh();else{renderList();renderDetail();}toast(is?'관심 주제에서 해제했습니다.':'관심 주제에 저장했습니다.');}
  if(id==='mobile-back')closeDetail();
  if(id==='previous'||id==='next'){const list=filtered(),i=list.findIndex(r=>r.id===state.selected),target=list[i+(id==='next'?1:-1)];if(target){selectIssue(target.id,false);$('detail').scrollTop=0;}}
  if(id==='copy-draft'){const d=$('draft');d.select();try{document.execCommand('copy');toast('초안을 복사했습니다.');}catch{toast('직접 선택해 복사해 주세요.');}}
  if(id==='download-plan')exportPlan();if(id==='export-all')exportAll();if(id==='import-all')$('import-file').click();
 });
 $('detail').addEventListener('change',e=>{
  if(e.target.matches('[data-done]')){(saved.plans[state.selected]||={}).done=e.target.checked;persist();}
  if(e.target.id==='import-file'&&e.target.files[0]){const fr=new FileReader();fr.onload=()=>importAll(fr.result);fr.readAsText(e.target.files[0]);e.target.value='';}
 });
 $('detail').addEventListener('input',e=>{
  if(e.target.id==='major'){saved.major=e.target.value;persist();$('cands').innerHTML=cands(current());return;}
  const k=e.target.dataset.plan;if(!k)return;const p=saved.plans[state.selected]||={};p[k]=e.target.value;persist();
  if(k!=='teacher'&&e.target.value.trim()&&statusFor(state.selected)!=='practiced'){saved.progress[state.selected]='practiced';persist();renderList();}
  if($('draft'))$('draft').value=draftText(p);
 });
 $('detail').addEventListener('keydown',e=>{if(!e.target.matches('[role="tab"]')||!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const tabs=['understand','interview','practice'];let i=tabs.indexOf(state.tab);i=e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3;state.tab=tabs[i];renderDetail();$(`tab-${state.tab}`).focus();});
}
init();
</script></body></html>
